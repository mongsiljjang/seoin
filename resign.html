<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>사직서 제출</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#17202a; --sub:#5b6672; --line:#e6eaf0;
    --brand:#175cd3; --brand-soft:#e8f0ff; --ok:#138a5b; --warn:#c77800; --danger:#c03434;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    word-break:keep-all; overflow-wrap:anywhere;
    padding:22px 14px 60px;
  }
  .wrap{max-width:520px; margin:0 auto}
  h1{font-size:19px; font-weight:900; margin:0 0 4px}
  .sub{font-size:13px; color:var(--sub); margin:0 0 18px}
  .card{background:var(--card); border-radius:16px; padding:16px 16px 18px; margin-bottom:12px}
  .hint{background:var(--brand-soft); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.75}
  label{display:block; margin-bottom:12px}
  label span{display:block; font-size:12.5px; font-weight:800; color:var(--sub); margin-bottom:5px}
  input,select,textarea{width:100%; border:1px solid var(--line); border-radius:11px;
    padding:12px 13px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink)}
  /* 16px 미만이면 iPhone 사파리가 칸을 누를 때마다 화면을 확대해 버린다. */
  textarea{min-height:90px; resize:vertical; line-height:1.6}
  .row{display:flex; align-items:center; gap:9px}
  .row input[type=checkbox]{width:auto; flex:none; margin:0}
  .btn{display:block; width:100%; border:0; border-radius:12px; background:var(--brand); color:#fff;
    font-size:15px; font-weight:800; padding:14px; cursor:pointer; font-family:inherit}
  .btn[disabled]{background:#c3ccd6; cursor:default}
  .tiny{font-size:12px; color:var(--sub); line-height:1.7}
  .lawcite{font-size:11.5px; font-weight:700; color:var(--sub)}
  .big{font-size:15px; font-weight:800}
  .done{text-align:center; padding:26px 10px}
  .done .mark{font-size:42px; margin-bottom:8px}
</style>

<div class="wrap" id="app">
  <h1>사직서 제출</h1>
  <p class="sub">불러오는 중이에요…</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="window.__noFB=1"></script>
<script src="firebase-config.js" onerror="window.__noCfg=1"></script>
<script>
/* 퇴직자가 로그인 없이 사직서 한 장만 내는 화면.
   앱을 통째로 열어주면 남의 개인정보가 같이 보인다. 그래서 이 페이지는
   주소에 담긴 토큰으로 자기 초대장 한 장을 읽고, 자기 사직서 한 장을 쓴다.
   그 밖에는 아무것도 못 읽는다 — 화면에서 가리는 게 아니라 보안규칙이 막는다.

   자필이어야 한다는 법은 없다. 사직은 의사표시라서 전자문서라는 이유로
   효력이 부인되지 않는다. 다툼이 생기면 쟁점은 '본인이 냈는가' 라서
   낸 시각과 본인 확인(전화 뒤 4자리)을 같이 남긴다.
   근거 · 민법 제660조 · 전자문서 및 전자거래 기본법 제4조 */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const WS = String(qs.get('h')||'clinic').trim().toLowerCase();
const TOKEN = String(qs.get('t')||'').trim();
let fdb=null, inv=null;

function show(html){ $('#app').innerHTML = html; }
function fail(msg, detail){
  show(`<h1>사직서 제출</h1>
    <div class="card"><div class="hint">${msg}</div>
      ${detail?`<p class="tiny" style="margin:10px 2px 0">${esc(detail)}</p>`:''}
      <p class="tiny" style="margin:10px 2px 0">병원에 연락해 <b>새 주소</b>를 받아주세요.</p></div>`);
}

async function start(){
  if(window.__noFB || window.__noCfg || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){
    return fail('지금은 연결이 안 돼요. 잠시 뒤 다시 열어주세요.');
  }
  if(!/^[a-z0-9-]{2,32}$/.test(WS) || TOKEN.length < 8){
    return fail('주소가 올바르지 않아요.');
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    fdb = firebase.firestore();
    await firebase.auth().signInAnonymously();
  }catch(e){ return fail('연결하지 못했어요.', (e&&e.code)||e); }

  const invRef = fdb.collection('hospapp').doc(WS).collection('resigninv').doc(TOKEN);
  let snap;
  try{ snap = await invRef.get(); }
  catch(e){ return fail('이 주소로는 열 수 없어요.', (e&&e.code)||e); }
  if(!snap.exists) return fail('만료됐거나 없는 주소예요.');
  inv = snap.data()||{};

  // 이미 냈으면 다시 못 낸다. 낸 것을 본인이 다시 읽을 수도 없어서 시도해 보고 판단한다.
  form();
}

function form(){
  const today = new Date();
  const t = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  show(`<h1>사직서 제출</h1>
    <p class="sub">${esc(inv.name||'')} 님 · 한 번만 낼 수 있어요</p>

    <div class="card">
      <div class="hint">병원에서 보낸 내용이에요. <b>내 것이 맞는지 먼저 확인</b>해 주세요.</div>
      <div style="margin-top:12px">
        <div class="tiny">이름</div><div class="big">${esc(inv.name||'-')}</div>
        <div class="tiny" style="margin-top:8px">입사일</div><div class="big">${esc(inv.joinDate||'-')}</div>
      </div>
    </div>

    <div class="card">
      <label><span>본인 확인 · 전화번호 뒤 4자리 *</span>
        <input id="p4" inputmode="numeric" maxlength="4" placeholder="0000"></label>
      <label><span>마지막 근무일 *</span>
        <input id="last" type="date" value="${t}"></label>
      <label><span>사직 사유 *</span>
        <select id="why" onchange="whyChange()">
          <option value="개인 사정">개인 사정</option>
          <option value="이직">이직</option>
          <option value="건강상의 이유">건강상의 이유</option>
          <option value="가족 돌봄">가족 돌봄</option>
          <option value="학업">학업</option>
          <option value="기타">기타 (직접 적기)</option>
        </select></label>
      <label id="etcWrap" style="display:none"><span>사유를 적어주세요 *</span>
        <textarea id="etc" placeholder="예: 이사로 통근이 어려워졌습니다"></textarea></label>

      <label class="row" style="margin-top:4px">
        <input type="checkbox" id="ag1">
        <span style="margin:0;font-weight:700;color:var(--ink);font-size:13.5px">위 내용대로 <b>사직할 의사를 밝힙니다.</b></span></label>
      <label class="row">
        <input type="checkbox" id="ag2">
        <span style="margin:0;font-weight:700;color:var(--ink);font-size:13.5px">퇴직 처리를 위해 <b>이 내용을 병원이 보관</b>하는 데 동의합니다.</span></label>

      <button class="btn" style="margin-top:14px" id="go" onclick="submit()">사직서 내기</button>
      <p class="tiny" style="margin:12px 2px 0">낸 뒤에는 고칠 수 없어요. 잘못 냈으면 병원에 말씀해 주세요.<br>
        <span class="lawcite">사직서는 정해진 서식이 없고, 전자문서라는 이유로 효력이 부인되지 않습니다 · 전자문서 및 전자거래 기본법 제4조</span></p>
    </div>`);
}
function whyChange(){ $('#etcWrap').style.display = $('#why').value==='기타' ? '' : 'none'; }

async function submit(){
  const p4=($('#p4').value||'').trim(), last=$('#last').value||'';
  const why=$('#why').value, etc=($('#etc')&&$('#etc').value||'').trim();
  const reason = why==='기타' ? etc : why;
  if(!/^\d{4}$/.test(p4)) return alert('전화번호 뒤 4자리를 넣어주세요.');
  if(!last) return alert('마지막 근무일을 골라주세요.');
  if(!reason) return alert('사직 사유를 적어주세요.');
  if(!$('#ag1').checked || !$('#ag2').checked) return alert('두 가지에 모두 동의해 주셔야 냅니다.');

  const btn=$('#go'); btn.disabled=true; btn.textContent='내는 중이에요…';
  try{
    await fdb.collection('hospapp').doc(WS).collection('resignsub').doc(TOKEN).set({
      reason, lastDay:last, phone4:p4, agreed:true,
      at:new Date().toISOString(), device:(navigator.userAgent||'').slice(0,120)
    });
    show(`<div class="card done">
      <div class="mark">✅</div>
      <div class="big">사직서를 냈어요</div>
      <p class="tiny" style="margin-top:8px">${esc(inv.name||'')} 님 · 마지막 근무일 ${esc(last)}</p>
      <p class="tiny" style="margin-top:10px">병원이 확인하면 퇴직 처리가 진행됩니다.<br>이 창은 닫으셔도 됩니다.</p>
    </div>`);
  }catch(e){
    btn.disabled=false; btn.textContent='사직서 내기';
    const code=(e&&e.code)||'';
    alert(code==='permission-denied'
      ? '이미 낸 사직서가 있거나 주소가 만료됐어요. 병원에 문의해 주세요.'
      : '내지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  }
}
start();
</script>
