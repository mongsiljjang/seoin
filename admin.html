<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MediOps 제작자 콘솔</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#17202a; --sub:#5b6672; --line:#e6eaf0;
    --brand:#175cd3; --brand-soft:#e8f0ff; --ok:#138a5b; --ok-soft:#e5f5ee;
    --warn:#c77800; --warn-soft:#fdf1db; --danger:#c03434; --danger-soft:#fbe9e9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    word-break:keep-all; overflow-wrap:anywhere; padding:20px 14px 60px;
  }
  .wrap{max-width:720px; margin:0 auto}
  h1{font-size:19px; font-weight:900; margin:0 0 3px}
  h2{font-size:13px; font-weight:800; color:var(--sub); margin:22px 2px 9px}
  .sub{font-size:12.5px; color:var(--sub); margin:0 0 16px}
  .card{background:var(--card); border-radius:16px; padding:15px 16px; margin-bottom:10px}
  .hint{background:var(--brand-soft); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.75}
  .warn{background:var(--warn-soft)}
  .danger{background:var(--danger-soft)}
  .row{display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  .grow{flex:1 1 auto; min-width:0}
  .btn{border:0; border-radius:11px; background:var(--brand); color:#fff; font-family:inherit;
    font-size:13px; font-weight:800; padding:9px 12px; cursor:pointer}
  .btn.soft{background:#eef4f6; color:var(--ink)}
  .btn.warn{background:var(--warn)} .btn.danger{background:var(--danger)} .btn.ok{background:var(--ok)}
  .btn[disabled]{background:#c3ccd6; cursor:default}
  .pill{display:inline-flex; align-items:center; border-radius:999px; padding:3px 10px;
    font-size:11.5px; font-weight:800; background:#eef2f4; color:#3d4a54}
  .pill.ok{background:var(--ok-soft); color:#0d6b46}
  .pill.warn{background:var(--warn-soft); color:#8a5400}
  .pill.danger{background:var(--danger-soft); color:#8f2525}
  .tiny{font-size:12px; color:var(--sub); line-height:1.7}
  .name{font-size:15.5px; font-weight:800}
  code{font-family:ui-monospace,Menlo,monospace; background:#eef2f4; padding:2px 6px; border-radius:6px; font-size:12.5px}
  input,select{border:1px solid var(--line); border-radius:10px; padding:9px 11px;
    font-size:14px; font-family:inherit; background:#fff; color:var(--ink)}
</style>

<div class="wrap" id="app"><h1>MediOps 제작자 콘솔</h1><p class="sub">확인 중이에요…</p></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="window.__noFB=1"></script>
<script src="firebase-config.js" onerror="window.__noCfg=1"></script>
<script>
/* 제작자 콘솔 — 병원을 열어주고 구독 기한을 잡는 자리.
   병원 앱과 파일을 나눈 이유는 둘이다. 병원 직원이 볼 일이 없고,
   여기를 고치다 병원 앱을 망가뜨리면 안 된다.

   여기서 할 수 있는 일은 전부 '문을 여닫는 일' 이다.
   병원 안 자료 — 직원 명단·PIN·급여·계약서·재고 — 는 이 화면에서 못 읽는다.
   화면에서 가리는 게 아니라 보안규칙이 막는다. 규칙 시험으로 확인했다.

   딱 하나 정직하게 짚어둘 것 — 비밀번호 초기화를 할 수 있다는 것은
   마음만 먹으면 어느 병원의 문이든 열 수 있다는 뜻이다. 기술로는 막을 수 없다.
   그래서 초기화하면 그 병원 화면에 기록이 남게 했고, 위탁 계약서에도 적어야 한다.
   근거 · 개인정보 보호법 제26조 */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fdb=null, myUid='', reqs=[], hosps=[], cfg={};

const TS = d => firebase.firestore.Timestamp.fromDate(d);
const toDate = p => { try{ return p && p.toDate ? p.toDate() : (p? new Date(p) : null); }catch(e){ return null; } };
const ymd = d => d? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : '-';
const daysLeft = d => d? Math.ceil((d - Date.now())/86400000) : null;
const nowIso = () => new Date().toISOString();

async function start(){
  if(window.__noFB || window.__noCfg || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){
    return show(`<div class="card"><div class="hint danger">연결 설정을 못 읽었어요. <code>firebase-config.js</code> 를 확인해 주세요.</div></div>`);
  }
  if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  fdb = firebase.firestore();
  try{ const u = await firebase.auth().signInAnonymously(); myUid = u.user.uid; }
  catch(e){ return show(`<div class="card"><div class="hint danger">로그인하지 못했어요 — ${esc((e&&e.code)||e)}</div></div>`); }

  let isOp=false, denied=false;
  try{ isOp = (await fdb.collection('operators').doc(myUid).get()).exists; }
  catch(e){ denied = ((e&&e.code)||'') === 'permission-denied'; }
  if(!isOp) return notOperator(denied);
  await load();
}

function show(html){ $('#app').innerHTML = `<h1>MediOps 제작자 콘솔</h1>` + html; }

function notOperator(denied){
  /* 읽기 자체가 막혔다면 규칙이 아직 옛 판이다 — 문서를 아무리 만들어도 안 보인다.
     둘을 구별해 주지 않으면 사람이 같은 자리를 몇 번이고 다시 만들게 된다. */
  const 규칙먼저 = denied
    ? `<div class="hint danger" style="margin-bottom:10px"><b>보안규칙이 아직 옛 판입니다.</b>
         지금은 문서를 만들어도 앱이 읽지 못해요. Firebase 콘솔 → Firestore Database →
         <b>규칙</b> 탭에 새 <code>firestore.rules</code> 를 붙여넣고 <b>게시</b>부터 해주세요.</div>`
    : '';
  show(`<p class="sub">이 기기는 아직 제작자로 등록되지 않았어요.</p>
    <div class="card">
      ${규칙먼저}
      <div class="hint warn">앱 안에서는 제작자를 만들 수 없습니다. <b>Firebase 콘솔에서 한 번만</b> 넣어주세요 —
        앱에 뒷문을 두면 누구나 열 수 있기 때문입니다.</div>
      <p class="tiny" style="margin:12px 2px 6px"><b>이 기기 번호</b></p>
      <div class="row"><code class="grow">${esc(myUid)}</code>
        <button class="btn soft" onclick="copyUid()">복사</button></div>
      <p class="tiny" style="margin:14px 2px 0">
        <b>1.</b> Firebase 콘솔 → Firestore Database → 데이터<br>
        <b>2.</b> 최상위에 <code>operators</code> 컬렉션 시작<br>
        <b>3.</b> 문서 ID 에 위 번호를 붙여넣고, 필드 <code>name</code> 에 아무 이름<br>
        <b>4.</b> 저장한 뒤 이 화면을 <b>새로고침</b><br><br>
        번호는 이 브라우저에 저장됩니다. <b>사이트 데이터를 지우거나 시크릿 모드로 열면 번호가 바뀝니다.</b><br>
        <b>두 대를 등록해 두세요</b> — 잃어도 콘솔에서 새 번호를 넣으면 되지만,
        그러려면 구글 계정과 2단계 인증이 있어야 합니다. 한 대는 예비로 두는 편이 낫습니다.</p>
    </div>`);
}
function copyUid(){
  (navigator.clipboard? navigator.clipboard.writeText(myUid) : Promise.reject())
    .then(()=>alert('복사했어요'), ()=>alert('길게 눌러 복사해 주세요'));
}

async function load(){
  try{ cfg = (await fdb.collection('config').doc('main').get()).data() || {}; }catch(e){ cfg={}; }
  reqs=[]; hosps=[];
  try{ (await fdb.collection('hospreq').get()).forEach(d=>reqs.push(Object.assign({ws:d.id}, d.data()||{}))); }catch(e){}
  try{ (await fdb.collection('hospitals').get()).forEach(d=>hosps.push(Object.assign({ws:d.id}, d.data()||{}))); }catch(e){}
  for(const h of hosps){
    try{ h.lic = (await fdb.collection('hospapp').doc(h.ws).collection('license').doc('main').get()).data() || null; }
    catch(e){ h.lic=null; }
  }
  render();
}

function licPill(h){
  if(!h.lic) return `<span class="pill">기한 없음</span>`;
  if(h.lic.status==='suspended') return `<span class="pill danger">멈춤</span>`;
  const n = daysLeft(toDate(h.lic.paidUntil));
  if(n==null) return `<span class="pill">기한 없음</span>`;
  if(n<=0) return `<span class="pill danger">끝남</span>`;
  if(n<=7) return `<span class="pill warn">${n}일 남음</span>`;
  return `<span class="pill ok">${n}일 남음</span>`;
}

function render(){
  const on = cfg.requireApproval===true;
  const reqRows = reqs.length ? reqs.map(r=>`<div class="card">
      <div class="name">${esc(r.name||r.ws)}</div>
      <div class="tiny">코드 <code>${esc(r.ws)}</code> · 연락처 ${esc(r.contact||'-')}</div>
      <div class="row" style="margin-top:9px">
        <button class="btn ok" onclick="approve('${esc(r.ws)}','${esc(r.name||'')}')">개통 승인 · 체험 30일</button>
        <button class="btn soft" onclick="dropReq('${esc(r.ws)}')">신청 지우기</button>
      </div></div>`).join('')
    : `<div class="card"><span class="tiny">기다리는 신청이 없어요.</span></div>`;

  const hospRows = hosps.length ? hosps.slice().sort((a,b)=>String(a.ws).localeCompare(String(b.ws))).map(h=>{
    const until = toDate(h.lic && h.lic.paidUntil);
    const bill = (h.lic && h.lic.billing) || {};
    return `<div class="card">
      <div class="row"><div class="grow">
        <div class="name">${esc(h.name||h.ws)} ${licPill(h)}</div>
        <div class="tiny">코드 <code>${esc(h.ws)}</code> · ${h.approved? '개통됨':'<b style="color:var(--warn)">미승인</b>'}
          ${until? ' · '+ymd(until)+' 까지':''}</div>
        <div class="tiny">결제 ${esc(bill.provider||'manual')} · ${esc(bill.status||'none')}
          ${bill.lastPaidAt? ' · 마지막 '+esc(String(bill.lastPaidAt).slice(0,10)):''}</div>
      </div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="extend('${esc(h.ws)}',1)">+1개월</button>
        <button class="btn soft" onclick="extend('${esc(h.ws)}',3)">+3개월</button>
        <button class="btn soft" onclick="extend('${esc(h.ws)}',12)">+1년</button>
        <button class="btn soft" onclick="setUntil('${esc(h.ws)}')">날짜 지정</button>
      </div>
      <div class="row" style="margin-top:7px">
        ${h.lic && h.lic.status==='suspended'
          ? `<button class="btn ok" onclick="suspend('${esc(h.ws)}',false)">다시 열기</button>`
          : `<button class="btn warn" onclick="suspend('${esc(h.ws)}',true)">잠시 멈추기</button>`}
        <button class="btn danger" onclick="resetOwner('${esc(h.ws)}','${esc(h.name||h.ws)}')">비밀번호 초기화</button>
        <a class="btn soft" style="text-decoration:none" href="./?h=${encodeURIComponent(h.ws)}" target="_blank">병원 앱 열기</a>
      </div></div>`;
  }).join() : `<div class="card"><span class="tiny">아직 등록된 병원이 없어요.</span></div>`;

  show(`<p class="sub">병원을 열어주고 기간을 잡는 자리예요. <b>병원 안 자료는 여기서 못 봅니다.</b></p>

    <div class="card">
      <div class="row"><div class="grow">
        <div class="name">새 병원은 승인을 받아야 열림</div>
        <div class="tiny">${on
          ? '켜져 있어요 — 승인하지 않은 병원은 첫 관리자를 만들 수 없습니다.'
          : '<b style="color:var(--warn)">꺼져 있어요</b> — 주소를 아는 사람은 누구나 새 병원을 열 수 있습니다.'}</div>
      </div>
      <button class="btn ${on?'soft':''}" onclick="toggleApproval(${!on})">${on?'끄기':'켜기'}</button></div>
    </div>

    <h2>개설 신청 ${reqs.length?`(${reqs.length})`:''}</h2>
    ${reqRows}

    <h2>병원 ${hosps.length?`(${hosps.length})`:''}</h2>
    ${hospRows}
    <div class="card" style="margin-top:8px">
      <div class="row"><div class="grow">
        <div class="tiny">콘솔이 생기기 전부터 쓰던 병원은 여기 안 나옵니다.
          코드를 알면 명부에 올릴 수 있어요 — <b>병원 안 자료는 그대로 있습니다.</b></div>
      </div>
      <button class="btn soft" onclick="addExisting()">쓰던 병원 등록</button></div>
    </div>

    <div class="card" style="margin-top:18px">
      <div class="hint">여기서 못 하는 것 — <b>직원 명단 · PIN · 급여 · 근로계약서 · 재고</b>는 제작자도 읽지 못합니다.
        화면에서 가린 게 아니라 서버가 막습니다.<br><br>
        <b>비밀번호 초기화</b>를 하면 그 병원 화면에 기록이 남습니다. 남의 병원 문을 여는 일이라
        말없이 하면 안 됩니다.</div>
      <p class="tiny" style="margin:12px 2px 0">자동결제는 아직 붙이지 않았습니다. 붙이더라도 결제사가
        <b>같은 기한 칸</b>을 미루게 되어 있어서, 그때 이 화면과 앱을 고칠 일은 없습니다.</p>
    </div>`);
}

async function toggleApproval(v){
  if(v && !confirm('켜면 승인하지 않은 병원은 새로 열 수 없습니다. 계속할까요?')) return;
  try{ await fdb.collection('config').doc('main').set({requireApproval:!!v, at:nowIso()}, {merge:true}); await load(); }
  catch(e){ alert('바꾸지 못했어요 — '+((e&&e.code)||e)); }
}
async function approve(ws, name){
  const nm = prompt('병원 이름', name||ws); if(nm===null) return;
  try{
    await fdb.collection('hospitals').doc(ws).set({name:nm, approved:true, at:nowIso()}, {merge:true});
    const until = new Date(); until.setDate(until.getDate()+30);
    await fdb.collection('hospapp').doc(ws).collection('license').doc('main').set({
      paidUntil: TS(until), status:'trial', plan:'체험',
      billing:{provider:'manual', status:'none'}, at:nowIso()
    }, {merge:true});
    await fdb.collection('hospreq').doc(ws).delete().catch(()=>{});
    alert(`${nm} 개통했어요 — 체험 30일`);
    await load();
  }catch(e){ alert('승인하지 못했어요 — '+((e&&e.code)||e)); }
}
// 콘솔보다 먼저 열린 병원은 hospreq 를 거치지 않아서 명부에 없다.
// 그러면 기한도 못 잡고 목록에도 안 나온다. 코드를 알면 올릴 수 있게 한다.
// 기한은 일부러 안 만든다 — 쓰고 있는 병원에 체험 30일을 찍으면 한 달 뒤 잠긴다.
async function addExisting(){
  const ws = (prompt('병원 코드 (주소의 ?h= 뒤에 붙는 값)', 'clinic')||'').trim().toLowerCase();
  if(!ws) return;
  if(!/^[a-z0-9-]{2,32}$/.test(ws)) return alert('코드는 영문 소문자·숫자·하이픈만 됩니다.');
  if(hosps.some(h=>h.ws===ws)) return alert('이미 명부에 있어요.');
  const nm = (prompt('병원 이름', '')||'').trim();
  if(!nm) return;
  try{
    await fdb.collection('hospitals').doc(ws).set({name:nm, approved:true, at:nowIso()}, {merge:true});
    alert(`${nm} 을(를) 명부에 올렸어요. 기한은 아직 없습니다 — 없으면 안 잠깁니다.`);
    await load();
  }catch(e){ alert('올리지 못했어요 — '+((e&&e.code)||e)); }
}
async function dropReq(ws){
  if(!confirm('이 신청을 지울까요?')) return;
  try{ await fdb.collection('hospreq').doc(ws).delete(); await load(); }
  catch(e){ alert('지우지 못했어요 — '+((e&&e.code)||e)); }
}
async function extend(ws, months){
  const h = hosps.find(x=>x.ws===ws); if(!h) return;
  const cur = toDate(h.lic && h.lic.paidUntil);
  // 이미 끝났으면 오늘부터 센다. 끝난 기간을 채워주는 것이 아니라 오늘부터 쓰는 것이다.
  const base = (cur && cur > new Date()) ? new Date(cur) : new Date();
  base.setMonth(base.getMonth()+months);
  await writeLicense(ws, {paidUntil: TS(base), status:'active'}, `${months}개월 연장 · ${ymd(base)} 까지`);
}
async function setUntil(ws){
  const h = hosps.find(x=>x.ws===ws); if(!h) return;
  const cur = toDate(h.lic && h.lic.paidUntil);
  const v = prompt('언제까지 쓸 수 있나요? (YYYY-MM-DD)', ymd(cur||new Date()));
  if(!v) return;
  const d = new Date(v+'T23:59:59');
  if(isNaN(d)) return alert('날짜를 YYYY-MM-DD 로 넣어주세요');
  await writeLicense(ws, {paidUntil: TS(d), status:'active'}, `기한을 ${ymd(d)} 로 바꿈`);
}
async function suspend(ws, on){
  if(on && !confirm('멈추면 그 병원은 자료를 받지 못합니다. 자료가 지워지지는 않아요. 계속할까요?')) return;
  await writeLicense(ws, {status: on? 'suspended':'active'}, on? '사용을 멈춤' : '다시 열음');
}
async function writeLicense(ws, patch, what){
  try{
    await fdb.collection('hospapp').doc(ws).collection('license').doc('main')
      .set(Object.assign({at:nowIso()}, patch), {merge:true});
    await log(ws, what);
    await load();
  }catch(e){ alert('바꾸지 못했어요 — '+((e&&e.code)||e)); }
}
async function resetOwner(ws, name){
  if(!confirm(`${name} 의 최고관리자 아이디·비밀번호를 지웁니다.\n\n그 병원은 전화번호+PIN 으로 들어가 다시 정해야 합니다.\n이 일은 그 병원 화면에 기록으로 남습니다.\n\n계속할까요?`)) return;
  try{
    await fdb.collection('hospapp').doc(ws).collection('ownerkey').doc('main').delete();
    await log(ws, '최고관리자 아이디·비밀번호를 초기화했어요');
    alert('초기화했어요. 병원에 알려주세요 — 설정에서 다시 정해야 합니다.');
    await load();
  }catch(e){ alert('초기화하지 못했어요 — '+((e&&e.code)||e)); }
}
// 병원도 봐야 하는 기록이다. 남의 병원에 손대고 아무도 모르게 두면 안 된다.
async function log(ws, what){
  try{
    await fdb.collection('hospapp').doc(ws).collection('opslog')
      .doc(String(Date.now())).set({what, at: nowIso()});
  }catch(e){}
}
start();
</script>
