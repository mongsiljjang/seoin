function saveStaff(id){
  const name=$('#sName').value.trim(); if(!name){ toast('이름을 입력하세요'); return; }
  const phone=normPhone($('#sPhone').value); if(!phone){ toast('전화번호(로그인 ID)를 입력해야 저장돼요'); return; }
  // 같은 번호를 쓰는 사람이 있어도 막지 않는다(집 전화를 같이 쓰거나 번호를
  // 바꾸는 중일 수 있다). 대신 로그인은 번호+PIN 으로 찾으므로 PIN 이 겹치면
  // 누구인지 가릴 수가 없다 — 그때만 막는다.
  const sameNum=DB.staff.filter(x=>x.id!==id && normPhone(x.phone)===phone);
  const sEdit=id?staffById(id):null;
  // 권한 변경과 PIN 재설정은 오너만 — 인사담당자가 오너 계정을 건드리지 못하게
  const roleSel=$('#sRole');
  const role = roleSel ? ([ROLE_STAFF,ROLE_HR,ROLE_OWNER].includes(roleSel.value)?roleSel.value:ROLE_STAFF)
                       : ((sEdit&&sEdit.role)||ROLE_STAFF);
  const pinEl=$('#sPin'); const pinIn=pinEl?(pinEl.value||'').trim():'';
  const annualAuto = $('#sAnnualAuto') ? $('#sAnnualAuto').checked : true;
  const jd=$('#sJoin').value;
  const annualTotal = annualAuto ? (annualByService(jd) ?? Math.max(0,parseInt($('#sAnnual').value,10)||0))
                                 : Math.max(0,parseInt($('#sAnnual').value,10)||0);
  const empno=((document.querySelector('#sEmpNo')||{}).value||'').trim();
  if(empno && DB.staff.some(x=>x.id!==id && String(x.empno||'')===empno)){
    toast('이미 쓰고 있는 사번이에요'); return; }
  const duties=[...document.querySelectorAll('#sDuties input:checked')].map(x=>x.value);
  const base={ name, dept:$('#sDept').value.trim(), position:$('#sPos').value.trim(),
    joinDate:jd, annualAuto, annualTotal, phone, role, duties, empno };
  if(id){
    const s=staffById(id);
    if(pinIn){ if(!/^\d{4,8}$/.test(pinIn)){ toast('PIN은 숫자 4~8자리'); return; } base.pin=pinIn; }
    const myPin=String(base.pin!=null?base.pin:(s.pin||''));
    if(sameNum.some(x=>String(x.pin||'')===myPin)){
      toast('같은 번호를 쓰는 분과 PIN이 같아요 — PIN을 다르게 정해주세요'); return; }
    if(s.role===ROLE_OWNER && role!==ROLE_OWNER){
      const others=DB.staff.filter(x=>x.id!==id && x.role===ROLE_OWNER && x.active!==false);
      if(!others.length){ toast('최소 1명의 최고관리자가 필요해요'); return; }
    }
    Object.assign(s, base);
  } else {
    if(!/^\d{4,8}$/.test(pinIn)){ toast('개인 PIN을 숫자 4~8자리로 정하세요'); return; }
    if(sameNum.some(x=>String(x.pin||'')===pinIn)){
      toast('같은 번호를 쓰는 분과 PIN이 같아요 — PIN을 다르게 정해주세요'); return; }
    DB.staff.push({id:uid(), ...base, pin:pinIn, active:true, createdAt:now()});
  }
  saveDB(); closeModal(); renderStaff(); renderHome(); applyRole(); toast('저장되었습니다');
}
function delStaff(id){
  if(!isOwner()){ toast('직원 삭제는 최고관리자만 할 수 있어요'); return; }
  const s=staffById(id);
  if(s && s.role===ROLE_OWNER){
    const others=DB.staff.filter(x=>x.id!==id && x.role===ROLE_OWNER && x.active!==false);
    if(!others.length){ toast('마지막 최고관리자는 삭제할 수 없어요'); return; }
  }
  if(!confirm('이 직원을 삭제할까요? 출퇴근·연월차 기록도 함께 삭제됩니다. (퇴사 처리를 권장)')) return;
  DB.staff=DB.staff.filter(s=>s.id!==id);
  DB.attendance=DB.attendance.filter(a=>a.staffId!==id);
  DB.leaves=DB.leaves.filter(l=>l.staffId!==id);
  if(sessionId()===id) setSession('');
  saveDB(); closeModal(); renderStaff(); renderHome(); applyRole(); toast('삭제되었습니다');
}


/* ========================================================================
   노무 — 공지 · 근로계약서 · 급여명세서 · 사직서 · 직원 1페이지
   ------------------------------------------------------------------------
   이 앱은 데이터 전체를 JSON 한 덩어리로 Firestore 문서 하나에 넣고, 모든
   기기가 그걸 통째로 내려받는다. 그래서 화면에서 가리는 것만으로는 급여를
   못 지킨다 — 직원 폰에 이미 내려와 있기 때문이다.
   그래서 금액과 계약서 본문은 **브라우저에서 암호로 잠근 뒤** DB에 넣는다.
   열쇠는 오너·인사담당자 머릿속에만 있고 어디에도 저장하지 않는다.
   (제대로 된 해법 — Firebase Auth + 문서 분리 + 보안규칙 — 은 로드맵에 있다)
   ======================================================================== */

/* ---- 급여 열쇠 ---------------------------------------------------------
   PBKDF2 로 열쇠를 만들고 AES-GCM 으로 잠근다. 둘 다 브라우저에 들어 있어
   라이브러리도 서버도 필요 없다. 다만 https 에서만 동작한다. */
const PAY_TTL = 3*60*1000;                 // 3분 지나면 다시 잠긴다
const PAY_ITER = 250000;
let payKeyCache=null, payKeyAt=0, payAfter=null;

function cryptoOK(){ return !!(window.crypto && window.crypto.subtle && window.isSecureContext); }
function b64e(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function b64d(str){ const bin=atob(String(str||'')), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

async function payDerive(pass, saltB64){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(saltB64), iterations:PAY_ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function payEnc(key, obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return b64e(iv)+'.'+b64e(ct);
}
async function payDec(key, blob){
  const p=String(blob||'').split('.'); if(p.length!==2) return null;
  try{
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(p[0])}, key, b64d(p[1]));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }               // 열쇠가 틀리면 여기로 온다
}
function payUnlocked(){ if(payKeyCache && Date.now()-payKeyAt<PAY_TTL) return payKeyCache; payKeyCache=null; return null; }
function payRelock(){ payKeyCache=null; payKeyAt=0; }

// 급여를 만지는 모든 길목은 여기를 지난다
function withPayKey(fn){
  if(!isHR()){ toast('급여는 최고관리자와 인사담당자만 볼 수 있어요'); return; }
  if(!cryptoOK()){ toast('이 브라우저에서는 급여 잠금을 쓸 수 없어요 — https 주소로 열어주세요'); return; }
  const k=payUnlocked();
  if(k){ payKeyAt=Date.now(); fn(k); return; }
  payAfter=fn;
  DB.payLock? openPayUnlock() : openPayKeySetup();
}
function hrLog(kind, memo){
  if(!Array.isArray(DB.hrLogs)) DB.hrLogs=[];
  const u=currentUser();
  DB.hrLogs.unshift({id:uid(), at:now(), by:u?u.id:'', byName:u?u.name:'', kind, memo:memo||''});
  if(DB.hrLogs.length>400) DB.hrLogs=DB.hrLogs.slice(0,400);
}

function openPayUnlock(){
  modal(`<h3>🔐 급여 열쇠</h3>
    <div class="tiny muted" style="margin:-6px 2px 12px">급여와 근로계약서는 잠겨 있어요. 열쇠를 넣으면 <b>3분간</b> 열립니다.</div>
    <label class="field"><span>급여 열쇠</span>
      <input id="pkPass" type="password" placeholder="열쇠" autocomplete="off"
        onkeydown="if(event.key==='Enter')doPayUnlock()"></label>
    <button class="btn block" onclick="doPayUnlock()">열기</button>
    <div class="tiny muted" style="margin-top:12px">열쇠를 잊으셨으면 최고관리자가 <b>설정 → 급여 열쇠</b> 에서 다시 정할 수 있어요(기존 급여 기록은 지워집니다).</div>`);
  setTimeout(()=>{ const e=$('#pkPass'); if(e) e.focus(); },80);
}
async function doPayUnlock(){
  const pass=($('#pkPass').value||''); if(!pass){ toast('열쇠를 넣어주세요'); return; }
  const btn=$('#pkPass').parentElement.parentElement.querySelector('.btn');
  if(btn){ btn.disabled=true; btn.textContent='여는 중…'; }
  try{
    const key=await payDerive(pass, DB.payLock.salt);
    const chk=await payDec(key, DB.payLock.check);
    if(!chk || chk.v!=='mediops'){ toast('열쇠가 맞지 않아요'); if(btn){btn.disabled=false;btn.textContent='열기';} return; }
    payKeyCache=key; payKeyAt=Date.now();
    closeModal();
    const fn=payAfter; payAfter=null; if(fn) fn(key);
  }catch(e){ toast('열지 못했어요'); if(btn){btn.disabled=false;btn.textContent='열기';} }
}

function openPayKeySetup(){
  if(!isOwner()){ toast('급여 열쇠는 최고관리자가 정해요'); return; }
  if(!cryptoOK()){ toast('https 주소로 열어야 급여 잠금을 쓸 수 있어요'); return; }
  const has=!!DB.payLock;
  modal(`<h3>🔐 급여 열쇠 ${has?'변경':'정하기'}</h3>
    <div class="hint">급여와 근로계약서는 이 열쇠로 잠겨 저장돼요. <b>열쇠는 앱에도 서버에도 저장하지 않습니다</b> — 잊으면 아무도 못 엽니다. 종이에 적어 따로 보관하세요.</div>
    ${has?`<label class="field"><span>지금 열쇠</span><input id="pkOld" type="password" autocomplete="off"></label>`:''}
    <label class="field"><span>${has?'새 ':''}열쇠 (8자 이상)</span><input id="pkNew" type="password" autocomplete="off"></label>
    <label class="field"><span>한 번 더</span><input id="pkNew2" type="password" autocomplete="off"></label>
    <div class="tiny muted" style="margin:-4px 2px 12px">직원 로그인 PIN과 <b>다르게</b> 정하세요. PIN은 4자리라 열쇠로 쓰면 잠근 뜻이 없어집니다.</div>
    <button class="btn block" onclick="doPayKeySave()">${has?'열쇠 바꾸고 다시 잠그기':'이 열쇠로 잠그기'}</button>
    ${has?`<div class="divider"></div>
      <button class="btn soft block" style="color:var(--danger)" onclick="doPayKeyReset()">열쇠를 잊었어요 — 다시 정하기</button>
      <div class="tiny muted" style="margin-top:8px">누르면 <b>지금까지 저장된 급여명세서와 근로계약서 본문이 지워집니다.</b> 원본은 세무사·급여프로그램에 있으니 다시 올리시면 돼요.</div>`:''}`);
}
async function doPayKeySave(){
  const has=!!DB.payLock;
  const np=($('#pkNew').value||''), np2=($('#pkNew2').value||'');
  if(np.length<8){ toast('열쇠는 8자 이상으로 정해주세요'); return; }
  if(np!==np2){ toast('두 번 넣은 열쇠가 달라요'); return; }
  const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
  const newKey=await payDerive(np, salt);
  let oldKey=null;
  if(has){
    const op=($('#pkOld').value||'');
    if(!op){ toast('지금 열쇠를 넣어주세요'); return; }
    oldKey=await payDerive(op, DB.payLock.salt);
    const chk=await payDec(oldKey, DB.payLock.check);
    if(!chk || chk.v!=='mediops'){ toast('지금 열쇠가 맞지 않아요'); return; }
    // 잠긴 것을 모두 열어 새 열쇠로 다시 잠근다
    const boxes=[...(DB.payslips||[]), ...(DB.contracts||[])];
    for(const b of boxes){
      if(!b.enc) continue;
      const plain=await payDec(oldKey, b.enc);
      if(plain===null){ toast('예전 기록 하나를 열지 못해 멈췄어요'); return; }
      b.enc=await payEnc(newKey, plain);
    }
  }
  DB.payLock={salt, check:await payEnc(newKey,{v:'mediops'}), at:now(), by:(currentUser()||{}).id||''};
  payKeyCache=newKey; payKeyAt=Date.now();
  hrLog('열쇠', has?'급여 열쇠 변경':'급여 열쇠 처음 설정');
  saveDB(); closeModal(); toast(has?'열쇠를 바꾸고 다시 잠갔어요':'급여 열쇠를 정했어요');
}
async function doPayKeyReset(){
  const n=(DB.payslips||[]).length+(DB.contracts||[]).length;
  if(!confirm(`지금까지 저장된 급여명세서·근로계약서 ${n}건이 지워집니다.\n정말 열쇠를 다시 정할까요?`)) return;
  DB.payslips=[]; DB.contracts=[]; DB.payLock=null; payRelock();
  hrLog('열쇠', `열쇠 분실로 재설정 · 잠긴 기록 ${n}건 삭제`);
  saveDB(); toast('열쇠를 지웠어요. 새로 정해주세요'); openPayKeySetup();
}

/* ---- 공지 · 읽음확인 ---------------------------------------------------
   서버가 없어 문자·카톡은 못 보낸다. 대신 필독 공지는 확인을 누를 때까지
   홈 맨 위에 붙어 있고, 관리자는 누가 안 읽었는지 이름으로 본다. */
function activeStaff(){ return DB.staff.filter(s=>s.active!==false); }
// 같은 이름이 둘이면 부서를 붙여야 누구인지 알아본다
function staffLabel(id){
  const s=staffById(id); if(!s) return '';
  return DB.staff.filter(x=>x.name===s.name).length>1
    ? `${s.name}(${s.dept||s.position||'부서 미지정'})` : s.name;
}
function noticeById(id){ return (DB.notices||[]).find(n=>n.id===id); }
function noticeRead(n, sid){ return !!(n.reads && n.reads[sid]); }
function noticeUnreadFor(sid){ return (DB.notices||[]).filter(n=>!noticeRead(n,sid)); }
function noticeMustUnread(sid){ return noticeUnreadFor(sid).filter(n=>n.must); }

function renderNoticeBanner(){
  const box=$('#homeNotice'); if(!box) return;
  const u=currentUser();
  const list=u? noticeMustUnread(u.id) : [];
  if(!list.length){ box.innerHTML=''; box.style.display='none'; return; }
  box.style.display='';
  box.innerHTML=list.map(n=>`<div class="card" style="background:var(--warn-soft);border:0;box-shadow:none;margin-bottom:8px;padding:13px 15px;cursor:pointer" onclick="openNoticeRead('${n.id}')">
    <div class="row" style="gap:9px;align-items:flex-start">
      <span style="font-size:20px;line-height:1.3">📌</span>
      <div class="grow" style="min-width:0">
        <div style="font-weight:900;color:var(--warn)">필독 · ${esc(n.title)}</div>
        <div class="tiny muted" style="margin-top:2px">${esc(n.byName||'')} · ${fmtDateFull((n.at||'').slice(0,10))} — 눌러서 확인해 주세요</div>
      </div></div></div>`).join('');
}
function openNoticeRead(id){
  const n=noticeById(id); if(!n) return;
  const u=currentUser();
  const already=u&&noticeRead(n,u.id);
  modal(`<h3>${n.must?'📌 필독 · ':'📢 '}${esc(n.title)}</h3>
    <div class="tiny muted" style="margin:-6px 2px 12px">${esc(n.byName||'')} · ${fmtDateFull((n.at||'').slice(0,10))}</div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:14px 15px;margin-bottom:14px;white-space:pre-wrap;line-height:1.7">${esc(n.body||'')}</div>
    ${already
      ? `<div class="tiny" style="text-align:center;color:var(--ok);font-weight:800;margin-bottom:10px">✓ ${fmtDateFull(String(n.reads[u.id]).slice(0,10))}에 확인하셨어요</div>
         <button class="btn soft block" onclick="closeModal()">닫기</button>`
      : `<button class="btn block" onclick="confirmNotice('${n.id}')">읽었습니다</button>`}`);
}
function confirmNotice(id){
  const n=noticeById(id), u=currentUser(); if(!n||!u) return;
  if(!n.reads) n.reads={};
  n.reads[u.id]=now();
  saveDB(); closeModal(); renderHome(); if(currentTab==='staff') renderStaff();
  toast('확인했어요');
}
function openNoticeForm(id){
  if(!isHR()){ toast('공지는 최고관리자와 인사담당자만 올릴 수 있어요'); return; }
  const n=id?noticeById(id):null;
  modal(`<h3>${n?'공지 수정':'📢 공지 올리기'}</h3>
    <label class="field"><span>제목 *</span><input id="ncTitle" value="${n?esc(n.title):''}" placeholder="예: 8월 대체공휴일 근무 안내"></label>
    <label class="field"><span>내용</span><textarea id="ncBody" rows="6" placeholder="직원들이 볼 내용을 적어주세요">${n?esc(n.body||''):''}</textarea></label>
    <label class="field" style="display:flex;align-items:center;gap:8px;margin:-2px 2px 12px">
      <input type="checkbox" id="ncMust" style="width:auto;margin:0" ${!n||n.must?'checked':''}>
      <span class="tiny" style="margin:0;font-weight:700">필독 — 확인을 누를 때까지 홈 맨 위에 붙어 있어요</span></label>
    <button class="btn block" onclick="saveNotice('${n?n.id:''}')">${n?'수정':'올리기'}</button>
    ${n?`<button class="btn soft block" style="margin-top:8px;color:var(--danger)" onclick="delNotice('${n.id}')">삭제</button>`:''}`);
}
function saveNotice(id){
  const title=($('#ncTitle').value||'').trim(); if(!title){ toast('제목을 적어주세요'); return; }
  const body=($('#ncBody').value||'').trim(), must=$('#ncMust').checked;
  const u=currentUser();
  if(id){ const n=noticeById(id); if(!n) return;
    Object.assign(n,{title,body,must});
  } else {
    if(!Array.isArray(DB.notices)) DB.notices=[];
    DB.notices.unshift({id:uid(), title, body, must, by:u?u.id:'', byName:u?u.name:'', at:now(), reads:{}});
  }
  saveDB(); closeModal(); renderStaff(); renderHome(); toast(id?'수정했어요':'공지를 올렸어요');
}
function delNotice(id){
  if(!isHR()) return;
  if(!confirm('이 공지를 지울까요? 확인 기록도 함께 지워집니다.')) return;
  DB.notices=(DB.notices||[]).filter(n=>n.id!==id);
  saveDB(); closeModal(); renderStaff(); renderHome(); toast('지웠어요');
}
function openNoticeReaders(id){
  const n=noticeById(id); if(!n) return;
  const all=activeStaff();
  const read=all.filter(s=>noticeRead(n,s.id)), miss=all.filter(s=>!noticeRead(n,s.id));
  modal(`<h3>👀 ${esc(n.title)}</h3>
    <div class="tiny muted" style="margin:-6px 2px 12px"><b>${read.length}/${all.length}명</b> 확인했어요</div>
    ${miss.length?`<div class="card" style="box-shadow:none;background:var(--warn-soft);border:0;padding:12px 14px;margin-bottom:10px">
      <div class="tiny" style="font-weight:900;color:var(--warn);margin-bottom:6px">아직 안 읽은 사람 ${miss.length}명</div>
      ${miss.map(s=>`<div class="tiny" style="padding:2px 0">${esc(s.name)} · ${esc(s.dept||'부서 미지정')}</div>`).join('')}
    </div>`:`<div class="card" style="box-shadow:none;background:var(--ok-soft);border:0;padding:12px 14px;margin-bottom:10px">
      <div class="tiny" style="font-weight:900;color:var(--ok)">모두 확인했어요</div></div>`}
    ${read.length?`<div class="card" style="box-shadow:none;background:var(--bg);padding:12px 14px">
      <div class="tiny muted" style="font-weight:800;margin-bottom:6px">확인함</div>
      ${read.map(s=>`<div class="spread" style="padding:2px 0"><span class="tiny">${esc(s.name)}</span>
        <span class="tiny muted">${fmtDateFull(String(n.reads[s.id]).slice(0,10))} ${fmtTime(n.reads[s.id])}</span></div>`).join('')}
    </div>`:''}`, ()=>openNoticeRead(id));
}
function hrNoticeView(){
  const all=activeStaff().length;
  const list=(DB.notices||[]);
  return `<div class="spread" style="margin:0 2px 12px">
      <div class="tiny muted">확인을 누른 사람만 셉니다. 필독은 확인 전까지 홈 맨 위에 붙어 있어요.</div>
      <button class="btn sm" onclick="openNoticeForm()">＋ 공지</button>
    </div>
    ${list.length? list.map(n=>{
      const cnt=activeStaff().filter(s=>noticeRead(n,s.id)).length;

/* ---- 근로계약서 --------------------------------------------------------
   근로기준법 §17 은 임금(구성항목·계산방법·지급방법)·소정근로시간·주휴일·
   연차를 적은 서면을 근로자에게 '교부'하라고 한다. 작성만 하고 안 건네도
   위반이라 §114 로 500만원 이하 벌금이다. 그래서 앱은 두 가지를 남긴다 —
   본문(잠금)과 '직원이 언제 확인했는지'(평문).
   임금이 들어가므로 본문은 급여 열쇠로 잠근다. */
const CONTRACT_FIELDS=[
  ['startDate','계약 시작일','date'], ['endDate','계약 종료일 (기간제만)','date'],
  ['workPlace','근무 장소','text'], ['job','맡은 일','text'],
  ['payKind','임금 형태','sel:월급|시급|일급|연봉'], ['payAmount','기본급 (원)','num'],
  ['payParts','그 밖의 임금 구성항목','text'], ['payCalc','계산 방법','text'],
  ['payDay','임금 지급일','text'], ['payMethod','지급 방법','sel:계좌이체|현금'],
  ['workHours','소정근로시간','text'], ['workDays','근무일','text'],
  ['restDay','주휴일 (주에 하루 유급으로 쉬는 날)','text'], ['annual','휴가','text'],

function contractOf(sid){ return (DB.contracts||[]).filter(c=>c.staffId===sid).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]; }
function openContract(sid){

    if(c && !Object.keys(d).length){ toast('예전 계약서를 열지 못했어요 — 열쇠를 확인해 주세요'); return; }
    const f=(k,label,type)=>{
      const v=d[k]==null?'':d[k];

      if(type==='num')  return `<label class="field"><span>${label}</span><input id="ct_${k}" type="number" inputmode="numeric" value="${esc(v)}"></label>`;
      if(type.startsWith('sel:')) return `<label class="field"><span>${label}</span><select id="ct_${k}">${type.slice(4).split('|').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></label>`;

    modal(`<h3>📝 근로계약서 · ${esc(s.name)}</h3>

        <span class="lawcite">근거 · 근로기준법 제17조 (근로조건의 명시)</span></div>
      <div class="tiny muted" style="margin:8px 2px 12px">${isSmallBiz()
        ? '직원이 <b>'+staffCount()+'명</b>이라 연차는 법으로 정해진 게 아니에요. <b>휴가</b> 칸에는 병원이 주기로 한 내용을 그대로 적으시면 됩니다 — 적어서 드린 건 지켜야 합니다.'
        : '직원이 <b>'+staffCount()+'명</b>이라 연차가 법으로 정해져 있어요. <b>휴가</b> 칸에 "근로기준법 제60조에 따름"이라고 적으셔도 됩니다.'}</div>

function saveContract(sid){
  withPayKey(async key=>{
    const d={}; CONTRACT_FIELDS.forEach(x=>{ const el=$('#ct_'+x[0]); if(el) d[x[0]]=el.value; });
    const nt=$('#ct_note'); d.note=nt?nt.value:'';
    if(!d.payAmount){ toast('기본급을 적어주세요'); return; }
    // 꼭 적어야 하는 칸이 비면 알려준다. 막지는 않는다 — 나중에 채울 수도 있다.
    const miss=CONTRACT_MUST.filter(f=>!String(d[f[0]]||'').trim()).map(f=>f[1]);
    if(miss.length && !confirm(`아직 안 적은 칸이 있어요\n\n${miss.join(' · ')}\n\n이 칸들은 근로계약서에 꼭 들어가야 합니다(근로기준법 제17조).\n그래도 지금 저장할까요?`)) return;
    if(!Array.isArray(DB.contracts)) DB.contracts=[];
    const enc=await payEnc(key,d), u=currentUser();
    const old=contractOf(sid);
    if(old){ old.enc=enc; old.at=now(); old.by=u?u.id:''; old.agreedAt=null; old.agreedBy=null; }
    else DB.contracts.push({id:uid(), staffId:sid, at:now(), by:u?u.id:'', byName:u?u.name:'', enc, agreedAt:null});
    hrLog('계약서', `${(staffById(sid)||{}).name||''} 근로계약서 저장`);
    saveDB(); closeModal(); renderStaff(); toast(old?'고쳤어요 · 직원 확인을 다시 받아주세요':'저장했어요 · 직원 확인을 받아주세요');
  });
}

/* ---- 급여명세서 --------------------------------------------------------
   세무사·급여프로그램이 뽑은 엑셀 한 장을 올리면 직원별로 쪼갠다.
   §48② 는 임금 총액·구성항목별 금액·계산방법·공제내역을 적어 교부하라고
   한다(500만원 이하 과태료). 그래서 열을 그대로 다 보관하고, 빠진 게
   있으면 경고한다.
   금액은 화면에 '한 번에 한 사람'만 뜬다. 짝짓기 화면에는 금액이 없다. */
const PAYCOL={
  name:['성명','이름','근로자명','직원명','사원명','name'],
  phone:['전화','전화번호','휴대폰','핸드폰','연락처','휴대전화','phone','hp'],
  empno:['사번','사원번호','직원번호','사원코드','empno','사원no'],
};
const DEDUCT_RE=/공제|국민연금|건강보험|장기요양|고용보험|소득세|지방소득세|가불|상조/;
const TOTAL_RE=/총액|합계|지급계|공제계|실지급|차인지급|실수령/;
const CALC_RE=/연장|야간|휴일|초과|가산/;
function digitsOnly(v){ return String(v==null?'':v).replace(/\D/g,''); }

let payPending=null;     // {ym, cols, rows:[{cells,matchId,why}]}
function openPayUpload(){
  withPayKey(()=>{
    const noXlsx = window.__noXLSX || typeof XLSX==='undefined';
    modal(`<h3>💰 급여명세서 올리기</h3>
      <div class="hint">세무사·급여프로그램이 준 <b>엑셀·CSV 한 장</b>을 그대로 올리면 직원별로 쪼개 드려요. 열 이름은 그대로 씁니다.</div>
      <div class="tiny muted" style="margin:8px 2px 14px">직원을 붙일 때 <b>전화번호·사번</b>을 먼저 봅니다. 없으면 이름으로 붙이고, 같은 이름이 둘이면 그때만 물어봐요 — <b>금액은 보여주지 않습니다.</b></div>
      <label class="field"><span>몇 월분인가요</span><input id="pyYm" type="month" value="${monthKey()}"></label>
      <label class="btn block" style="cursor:pointer">📂 급여 파일 고르기
        <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handlePayFile(event)"></label>
      ${noXlsx?`<div class="tiny" style="color:var(--warn);margin-top:10px">⚠️ 지금은 CSV만 읽을 수 있어요(엑셀 라이브러리 미로딩).</div>`:''}`);
  });
}
function handlePayFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  payPicks=[];
  const ym=($('#pyYm')&&$('#pyYm').value)||monthKey();
  const isCsv=/\.csv$/i.test(f.name), r=new FileReader();
  r.onload=()=>{
    try{
      let rows;
      if(!isCsv && typeof XLSX!=='undefined'){
        const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      } else rows=parseCSV(typeof r.result==='string'?r.result:new TextDecoder('utf-8').decode(r.result));
      const parsed=payParse(rows, ym);
      if(!parsed){ toast('직원 이름 열을 찾지 못했어요'); return; }
      if(!parsed.rows.length){ toast('읽을 수 있는 줄이 없어요'); return; }
      payPending=parsed; payMatchStep();
    }catch(e){ toast('파일을 읽지 못했어요. 양식을 확인해 주세요'); }
  };
  if(!isCsv && typeof XLSX!=='undefined') r.readAsArrayBuffer(f); else r.readAsText(f,'utf-8');
}
function payParse(rows, ym){
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(!rows.length) return null;
  const norm=s=>String(s||'').replace(/\s|\(.*?\)/g,'').toLowerCase();
  const header=rows[0].map(x=>String(x||'').trim());
  const h=header.map(norm), idx={};
  for(const k in PAYCOL) idx[k]=h.findIndex(x=>PAYCOL[k].some(y=>norm(y)===x||(x&&x.includes(norm(y)))));
  if(idx.name<0) return null;
  const out={ym, cols:header, nameCol:idx.name, phoneCol:idx.phone, empCol:idx.empno, rows:[]};
  rows.slice(1).forEach((r,i)=>{
    const nm=String(r[idx.name]||'').trim();
    if(!nm || /합\s*계|소\s*계|총\s*계/.test(nm)) return;
    const cells={}; header.forEach((c,j)=>{ if(c) cells[c]=r[j]==null?'':r[j]; });
    out.rows.push({no:i+2, name:nm, cells,
      phone: idx.phone>=0? digitsOnly(r[idx.phone]) : '',
      empno: idx.empno>=0? String(r[idx.empno]||'').trim() : '',
      staffId:null});
  });
  return out;
}
// 기억해 둔 짝 → 전화 → 사번 → 이름(하나뿐일 때). 나머지는 사람이 고른다.
// 손으로 고른 줄은 건드리지 않는다. 한 사람이 두 줄을 가져가지도 않는다.
function payAutoMatch(p){
  // 퇴사자도 넣고 본다. 퇴직 정산 명세서는 퇴사자 것이 맞고, 무엇보다
  // 퇴사자와 같은 이름의 신입에게 조용히 붙는 걸 막아야 한다.
  const staff=DB.staff;
  const taken=new Set(p.rows.map(r=>r.staffId).filter(Boolean));
  p.rows.forEach(r=>{
    if(r.staffId) return;                        // 이미 정해진 줄은 그대로 둔다
    const free=x=>x && !taken.has(x.id);
    // 같은 값을 가진 사람이 둘이면 자동으로 붙이지 않는다 — 누구인지 못 가린다
    const only=(f)=>{ const hit=staff.filter(f); return hit.length===1 && free(hit[0])? hit[0] : null; };
    let s=null, why='';
    if(r.empno && (s=only(x=>String(x.empno||'')===r.empno))) why='사번';
    if(!s && r.phone && (s=only(x=>normPhone(x.phone)===r.phone))) why='전화';
    if(!s && r.phone && (s=only(x=>x.payKey===r.phone))) why='기억';
    if(!s && r.empno && (s=only(x=>x.payKey===r.empno))) why='기억';
    if(!s && (s=only(x=>x.name===r.name))) why='이름';
    r.staffId = s? s.id : null; r.why = s? why : '';
    if(s) taken.add(s.id);
  });
}
// 전화 뒷자리는 앱에서 유일하다(로그인 ID). 겹치면 자리수를 늘려 보여준다.
function phoneTail(sid, cands){
  const s=staffById(sid); if(!s) return '';
  const ph=normPhone(s.phone);
  for(const n of [4,6,8,11]){
    const t=ph.slice(-n);
    if(cands.filter(c=>normPhone((staffById(c)||{}).phone||'').slice(-n)===t).length===1)
      return '⋯'+t;
  }
  return ph? '⋯'+ph.slice(-4) : '(번호 없음)';
}
let payPicks=[];                     // 손으로 고른 순서 — ‹ 이전 으로 하나씩 되돌린다
function payUndo(){
  const p=payPending; if(!p) return;
  const last=payPicks.pop();
  if(!last){ openPayUpload(); return; }
  const r=p.rows.find(x=>x.no===last.no); if(r) r.staffId=null;
  const s=staffById(last.staffId); if(s && last.hadKey===undefined) delete s.payKey; else if(s) s.payKey=last.hadKey;
  saveDB(); payMatchStep();
}
function payMatchStep(){
  const p=payPending; if(!p) return;
  payAutoMatch(p);
  const un=p.rows.filter(r=>!r.staffId);
  if(!un.length){ payPreview(); return; }
  const r=un[0];
  const cands=activeStaff().filter(s=>s.name===r.name).map(s=>s.id);
  const pool=cands.length? cands : activeStaff().map(s=>s.id);
  modal(`<h3>⚠️ 어느 분인가요</h3>
    <div class="tiny muted" style="margin:-6px 2px 12px">엑셀 <b>${r.no}번째 줄</b> · "${esc(r.name)}"${cands.length>1?` — 같은 이름이 ${cands.length}명이에요`:' — 직원을 못 찾았어요'}</div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:6px 12px;margin-bottom:12px;max-height:38vh;overflow:auto">
      ${pool.map(id=>{ const s=staffById(id);
        return `<label class="trow" style="cursor:pointer;gap:9px">
          <input type="radio" name="pyPick" value="${id}" style="width:auto;margin:0;flex:none">
          <div class="grow" style="min-width:0"><div style="font-weight:800;font-size:14px">${esc(s.name)}</div>
            <div class="tiny muted">${esc(s.dept||'부서 미지정')} · ${phoneTail(id,pool)} · ${s.joinDate||'입사일 없음'}</div></div>
        </label>`; }).join('')}
    </div>
    <div class="tiny muted" style="margin:0 2px 10px">전화번호는 로그인 ID라 <b>겹칠 수 없어요.</b> 뒷자리·부서·입사일로 가려주세요.</div>
    ${(r.phone||r.empno)?'':`<div class="tiny muted" style="margin:-4px 2px 10px">급여 엑셀에 <b>전화번호나 사번 열</b>을 넣으면 다음 달부터 안 물어봐요.</div>`}
    <button class="btn block" onclick="payPickStaff()">이 사람이에요</button>
    <div class="divider"></div>
    <button class="btn soft block" style="color:var(--warn)" onclick="payRevealRow()">🔓 금액 보고 가르기</button>
    <div class="tiny muted" style="margin-top:7px">엑셀에 이름 말고 아무 정보가 없을 때만 쓰세요. <b>누가 언제 눌렀는지 기록에 남습니다.</b></div>
    <button class="btn soft block" style="margin-top:10px" onclick="paySkipRow()">이 줄은 건너뛰기</button>`,
    payPicks.length? payUndo : openPayUpload);
}
function payPickStaff(){
  const sel=document.querySelector('input[name=pyPick]:checked');
  if(!sel){ toast('한 명을 골라주세요'); return; }
  const p=payPending, r=p.rows.find(x=>!x.staffId); if(!r) return;
  const s=staffById(sel.value);
  payPicks.push({no:r.no, staffId:sel.value, hadKey:s?s.payKey:undefined});
  r.staffId=sel.value; r.why='직접';
  // 전화·사번처럼 그 사람만의 값일 때만 기억한다.
  // 이름으로 기억하면 동명이인 두 줄이 다음 달에 같은 사람으로 붙는다.
  if(s && (r.phone||r.empno)) s.payKey = r.phone || r.empno;
  saveDB(); payMatchStep();
}
function paySkipRow(){
  const p=payPending; const i=p.rows.findIndex(x=>!x.staffId);
  if(i>=0){ p.skipped=(p.skipped||[]).concat([p.rows[i].name+' ('+p.rows[i].no+'번째 줄)']); p.rows.splice(i,1); }
  p.rows.length? payMatchStep() : (toast('넣을 줄이 없어요'), closeModal());
}
function payRevealRow(){
  const p=payPending, r=p.rows.find(x=>!x.staffId); if(!r) return;
  hrLog('금액열람', `급여 짝짓기에서 ${p.ym} ${r.no}번째 줄 금액 확인`);
  saveDB();
  const money=Object.keys(r.cells).filter(c=>c!==p.cols[p.nameCol] && String(r.cells[c]).replace(/[^\d]/g,''));
  modal(`<h3>🔓 엑셀 ${r.no}번째 줄</h3>
    <div class="tiny muted" style="margin:-6px 2px 12px">"${esc(r.name)}" 줄의 금액이에요. <b>확인한 기록이 남았습니다.</b></div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:12px 14px;margin-bottom:14px;max-height:44vh;overflow:auto">
      ${money.map(c=>`<div class="spread" style="padding:3px 0"><span class="tiny muted">${esc(c)}</span><b class="tiny">${esc(String(r.cells[c]))}</b></div>`).join('')}
    </div>
    <button class="btn block" onclick="payMatchStep()">알겠어요 — 사람 고르러 가기</button>`, payMatchStep);
}
// §48② 가 요구하는 것이 빠졌는지 본다 — 빠뜨리고 교부해도 과태료 대상이다
function payAudit(cols){
  const w=[];
  const money=cols.filter(c=>c && !PAYCOL.name.some(x=>c.replace(/\s/g,'')===x));
  if(!money.some(c=>DEDUCT_RE.test(c))) w.push('공제 내역 열이 없어요 (4대보험·소득세 등)');
  const pay=money.filter(c=>!DEDUCT_RE.test(c) && !TOTAL_RE.test(c));
  if(pay.length<2) w.push('임금을 구성항목별로 나눈 열이 없어요 (기본급·수당 등)');
  if(!money.some(c=>TOTAL_RE.test(c))) w.push('임금 총액 열이 없어요');
  if(money.some(c=>CALC_RE.test(c)) && !money.some(c=>/시간|시급|단가|일수/.test(c)))
    w.push('연장·야간·휴일 수당이 있는데 계산 근거(시간·단가) 열이 없어요');
  return w;
}
// 실지급액으로 보이는 열 — 지난달과 견줘 잘못 붙은 줄을 잡는 데 쓴다
function payNetCol(cols){
  return (cols||[]).find(c=>/실지급|차인지급|실수령/.test(c))
      || (cols||[]).find(c=>TOTAL_RE.test(c)) || null;
}
function payNum(v){ const n=parseInt(String(v==null?'':v).replace(/[^\d-]/g,''),10); return isNaN(n)?0:n; }
// 엑셀에서 기본급으로 보이는 열
function payBaseCol(cols){ return (cols||[]).find(c=>/기본급|기본임금|본봉/.test(c)) || null; }
// 이 사람의 바로 전 달 명세서
function payPrevSlip(sid, ym){
  return (DB.payslips||[]).filter(x=>x.staffId===sid && x.ym<ym).sort((a,b)=>b.ym.localeCompare(a.ym))[0];
}

/* 교부 전 관문 — 조용히 잘못 붙는 걸 여기서 잡는다.
   막는 것: 한 사람에게 두 줄. 나머지는 보여주고 사람이 판단한다. */
function payPreview(){
  const p=payPending; if(!p) return;
  withPayKey(async key=>{
    const warn=payAudit(p.cols);
    const named=p.rows.filter(r=>r.staffId);
    const ids=named.map(r=>r.staffId);
    const twice=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))].map(id=>(staffById(id)||{}).name||'');
    const missing=activeStaff().filter(s=>!ids.includes(s.id));
    const retired=named.filter(r=>(staffById(r.staffId)||{}).active===false);
    const weak=named.filter(r=>r.why==='이름');
    const dup=(DB.payslips||[]).filter(x=>x.ym===p.ym).length;

    // 지난달 금액을 미리 풀어둔다 — 잘못 붙은 줄을 잡는 재료
    const net=payNetCol(p.cols), prevNet=new Map();
    if(net) for(const st of DB.staff){
      const prev=payPrevSlip(st.id, p.ym); if(!prev) continue;
      const d=await payDec(key, prev.enc); if(!d) continue;
      const v=payNum(d.cells[payNetCol(d.cols)]);
      if(v) prevNet.set(st.id, {ym:prev.ym, net:v});
    }
    // 근로계약서에 적힌 기본급과 견준다 — 지난달 기록이 없는 첫 달에도 걸린다
    const baseCol=payBaseCol(p.cols), offBase=[];
    if(baseCol) for(const r of named){
      const c=contractOf(r.staffId); if(!c) continue;
      const cd=await payDec(key, c.enc); if(!cd) continue;
      const want=payNum(cd.payAmount), got=payNum(r.cells[baseCol]);
      if(!want || !got) continue;
      const pct=Math.round((got-want)/want*100);
      if(Math.abs(pct)>=5) offBase.push({name:staffLabel(r.staffId), pct});
    }

    // ① 뒤바뀜 — 이 사람 금액이 '다른 사람'의 지난달 금액과 딱 맞으면 거의 확실하다
    // ② 급변 — 지난달 대비 15% 넘게 움직인 사람. 수당이 많은 달일 수도 있어 보여만 준다
    const jumps=[], swaps=[];
    if(net) for(const r of named){
      const after=payNum(r.cells[net]); if(!after) continue;
      const me=staffLabel(r.staffId);
      for(const [sid,v] of prevNet){
        if(sid!==r.staffId && v.net===after){ swaps.push({me, other:staffLabel(sid), ym:v.ym}); break; }
      }
      const pv=prevNet.get(r.staffId);
      if(pv){ const pct=Math.round((after-pv.net)/pv.net*100);
        if(Math.abs(pct)>=15) jumps.push({name:me, prev:pv.ym, pct}); }
    }

    const box=(color,title,body)=>`<div class="card" style="box-shadow:none;background:var(--${color}-soft);border:0;padding:12px 14px;margin-bottom:10px">
      <div class="tiny" style="font-weight:900;color:var(--${color});margin-bottom:6px">${title}</div>${body}</div>`;
    const chip={사번:'ok', 전화:'ok', 기억:'ok', 이름:'warn', 직접:'info'};
    const whyKo={사번:'사번으로 붙음', 전화:'전화로 붙음', 기억:'기억해 둔 짝', 이름:'이름으로 붙음', 직접:'직접 고름'};

    modal(`<h3>💰 ${p.ym} 이대로 교부할까요?</h3>
      <div class="summary3" style="margin-bottom:12px">
        <div class="stat"><div class="n">${named.length}</div><div class="l">직원</div></div>
        <div class="stat"><div class="n" style="color:${missing.length?'var(--danger)':'var(--ok)'}">${missing.length}</div><div class="l">빠진 사람</div></div>
        <div class="stat"><div class="n" style="color:${(warn.length+jumps.length+swaps.length+offBase.length)?'var(--warn)':'var(--ok)'}">${warn.length+jumps.length+swaps.length+offBase.length}</div><div class="l">확인할 것</div></div>
      </div>

      ${twice.length? box('danger','⛔ 한 사람에게 두 줄이 붙었어요',
        `<div class="tiny">${esc(twice.join(', '))} 님<br>‹ 이전 으로 돌아가 다시 가려주세요. 이대로는 넣을 수 없어요.</div>`):''}

      ${missing.length? box('danger','재직 중인데 이 파일에 없는 사람',
        `<div class="tiny">${missing.map(x=>esc(staffLabel(x.id))).join(', ')} — <b>${missing.length}명</b><br>
         급여를 줄 때마다 명세서를 한 장씩 드려야 합니다. 빠진 게 맞는지 확인하세요.<br>
         <span class="lawcite">근거 · 근로기준법 제48조제2항</span></div>`):''}

      ${swaps.length? box('danger','⚠️ 두 사람이 뒤바뀐 것 같아요',
        swaps.map(w=>`<div class="tiny" style="padding:2px 0"><b>${esc(w.me)}</b> 님 금액이 <b>${esc(w.other)}</b> 님의 ${esc(w.ym)} 금액과 똑같아요</div>`).join('')
        +`<div class="tiny muted" style="margin-top:6px">엑셀 줄이 서로 바뀌었을 때 나오는 신호예요. ‹ 이전 으로 돌아가 확인하세요. 급여를 올려준 게 맞다면 그대로 진행하셔도 됩니다.</div>`):''}

      ${offBase.length? box('warn','근로계약서의 기본급과 다른 사람',
        offBase.map(o=>`<div class="tiny" style="padding:2px 0">${esc(o.name)} · 계약서 대비 <b>${o.pct>0?'+':''}${o.pct}%</b></div>`).join('')
        +`<div class="tiny muted" style="margin-top:6px">줄이 잘못 붙었거나, 급여를 올려주고 <b>계약서를 안 고쳤을 때</b> 나옵니다. 임금이 바뀌면 계약서를 다시 써서 한 장 드려야 해요.<br><span class="lawcite">근거 · 근로기준법 제17조</span></div>`):''}

      ${jumps.length? box('warn','지난달과 많이 달라진 사람',
        jumps.map(j=>`<div class="tiny" style="padding:2px 0">${esc(j.name)} · ${esc(j.prev)} 대비 <b>${j.pct>0?'+':''}${j.pct}%</b></div>`).join('')
        +`<div class="tiny muted" style="margin-top:6px">수당이 많은 달이면 자연스러운 변화예요. 금액은 안 보여드리니 비율만 보고 판단하세요.</div>`):''}

      ${retired.length? box('warn','퇴사한 분에게 붙은 줄',
        `<div class="tiny">${retired.map(r=>esc(staffLabel(r.staffId))).join(', ')}<br>퇴직 정산이면 그대로 진행하세요.</div>`):''}

      ${weak.length? box('warn','이름만 보고 붙인 줄 — 하나씩 확인해 주세요',
        weak.map(r=>`<label class="trow" style="cursor:pointer;gap:8px;padding:6px 0">
            <input type="checkbox" class="payweak" style="width:auto;margin:0;flex:none" onchange="payWeakTick()">
            <span class="tiny grow" style="min-width:0"><b>${esc(r.name)}</b> · 엑셀 ${r.no}번째 줄
              <span class="muted"> → ${esc(staffLabel(r.staffId))}</span></span></label>`).join('')
        +`<div class="tiny muted" style="margin-top:6px">이름은 가장 약한 근거예요. 다 확인해야 교부 버튼이 열립니다.
          매달 이걸 안 하시려면 <b>사번</b>을 쓰세요 — 아래 버튼으로 앱이 만들어 드립니다.</div>
          <button class="btn soft sm block" style="margin-top:8px" onclick="openEmpNoHelp()">🔢 사번 만들고 세무사에게 줄 명단 뽑기</button>`):''}

      ${(p.skipped||[]).length? box('warn','건너뛴 줄',
        `<div class="tiny">${(p.skipped||[]).map(esc).join(', ')}</div>`):''}

      ${warn.length? box('warn','명세서에 꼭 들어가야 하는데 빠진 것',
        warn.map(x=>`<div class="tiny" style="padding:2px 0">· ${esc(x)}</div>`).join('')
        +`<div class="tiny muted" style="margin-top:6px">빠뜨린 채로 드려도 과태료 대상이에요. <span class="lawcite">근거 · 근로기준법 제48조제2항</span></div>`):''}

      ${dup?`<div class="tiny" style="color:var(--warn);margin:0 2px 10px">이미 ${p.ym} 명세서가 ${dup}건 있어요. 넣으면 <b>덮어씁니다.</b></div>`:''}

      <div class="card" style="box-shadow:none;background:var(--bg);padding:6px 12px;margin-bottom:12px;max-height:26vh;overflow:auto">
        ${named.map(r=>{
          return `<div class="spread" style="padding:4px 0">
            <span class="tiny" style="font-weight:700">${esc(staffLabel(r.staffId))}</span>
            <span class="pill ${chip[r.why]||'grey'}">${esc(whyKo[r.why]||'근거 없음')}</span></div>`;}).join('')}
      </div>
      <div class="tiny muted" style="margin:-6px 2px 10px">금액은 여기 안 보여요. 넣은 뒤 <b>한 사람씩</b> 열어 인쇄하시면 됩니다.</div>
      ${twice.length
        ? `<button class="btn block" disabled style="opacity:.5">두 줄이 겹쳐 넣을 수 없어요</button>`
        : `<button class="btn block" id="payGo" data-go="${named.length}명에게 교부 처리" onclick="payCommit()"
             ${weak.length?'disabled style="opacity:.5"':''}>${weak.length?'이름만 보고 붙인 줄을 확인해 주세요':`${named.length}명에게 교부 처리`}</button>`}`,
      ()=>{ payPicks.length? payUndo() : openPayUpload(); });
  });
}
function payWeakTick(){
  const boxes=[...document.querySelectorAll('.payweak')], btn=$('#payGo');
  if(!btn) return;
  const all=boxes.every(b=>b.checked);
  btn.disabled=!all; btn.style.opacity=all?'':'.5';
  btn.textContent = all? btn.dataset.go : '이름만 보고 붙인 줄을 확인해 주세요';
}

/* 사번이 없는 병원을 위해 — 앱이 만들어 주고, 세무사에게 줄 명단을 뽑는다.
   사번이 한 번 자리잡으면 이름 대조를 영영 안 해도 된다. */
function openEmpNoHelp(){
  const none=DB.staff.filter(s=>s.active!==false && !String(s.empno||'').trim());
  modal(`<h3>🔢 사번 만들기</h3>
    <div class="hint">사번은 병원이 정하는 <b>그 사람만의 번호</b>예요. 급여 엑셀에 사번 열 하나만 있으면 동명이인이든 번호를 같이 쓰든 정확히 붙습니다 — 매달 이름 확인을 안 해도 돼요.</div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:12px 14px;margin:12px 0">
      <div class="tiny muted" style="font-weight:800;margin-bottom:6px">이렇게 하시면 됩니다</div>

function assignEmpNos(){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const used=new Set(DB.staff.map(s=>String(s.empno||'').trim()).filter(Boolean));
  let n=0;
  DB.staff.filter(s=>s.active!==false && !String(s.empno||'').trim())
    .sort((a,b)=>String(a.joinDate||'9999').localeCompare(String(b.joinDate||'9999')))
    .forEach(s=>{
      const y=(s.joinDate||todayKey()).slice(0,4);
      let i=1, id;
      do{ id=`${y}-${String(i).padStart(3,'0')}`; i++; }while(used.has(id));
      used.add(id); s.empno=id; n++;
    });
  hrLog('사번', `사번 ${n}명 자동 부여`);
  saveDB(); openEmpNoHelp(); toast(`${n}명에게 사번을 만들었어요`);
}
function exportRoster(){
  const rows=DB.staff.filter(s=>s.active!==false);

  const NL=String.fromCharCode(10);
  const csv='﻿'+['사번','성명','부서','직급','입사일'].join(',')+NL
    +rows.map(s=>[s.empno,s.name,s.dept,s.position,s.joinDate].map(cell).join(',')).join(NL)+NL;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));

function payCommit(){
  withPayKey(async key=>{
    const p=payPending; if(!p) return;
    if(!Array.isArray(DB.payslips)) DB.payslips=[];
    const u=currentUser();
    DB.payslips=DB.payslips.filter(x=>x.ym!==p.ym || !p.rows.some(r=>r.staffId===x.staffId));
    for(const r of p.rows){
      if(!r.staffId) continue;
      DB.payslips.unshift({id:uid(), staffId:r.staffId, ym:p.ym, issuedAt:now(),
        issuedBy:u?u.id:'', issuedByName:u?u.name:'', enc: await payEnc(key,{cols:p.cols, cells:r.cells})});
    }
    if(DB.payslips.length>800) DB.payslips=DB.payslips.slice(0,800);
    const n=p.rows.filter(r=>r.staffId).length;
    hrLog('급여', `${p.ym} 급여명세서 ${n}명 교부`);
    payPending=null; saveDB(); closeModal(); renderStaff();
    toast(`${n}명 교부 처리했어요 · 한 사람씩 열어 인쇄하세요`);
  });
}

function payExportCsv(ym){
  withPayKey(async key=>{
    if(!confirm('내려받은 파일은 앱 밖으로 나갑니다.\n다운로드 폴더에 금액이 그대로 남고 앱이 더는 지키지 못해요.\n\n그래도 내려받을까요?')) return;
    const list=(DB.payslips||[]).filter(x=>x.ym===ym);
    if(!list.length){ toast('그 달 명세서가 없어요'); return; }
    const rows=[]; let cols=[];
    for(const ps of list){
      const d=await payDec(key, ps.enc); if(!d) continue;
      if(!cols.length) cols=d.cols;
      rows.push({name:(staffById(ps.staffId)||{}).name||'', cells:d.cells});
    }
    const cell=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
    const csv='﻿'+['직원'].concat(cols).join(',')+'\n'
      +rows.map(r=>[cell(r.name)].concat(cols.map(c=>cell(r.cells[c]))).join(',')).join('\n')+'\n';
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download=`급여명세서_${ym}_${todayKey()}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    hrLog('내려받기', `${ym} 급여명세서 ${rows.length}명분 CSV 내려받음`);
    saveDB(); toast('내려받았어요 · 파일 관리에 주의하세요');
  });
}

/* ---- 사직서 -----------------------------------------------------------
   민법 §660②③ — 사용자가 수리하지 않아도 통고가 도달한 뒤 일정 기간이
   지나면 효력이 생긴다. 그래서 중요한 건 '제출한 시각'이다.
   월급제는 제출한 달(당기) 다음 1기가 지난 날 — 즉 다다음 달 1일이 된다. */
function resignEffect(dateKey){
  if(!dateKey) return '';
  const [y,m]=dateKey.split('-').map(Number);
  const d=new Date(y, m+1, 1);                 // 당기(그 달) 후 1기(다음 달)가 지난 날
  return todayKey(d);
}
function resignOf(sid){ return (DB.resignations||[]).filter(r=>r.staffId===sid).sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)))[0]; }
function openResignForm(){
  const u=currentUser(); if(!u) return;
  const prev=resignOf(u.id);
  if(prev && prev.status==='제출'){ openResignView(prev.id); return; }
  modal(`<h3>📄 사직서 쓰기</h3>
    <div class="hint">여기서 제출하면 <b>정식으로 사직서를 낸 것</b>이 됩니다. 제출한 시각이 그대로 기록돼요.</div>
    <label class="field"><span>마지막으로 일하고 싶은 날</span><input id="rgLast" type="date" value="${todayKey()}"></label>
    <label class="field"><span>사직 사유 (안 적어도 돼요)</span><textarea id="rgWhy" rows="4" placeholder="개인 사정"></textarea></label>
    <div class="tiny muted" style="margin:-4px 2px 12px">⚠️ 적은 내용은 <b>최고관리자와 인사담당자에게 보입니다.</b> 앱 구조상 완전히 가려지지는 않으니 꼭 필요한 말만 적어주세요.</div>
    <div id="rgEffect" class="tiny muted" style="margin:0 2px 12px"></div>
    <button class="btn block" onclick="submitResign()">사직서 제출</button>`);
  const upd=()=>{ const e=$('#rgEffect'); if(e) e.innerHTML=`병원이 사직서를 안 받아줘도 <b>${fmtDateFull(resignEffect(todayKey()))}</b>이 되면 퇴직 효력이 생깁니다(월급으로 받는 경우).<br><span class="lawcite">근거 · 민법 제660조제3항</span>`; };

function handleResign(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const r=(DB.resignations||[]).find(x=>x.id===id); if(!r) return;
  const s=staffById(r.staffId);
  if(s && s.role===ROLE_OWNER){
    const others=DB.staff.filter(x=>x.id!==s.id && x.role===ROLE_OWNER && x.active!==false);
    if(!others.length){ toast('마지막 최고관리자는 퇴사 처리할 수 없어요'); return; }
  }
  if(!confirm('수리하고 퇴사 처리할까요?\n로그인이 막히고 명단에서 퇴사로 표시됩니다.')) return;
  const u=currentUser();
  r.status='수리'; r.handledAt=now(); r.handledBy=u?u.id:'';
  if(s) s.active=false;
  hrLog('사직', `${s?s.name:''} 사직서 수리 · 퇴사 처리`);
  saveDB(); closeModal(); renderStaff(); renderHome(); applyRole(); toast('수리했어요');
}

/* ---- 담당 분야 --------------------------------------------------------
   권한(볼 수 있는 범위)은 세 단계로 두고, '누가 무엇을 맡는지'는 병원이
   직접 만든다. 임플란트 담당·물품 약품 담당·수술방 담당처럼 병원마다
   부르는 이름이 달라서 미리 정해둘 수가 없다. */
const DUTY_SEED=['임플란트 담당','물품·약품 담당','수술방 담당','보험청구 담당'];
function dutyById(id){ return (DB.duties||[]).find(d=>d.id===id); }
function dutyName(id){ const d=dutyById(id); return d? d.name : ''; }
function dutiesOf(s){ return (s.duties||[]).map(dutyName).filter(Boolean); }
function staffByDuty(id){ return activeStaff().filter(s=>(s.duties||[]).includes(id)); }
function openDuties(back){
  const list=(DB.duties||[]);
  modal(`<h3>🧰 담당 분야</h3>
    <div class="hint">누가 무엇을 맡는지 적어두는 칸이에요. <b>볼 수 있는 범위(권한)는 안 바뀝니다</b> — 권한은 최고관리자·인사담당자·직원 세 단계 그대로예요.</div>
    <div style="max-height:34vh;overflow:auto;margin:12px 0">
      ${list.length? list.map(d=>{
        const n=staffByDuty(d.id).length;
        return `<div class="trow" style="gap:6px">
          <div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">${esc(d.name)}</div>
            <div class="tiny muted">${n? staffByDuty(d.id).map(s=>esc(s.name)).join(', ') : '맡은 사람 없음'}</div></div>
          <button class="btn soft xs" onclick="renameDuty('${d.id}')">✏️</button>
          <button class="btn soft xs" style="color:var(--danger)" onclick="delDuty('${d.id}')">✕</button>
        </div>`; }).join('') : emptyBox('🧰','아래에서 담당 분야를 추가하세요')}
    </div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:11px 12px;margin-bottom:10px">
      <div class="tiny muted" style="margin-bottom:7px">새 담당 추가</div>
      <input id="dtName" placeholder="예: 수술방 담당" style="margin-bottom:6px" list="dutySeed"
        onkeydown="if(event.key==='Enter')addDuty()">
      <datalist id="dutySeed">${DUTY_SEED.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
      <button class="btn sm block" onclick="addDuty()">추가</button>
    </div>
    <div class="tiny muted">직원 카드를 열면 담당 분야를 골라 달 수 있어요.</div>`, back||null);
}
function addDuty(){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const name=($('#dtName').value||'').trim(); if(!name){ toast('담당 이름을 적어주세요'); return; }
  if(!Array.isArray(DB.duties)) DB.duties=[];
  if(DB.duties.some(d=>d.name===name)){ toast('이미 있는 담당이에요'); return; }
  DB.duties.push({id:uid(), name, at:now()});
  saveDB(); openDuties(); toast('추가했어요');
}
function renameDuty(id){
  const d=dutyById(id); if(!d) return;
  const v=prompt('담당 이름', d.name); if(v==null) return;
  const name=v.trim(); if(!name) return;
  d.name=name; saveDB(); openDuties(); toast('바꿨어요');
}
function delDuty(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const d=dutyById(id); if(!d) return;
  const n=staffByDuty(id).length;
  if(!confirm(`"${d.name}" 담당을 지울까요?${n?`\n${n}명에게 달려 있던 표시도 같이 없어집니다.`:''}`)) return;
  DB.duties=DB.duties.filter(x=>x.id!==id);
  DB.staff.forEach(s=>{ if(s.duties) s.duties=s.duties.filter(x=>x!==id); });
  saveDB(); openDuties(); toast('지웠어요');
}

/* ---- 거래처 -----------------------------------------------------------
   영업사원 연락처를 폰에만 두면 그 사람이 그만둘 때 같이 사라진다.
   이름·연락처·비고만 받고 나머지는 안 정한다 — 병원마다 적는 게 다르다. */
function vendorById(id){ return (DB.vendors||[]).find(v=>v.id===id); }
function openVendors(back){
  const list=(DB.vendors||[]);
  modal(`<h3>🏢 거래처</h3>
    <div class="hint">거래처와 영업사원 연락처를 적어두는 곳이에요. 사람이 바뀌어도 병원에 남습니다.</div>
    <div style="max-height:38vh;overflow:auto;margin:12px 0">
      ${list.length? list.map(v=>`<div class="trow" style="gap:6px">
        <div class="avatar" style="background:var(--brand-soft);color:var(--brand)">🏢</div>
        <div class="grow" style="min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(v.name)}</div>
          <div class="tiny muted">${v.contact? esc(v.contact) : '연락처 없음'}${v.note?' · '+esc(v.note):''}</div></div>
        ${v.contact&&/[\d]/.test(v.contact)?`<a class="btn soft xs" href="tel:${esc(String(v.contact).replace(/[^\d+]/g,''))}">📞</a>`:''}

}
function openVendorForm(id){
  const v=id?vendorById(id):null;
  modal(`<h3>${v?'거래처 수정':'🏢 거래처 추가'}</h3>
    <label class="field"><span>이름 *</span><input id="vdName" value="${v?esc(v.name):''}" placeholder="예: 오스템임플란트 · 김영업"></label>
    <label class="field"><span>연락처</span><input id="vdContact" value="${v?esc(v.contact||''):''}" placeholder="010-0000-0000 · 담당자 이름"></label>
    <label class="field"><span>비고</span><textarea id="vdNote" rows="4" placeholder="예: 픽스처·힐링 담당 · 금요일 방문 · 패키지 1,000만원">${v?esc(v.note||''):''}</textarea></label>
    <button class="btn block" onclick="saveVendor('${v?v.id:''}')">${v?'수정':'추가'}</button>
    ${v?`<button class="btn soft block" style="margin-top:8px;color:var(--danger)" onclick="delVendor('${v.id}')">삭제</button>`:''}`,
    ()=>openVendors());
}
function saveVendor(id){
  const name=($('#vdName').value||'').trim(); if(!name){ toast('이름을 적어주세요'); return; }
  const contact=($('#vdContact').value||'').trim(), note=($('#vdNote').value||'').trim();
  if(!Array.isArray(DB.vendors)) DB.vendors=[];
  if(id){ const v=vendorById(id); if(v) Object.assign(v,{name,contact,note}); }
  else DB.vendors.push({id:uid(), name, contact, note, at:now()});
  saveDB(); openVendors(); toast(id?'수정했어요':'추가했어요');
}
function delVendor(id){
  if(!isOwner()){ toast('삭제는 최고관리자만 할 수 있어요'); return; }
  if(!confirm('이 거래처를 지울까요?')) return;
  DB.vendors=(DB.vendors||[]).filter(v=>v.id!==id);
  saveDB(); openVendors(); toast('지웠어요');
}

/* ---- 퇴사 처리 --------------------------------------------------------
   근로기준법 §42 는 근로계약 서류를 퇴직일부터 3년 보존하라고 한다.
   그래서 삭제가 아니라 '퇴사'로 남긴다 — 로그인만 막고 기록은 지키자. */
function retireStaff(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const s=staffById(id); if(!s) return;
  if(s.role===ROLE_OWNER){
    const others=DB.staff.filter(x=>x.id!==id && x.role===ROLE_OWNER && x.active!==false);
    if(!others.length){ toast('마지막 최고관리자는 퇴사 처리할 수 없어요'); return; }
  }
  const rem=annualRemain(s).remain;
  modal(`<h3>🚪 ${esc(s.name)} 님 퇴사 처리</h3>
    <div class="hint">로그인만 막고 <b>기록은 그대로 둡니다.</b> 근로계약 서류는 퇴직일부터 <b>3년간 보관</b>해야 해서, 지우지 않고 퇴사로 남깁니다.<br>
      <span class="lawcite">근거 · 근로기준법 제42조</span></div>
    <label class="field" style="margin-top:12px"><span>마지막 근무일</span><input id="rtDay" type="date" value="${todayKey()}"></label>
    ${rem>0?`<div class="tiny" style="color:var(--warn);margin:-4px 2px 12px">남은 ${leaveWord()} <b>${rem}일</b> — 정산하셨는지 확인하세요.</div>`:''}
    <label class="field"><span>메모 (안 적어도 돼요)</span><input id="rtNote" placeholder="예: 개인 사정 · 이직"></label>
    <button class="btn block" onclick="doRetire('${id}')">퇴사 처리</button>
    <div class="tiny muted" style="margin-top:10px">잘못 눌러도 직원 카드에서 <b>복직</b>으로 되돌릴 수 있어요.</div>`,
    ()=>openStaffForm(id));
}
function doRetire(id){
  const s=staffById(id); if(!s) return;
  s.active=false;
  s.retiredAt=$('#rtDay').value||todayKey();
  s.retireNote=($('#rtNote').value||'').trim();
  const rg=resignOf(id);
  if(rg && rg.status==='제출'){ rg.status='수리'; rg.handledAt=now(); rg.handledBy=(currentUser()||{}).id||''; }
  hrLog('퇴사', `${s.name} 퇴사 처리 · 마지막 근무일 ${s.retiredAt}`);
  saveDB(); closeModal(); renderStaff(); renderHome(); applyRole();
  toast(`${s.name} 님을 퇴사 처리했어요`);
}
function unretireStaff(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const s=staffById(id); if(!s) return;
  if(!confirm(`${s.name} 님을 다시 재직으로 되돌릴까요?\n로그인이 다시 열립니다.`)) return;
  s.active=true; delete s.retiredAt; delete s.retireNote;
  hrLog('퇴사', `${s.name} 복직 처리`);
  saveDB(); closeModal(); renderStaff(); renderHome(); applyRole(); toast('복직 처리했어요');
}


/* ---- 노무 점검 ---------------------------------------------------------
   노무사를 두는 병원은 많지 않다. 그래서 앱이 "지금 안 하고 있는 것"만
   한 화면에 모아 보여준다.
   다만 이건 체크리스트지 적법 판정이 아니다 — 여기가 다 초록이어도
   병원 사정에 따라 다른 게 있을 수 있다. 그 말을 화면에 적어 둔다. */
const CONTRACT_MUST=[
  ['payAmount','기본급'], ['payParts','임금 구성항목'], ['payCalc','계산 방법'],
  ['payDay','지급일'], ['payMethod','지급 방법'],
  ['workHours','근무시간'], ['restDay','쉬는 날(주휴일)'], ['annual','휴가'],
];
// 계약서 본문은 잠겨 있어 열쇠 없이는 빈칸을 볼 수 없다. 열쇠가 열려 있을 때만 채운다.
let contractGaps=null;
async function scanContracts(){
  const key=payUnlocked(); if(!key){ contractGaps=null; return; }
  const out={};
  for(const c of (DB.contracts||[])){
    const d=await payDec(key, c.enc); if(!d) continue;
    out[c.staffId]=CONTRACT_MUST.filter(f=>!String(d[f[0]]||'').trim()).map(f=>f[1]);
  }
  contractGaps=out;
}
function hrCheckView(){
  const all=activeStaff(), ym=monthKey();
  const noContract=all.filter(s=>!contractOf(s.id));
  const notAgreed=all.filter(s=>{const c=contractOf(s.id);return c&&!c.agreedAt;});
  const gaps=contractGaps? all.filter(s=>(contractGaps[s.id]||[]).length) : [];
  const noPay=all.filter(s=>!(DB.payslips||[]).some(x=>x.staffId===s.id && x.ym===ym));
  const pendResign=(DB.resignations||[]).filter(r=>r.status==='제출');
  const oldGone=DB.staff.filter(s=>s.active===false && s.retiredAt
    && (tms(todayKey())-tms(s.retiredAt))/DAY_MS > 365*3);

          ${cite?`<div class="lawcite" style="margin-top:5px">근거 · ${esc(cite)}</div>`:''}
        </div>

          <div style="font-weight:900;font-size:19px;color:var(--${bad?'danger':'ok'})">${bad?n||'!':'✓'}</div>
          ${go?`<button class="btn soft xs" style="margin-top:4px" onclick="${go}">보기 ›</button>`:''}
        </div></div></div>`;
  };

  const bad=[noContract.length,notAgreed.length,gaps.length,noPay.length,pendResign.length,docPending().length].filter(Boolean).length + (noKey?1:0);

  return `<div class="card" style="box-shadow:none;background:${bad?'var(--warn-soft)':'var(--ok-soft)'};border:0;padding:14px 15px;margin-bottom:12px">
      <div style="font-weight:900;color:var(--${bad?'warn':'ok'});font-size:15px">${bad? `지금 챙길 것이 ${bad}가지 있어요` : '지금 챙길 것은 없어요'}</div>
      <div class="tiny muted" style="margin-top:6px">직원 <b>${staffCount()}명</b> 기준 · ${isSmallBiz()?'5인 미만':'5인 이상'} 병원으로 보고 있어요.
        숫자가 다르면 <b>설정 → 우리 병원 직원 수</b>에서 고치세요.</div>
    </div>

    ${item(noKey,'🔐','급여 열쇠',
      noKey? '아직 안 정하셨어요. 이걸 정해야 근로계약서와 급여명세서를 넣을 수 있습니다.' : '정해져 있어요.',
      null, null, noKey?'openPayKeySetup()':'')}

    ${item(noContract.length,'📝','근로계약서를 안 쓴 사람',
      '임금·근무시간·쉬는 날·휴가를 적은 종이를 직원에게 한 장 드려야 합니다. 안 쓰거나 써놓고 안 건네면 500만원 이하 벌금입니다.',
      noContract, '근로기준법 제17조 · 제114조', "hrTab('contract')")}

    ${item(notAgreed.length,'✍️','계약서를 만들었지만 직원 확인을 안 받은 사람',
      '직원이 내용을 읽고 확인한 기록이 있어야 나중에 다툼이 없습니다.',
      notAgreed, null, "hrTab('contract')")}

    ${contractGaps===null
      ? `<div class="card" style="padding:13px 14px;margin-bottom:8px">
          <div style="font-weight:800">🔍 계약서 빈칸 검사</div>
          <div class="tiny muted" style="margin-top:4px">계약서는 잠겨 있어요. 열쇠를 넣으면 빠진 칸이 있는지 봐 드립니다.</div>
          <button class="btn soft sm block" style="margin-top:8px" onclick="runContractScan()">🔓 열쇠 넣고 검사</button></div>`
      : item(gaps.length,'🔍','계약서에 빈칸이 있는 사람',
          '꼭 적어야 하는 칸이 비어 있어요: '+CONTRACT_MUST.map(f=>f[1]).join(' · '),
          gaps.map(s=>staffLabel(s.id)+' ('+(contractGaps[s.id]||[]).join('·')+')'),
          '근로기준법 제17조', "hrTab('contract')")}

    ${item(noPay.length,'💰',`이번 달(${ym}) 급여명세서를 못 받은 사람`,
      '급여를 줄 때마다 명세서를 한 장씩 드려야 합니다. 빠뜨리거나 항목이 빠진 채로 드려도 과태료 대상이에요. (아직 급여일 전이면 괜찮습니다)',
      noPay, '근로기준법 제48조제2항', "hrTab('pay')")}

    ${item(docPending().length,'📋','아직 처리 안 한 신청서',
      '직원이 낸 육아휴직·병가 같은 신청서예요. 승인이든 반려든 답을 줘야 직원이 계획을 세울 수 있습니다.',
      docPending().map(r=>staffLabel(r.staffId)+' ('+docTypeName(r.typeId)+')'), null, "hrTab('docs')")}

    ${item(pendResign.length,'📄','아직 처리 안 한 사직서',
      '사직서는 받은 날부터 날짜를 셉니다. 처리를 미루면 퇴직일이 뒤로 밀려요.',

    ${oldGone.length? `<div class="card" style="padding:13px 14px;margin-bottom:8px">
      <div style="font-weight:800">🗂️ 보관 기간이 지난 퇴사자 ${oldGone.length}명</div>
      <div class="tiny muted" style="margin-top:4px">퇴직일부터 3년이 지났어요. 이제 지우셔도 됩니다(꼭 지워야 하는 건 아니에요).</div>
      <div class="tiny" style="margin-top:5px">${oldGone.map(s=>esc(s.name)+' · '+esc(s.retiredAt)).join(', ')}</div>
      <div class="lawcite" style="margin-top:5px">근거 · 근로기준법 제42조</div></div>`:''}

    <div class="card" style="box-shadow:none;background:var(--bg);padding:14px 15px;margin-top:14px">
      <div style="font-weight:900;margin-bottom:4px">🙋 막히면 여기에 물어보세요</div>
      <div class="tiny muted" style="margin-bottom:10px">노무사를 두지 않은 병원도 무료로 물어볼 수 있는 곳이 있어요.</div>
      <a class="btn soft block" href="tel:1350">📞 고용노동부 상담 1350 — 평일 09~18시</a>

/* ---- 서류 · 신청서 -----------------------------------------------------
   노무 신청서는 종류가 많다 — 육아휴직·출산전후휴가·가족돌봄·병가·무급휴가…
   병원마다 쓰는 것도 부르는 이름도 달라서 목록으로 두고 직접 늘리게 한다.

   흐름: 관리자가 양식을 올려두면 → 직원이 내려받아 작성하고 → 올린다 →
   관리자가 확인하고 승인한다.
   지금은 파일을 올릴 곳(Firebase Storage)이 없어서 신청·승인·기록까지만
   된다. 첨부 자리(files)는 미리 비워 두었으니 Storage 를 켜면 그대로 붙는다. */
const DOCTYPE_SEED=[
  {name:'육아휴직', note:'만 8세 이하 또는 초등학교 2학년 이하 자녀'},
  {name:'출산전후휴가', note:''},
  {name:'배우자 출산휴가', note:''},
  {name:'가족돌봄휴가', note:''},
  {name:'병가', note:'진단서는 종이로 받아 병원이 보관하세요'},
  {name:'무급휴가', note:''},
  {name:'경조사휴가', note:''},
];
const DOC_STATES={제출:'warn', 승인:'ok', 반려:'grey'};
function ensureDocTypes(){
  if(!Array.isArray(DB.docTypes)) DB.docTypes=[];
  if(!DB.docTypes.length) DB.docTypes=DOCTYPE_SEED.map(x=>({id:uid(), name:x.name, note:x.note, at:now()}));
}
function docTypeById(id){ return (DB.docTypes||[]).find(t=>t.id===id); }
function docTypeName(id){ const t=docTypeById(id); return t? t.name : '기타'; }
function docReqsOf(sid){ return (DB.docReqs||[]).filter(r=>r.staffId===sid).sort((a,b)=>String(b.at).localeCompare(String(a.at))); }
function docPending(){ return (DB.docReqs||[]).filter(r=>r.status==='제출'); }

/* 신청서 쓰기 — 관리자는 직원을 골라 대신 올릴 수 있다.
   권고사직처럼 병원이 먼저 얘기를 꺼내는 경우와, 로그인이 막힌 퇴사자 때문이다. */

    ${forSelf? '' : `<label class="field"><span>누구 것인가요</span><select id="dqStaff">
      ${DB.staff.map(s=>`<option value="${s.id}" ${s.id===target?'selected':''}>${esc(s.name)}${s.active===false?' (퇴사)':''}${esc(s.dept?' · '+s.dept:'')}</option>`).join('')}

    <label class="field"><span>무엇을 신청하나요</span><select id="dqType" onchange="docTypeHint()">
      ${types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}

    <div class="two">

      <div class="tiny muted">📎 <b>서류 파일 올리기는 아직 준비 중</b>이에요. 지금은 종이로 내시고, 관리자가 받았다고 표시합니다.</div>
    </div>
    <button class="btn block" onclick="saveDocReq()">신청서 내기</button>`,
    isHR()? (()=>{ hrTab('docs'); closeModal(); }) : null);

function docTypeHint(){
  const el=$('#dqHint'), sel=$('#dqType'); if(!el||!sel) return;
  const t=docTypeById(sel.value);
  el.innerHTML = t&&t.note? esc(t.note) : '';
}
function saveDocReq(){
  const me=currentUser(); if(!me) return;
  const forSelf=!isHR();
  const sid = forSelf? me.id : (($('#dqStaff')||{}).value||me.id);
  const typeId=$('#dqType').value;
  const from=$('#dqFrom').value||todayKey(), to=$('#dqTo').value||'';
  if(to && to<from){ toast('종료일이 시작일보다 빨라요'); return; }
  if(!Array.isArray(DB.docReqs)) DB.docReqs=[];
  DB.docReqs.unshift({id:uid(), staffId:sid, typeId, from, to,
    reason:($('#dqWhy').value||'').trim(), status:'제출',
    at:now(), by:me.id, byName:me.name, onBehalf:!forSelf,
    handledAt:null, handledBy:null, handleNote:'',
    paperGot:false, paperNote:'', files:[]});          // files 는 Storage 켜면 채운다
  if(!forSelf) hrLog('신청서', `${(staffById(sid)||{}).name||''} ${docTypeName(typeId)} 대신 등록`);
  saveDB(); closeModal(); renderStaff(); renderHome();
  toast(forSelf? '신청서를 냈어요' : '대신 등록했어요');
}
function openDocReq(id){

      ${r.handledAt?`<div class="spread" style="padding:3px 0"><span class="tiny muted">처리</span>
        <b class="tiny">${fmtDateFull(String(r.handledAt).slice(0,10))} · ${esc((staffById(r.handledBy)||{}).name||'')}</b></div>`:''}
      ${r.reason?`<div style="margin-top:8px"><div class="tiny muted">사유</div>
        <div class="tiny" style="white-space:pre-wrap;margin-top:3px">${esc(r.reason)}</div></div>`:''}
      ${r.handleNote?`<div style="margin-top:8px"><div class="tiny muted">처리 메모</div>
        <div class="tiny" style="white-space:pre-wrap;margin-top:3px">${esc(r.handleNote)}</div></div>`:''}
    </div>
    ${t&&t.note?`<div class="tiny muted" style="margin:-6px 2px 12px">${esc(t.note)}</div>`:''}

    ${isHR()? `<div class="card" style="box-shadow:none;background:var(--bg);padding:12px 14px;margin-bottom:12px">
      <label class="trow" style="cursor:pointer;gap:8px;padding:2px 0;border:0">

        <span class="tiny grow"><b>서류를 종이로 받았어요</b> — 원본은 병원이 보관합니다</span></label>
      <input id="dqPaperNote" value="${esc(r.paperNote||'')}" placeholder="예: 진단서 1부 · 8/19 접수" style="margin-top:8px">
      <div class="tiny muted" style="margin-top:6px">진단서 같은 건강 관련 서류는 앱에 올리지 않고 여기에 표시만 해두세요.</div>
      <button class="btn soft sm block" style="margin-top:8px" onclick="saveDocPaper('${r.id}')">표시 저장</button>
    </div>` : (r.paperGot?`<div class="tiny" style="color:var(--ok);font-weight:700;margin:0 2px 12px">✓ 서류 접수됨</div>`:'')}

    ${isHR()&&r.status==='제출'? `<label class="field"><span>처리 메모 (안 적어도 돼요)</span><input id="dqNote" placeholder="예: 8/25부터 시작하기로 함"></label>
      <div class="row">
        <button class="btn grow" onclick="handleDocReq('${r.id}','승인')">승인</button>
        <button class="btn soft grow" style="color:var(--danger)" onclick="handleDocReq('${r.id}','반려')">반려</button>
      </div>`:''}
    ${mine&&r.status==='제출'?`<button class="btn soft block" style="margin-top:8px;color:var(--danger)" onclick="delDocReq('${r.id}')">신청 취소</button>`:''}
    ${isHR()&&r.status!=='제출'?`<button class="btn soft block" onclick="handleDocReq('${r.id}','제출')">처리 되돌리기</button>`:''}`,
    isHR()? (()=>{ hrTab('docs'); closeModal(); }) : null);
}
function saveDocPaper(id){
  const r=(DB.docReqs||[]).find(x=>x.id===id); if(!r||!isHR()) return;
  r.paperGot=$('#dqPaper').checked; r.paperNote=($('#dqPaperNote').value||'').trim();
  saveDB(); toast(r.paperGot?'서류 받은 것으로 표시했어요':'표시를 지웠어요');
  openDocReq(id);
}
function handleDocReq(id, st){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const r=(DB.docReqs||[]).find(x=>x.id===id); if(!r) return;
  const me=currentUser();
  const note=($('#dqNote')||{}).value;
  r.status=st;
  if(st==='제출'){ r.handledAt=null; r.handledBy=null; }
  else { r.handledAt=now(); r.handledBy=me?me.id:''; if(note!=null) r.handleNote=String(note).trim(); }
  hrLog('신청서', `${staffLabel(r.staffId)} ${docTypeName(r.typeId)} ${st}`);
  saveDB(); closeModal(); renderStaff(); renderHome();
  toast(st==='제출'? '되돌렸어요' : st+'했어요');
}
function delDocReq(id){
  const r=(DB.docReqs||[]).find(x=>x.id===id), me=currentUser();
  if(!r||!me||me.id!==r.staffId) return;
  if(!confirm('낸 신청서를 취소할까요?')) return;
  DB.docReqs=DB.docReqs.filter(x=>x.id!==id);
  saveDB(); closeModal(); renderStaff(); toast('취소했어요');
}

/* 신청 유형 — 병원이 직접 늘리고 줄인다 */
function openDocTypes(back){
  ensureDocTypes();
  modal(`<h3>🗂️ 신청 유형</h3>
    <div class="hint">병원에서 쓰는 신청서 종류를 적어두는 곳이에요. 여기 없는 건 직접 추가하시면 됩니다.</div>
    <div style="max-height:34vh;overflow:auto;margin:12px 0">
      ${(DB.docTypes||[]).map(t=>{
        const n=(DB.docReqs||[]).filter(r=>r.typeId===t.id).length;
        return `<div class="trow" style="gap:6px">
          <div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">${esc(t.name)}</div>
            <div class="tiny muted">${t.note?esc(t.note):'—'}${n?` · 신청 ${n}건`:''}</div></div>
          <button class="btn soft xs" onclick="editDocType('${t.id}')">✏️</button>
          <button class="btn soft xs" style="color:var(--danger)" onclick="delDocType('${t.id}')">✕</button>
        </div>`; }).join('')}
    </div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:11px 12px">
      <div class="tiny muted" style="margin-bottom:7px">새 유형 추가</div>
      <input id="dtN" placeholder="예: 배우자 출산휴가" style="margin-bottom:5px">
      <input id="dtNote" placeholder="설명 (안 적어도 돼요)" style="margin-bottom:6px">
      <button class="btn sm block" onclick="addDocType()">추가</button>
    </div>`, back||null);
}
function addDocType(){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const name=($('#dtN').value||'').trim(); if(!name){ toast('이름을 적어주세요'); return; }
  if((DB.docTypes||[]).some(t=>t.name===name)){ toast('이미 있는 유형이에요'); return; }
  DB.docTypes.push({id:uid(), name, note:($('#dtNote').value||'').trim(), at:now()});
  saveDB(); openDocTypes(); toast('추가했어요');
}
function editDocType(id){
  const t=docTypeById(id); if(!t) return;
  const n=prompt('유형 이름', t.name); if(n==null) return;
  if(!n.trim()) return;
  const note=prompt('설명 (없으면 비워두세요)', t.note||'');
  t.name=n.trim(); if(note!=null) t.note=note.trim();
  saveDB(); openDocTypes(); toast('바꿨어요');
}
function delDocType(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const n=(DB.docReqs||[]).filter(r=>r.typeId===id).length;
  if(n){ toast(`이미 낸 신청서 ${n}건이 있어 지울 수 없어요`); return; }
  DB.docTypes=(DB.docTypes||[]).filter(t=>t.id!==id);
  saveDB(); openDocTypes(); toast('지웠어요');
}

/* 사직서 — 관리자가 직원 대신 올릴 수 있게. 권고사직이나, 로그인이 막힌
   퇴사자를 대신 등록할 때 필요하다. */
function openResignFormFor(sid){
  if(!isHR()) return openResignForm();
  modal(`<h3>📄 사직서 대신 등록</h3>
    <div class="hint">직원 <b>대신</b> 올리는 화면이에요. 권고사직이거나 이미 퇴사 처리돼 로그인이 막힌 분을 등록할 때 씁니다. 누가 대신 올렸는지 기록에 남습니다.</div>
    <label class="field"><span>누구 것인가요</span><select id="rgStaff">
      ${DB.staff.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}${s.active===false?' (퇴사)':''}${esc(s.dept?' · '+s.dept:'')}</option>`).join('')}

    <label class="field"><span>낸 날 (종이로 받은 날을 적으세요)</span><input id="rgOn" type="date" value="${todayKey()}"></label>

    <label class="field"><span>사유 · 메모</span><textarea id="rgWhy" rows="3" placeholder="예: 권고사직 · 본인 동의"></textarea></label>
    <div class="tiny muted" style="margin:-4px 2px 12px">종이 사직서 원본은 병원이 보관하세요. 근로계약 서류는 퇴직일부터 <b>3년</b> 보관해야 합니다.<br><span class="lawcite">근거 · 근로기준법 제42조</span></div>
    <button class="btn block" onclick="saveResignFor()">대신 등록</button>`,
    ()=>{ hrTab('docs'); closeModal(); });
}
function saveResignFor(){
  if(!isHR()) return;
  const me=currentUser();
  const sid=$('#rgStaff').value, on=$('#rgOn').value||todayKey();
  const lastDay=$('#rgLast').value||todayKey(), reason=($('#rgWhy').value||'').trim();
  if(!Array.isArray(DB.resignations)) DB.resignations=[];
  DB.resignations.unshift({id:uid(), staffId:sid, submittedAt:on+'T09:00:00.000Z', submitDay:on,
    lastDay, reason, status:'제출', handledAt:null, handledBy:null,
    onBehalf:true, by:me?me.id:'', byName:me?me.name:''});
  hrLog('사직', `${staffLabel(sid)} 사직서 대신 등록 (낸 날 ${on})`);
  saveDB(); closeModal(); renderStaff(); renderHome(); toast('대신 등록했어요');
}

function printDoc(title, body){
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  const d=f.contentDocument;
  d.open();
  d.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    *{box-sizing:border-box} body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      color:#12211f; padding:28px 26px; word-break:keep-all; line-height:1.7}
    h1{font-size:22px; font-weight:800; letter-spacing:-.01em; line-height:1.35; margin:0 0 6px; text-align:center}
    .sub{font-size:12.5px; color:#4b5f5c; text-align:center; margin:0 0 20px}
    table{width:100%; border-collapse:collapse; font-size:12.5px}
    th,td{border:1px solid #c9d6d3; padding:7px 10px; text-align:left; vertical-align:top}
    th{background:#f2f7f6; width:34%; font-weight:700}
    .note{font-size:11.5px; color:#4b5f5c; margin-top:14px}
    .sign{margin-top:26px; font-size:12.5px; line-height:2.4}
    .foot{font-size:11px; color:#6b7d7a; margin-top:18px}
    @page{margin:14mm}
  </style></head><body>${body}</body></html>`);
  d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('인쇄 창을 열지 못했어요'); }
                   setTimeout(()=>f.remove(), 1500); }, 260);
}

/* ---------- 백업 · 복구 ----------
   복구는 되돌리기의 마지막 수단이라, 실수로 눌러도 데이터가 날아가지 않게 만든다.
   ① 무엇이 든 파일인지 보여주고 확인받는다  ② 덮기 직전 상태를 남겨 한 번 되돌릴 수 있게 한다
   ③ 옛 백업에 없는 항목은 ensureSchema()가 채운다  ④ 공유 서버에 곧바로 반영한다 */
const RESTORE_KEY = 'hospital_mgr_prev';
const BACKUP_KEYS = ['staff','inventory','invLogs','attendance','leaves','implantCases',
                     'notices','contracts','payslips','docReqs','vendors'];
function backupSummary(d){
  const n=k=>Array.isArray(d&&d[k])?d[k].length:0;
  return { staff:n('staff'), inv:n('inventory'), att:n('attendance'), leave:n('leaves'),
           pay:n('payslips'), doc:n('docReqs'), imp:n('implantCases'),
           at: d && d.lastBackupAt ? String(d.lastBackupAt).slice(0,10) : '' };
}
// 이 앱의 백업이 맞는지 — 형식만 흉내 낸 파일이 전체 데이터를 덮어쓰지 못하게
function looksLikeBackup(d){
  if(!d || typeof d!=='object' || !d.version || !Array.isArray(d.staff)) return false;
  return BACKUP_KEYS.filter(k=>Array.isArray(d[k])).length >= 3;
}
function summaryLine(s){
  return `직원 ${s.staff}명 · 재고 ${s.inv}건 · 근무기록 ${s.att}건 · 연월차 ${s.leave}건 · 급여명세서 ${s.pay}건`;
}
function exportData(){
  DB.lastBackupAt = new Date().toISOString();
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`병원관리_백업_${todayKey()}.json`; a.click(); URL.revokeObjectURL(a.href);
  saveDB();
  toast(`백업 저장 — ${summaryLine(backupSummary(DB))}`);

}

/* ---------- 리포트 내보내기 (엑셀에서 열리는 CSV) ---------- */
function csvBlob(rows){
  const q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportInventory(){
  const rows=[['품목명','분류','단위','현재수량','최소보유량','거래처','단가','유통기한','상태','메모']];
  DB.inventory.forEach(i=>{ const dd=dDays(i.expiry);
    rows.push([i.name,i.category,i.unit,i.qty,i.minQty,i.vendor||'',i.price||'',i.expiry||'',
      i.qty===0?'품절':(i.qty<=i.minQty?'부족':(dd!==null&&dd<0?'유통기한만료':(dd!==null&&dd<=30?'유통기한임박':'충분'))), i.note]); });
  download(csvBlob(rows), `재고현황_${todayKey()}.csv`); toast('재고 현황을 내보냈어요');
}
function exportAttendance(mk){
  mk = mk || (($('#attDate') && $('#attDate').value) || todayKey()).slice(0,7);
  const rows=[['날짜','직원','부서','출근','퇴근','근무시간']];
  DB.attendance.filter(a=>a.date.startsWith(mk))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(a=>{ const s=staffById(a.staffId);
      rows.push([a.date, s?s.name:'', s?s.dept:'', a.inAt?fmtTime(a.inAt):'', a.outAt?fmtTime(a.outAt):'',
        (hoursBetween(a.inAt,a.outAt)||0).toFixed(1)]); });
  download(csvBlob(rows), `근무기록_${mk}.csv`); toast(`${mk} 근무기록을 내보냈어요`);
}
function exportLeaves(){
  const tl={annual:'연차',monthly:'월차',half:'반차',sick:'병가',etc:'기타'};
  const st={pending:'대기',approved:'승인',rejected:'반려'};
  const rows=[['직원','종류','시작일','종료일','일수','상태','사유','신청일']];
  DB.leaves.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))
    .forEach(l=>{ const s=staffById(l.staffId);
      rows.push([s?s.name:'', tl[l.type]||l.type, l.startDate, l.endDate, l.days,
        st[l.status]||l.status, l.reason, l.createdAt?new Date(l.createdAt).toLocaleDateString('ko-KR'):'']); });
  download(csvBlob(rows), `연월차내역_${todayKey()}.csv`); toast('연월차 내역을 내보냈어요');
}
function importData(){ $('#importFile').click(); }
function doImport(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let d; try{ d=JSON.parse(r.result); }catch(e){ toast('읽을 수 없는 파일이에요'); return; }
    if(!looksLikeBackup(d)){ toast('이 앱의 백업 파일이 아니에요 — 덮어쓰지 않았어요'); return; }
    const nw=backupSummary(d), cur=backupSummary(DB);
    const ok = confirm(
      '백업 파일을 불러올까요?\n\n'+
      '[파일 안]\n'+summaryLine(nw)+(nw.at?`\n만든 날 ${nw.at}`:'')+'\n\n'+
      '[지금 데이터]\n'+summaryLine(cur)+'\n\n'+
      '지금 데이터는 파일 내용으로 바뀝니다. 공유 중이면 모든 기기에서 함께 바뀝니다.\n'+
      '불러온 뒤 설정에서 한 번은 되돌릴 수 있어요.');
    if(!ok){ toast('불러오기를 취소했어요'); return; }
    try{ localStorage.setItem(RESTORE_KEY, JSON.stringify(DB)); }catch(e){}
    DB=d; ensureSchema();
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    cloudPushNow();
    closeModal(); $('#hospName').textContent=DB.hospName||'우리병원 관리';
    applyRole(); go('home');
    toast('불러왔어요 — 잘못 불렀으면 설정에서 되돌리세요');
  };
  r.onerror=()=>toast('파일을 읽지 못했어요');
  r.readAsText(f);
}
function hasRestoreUndo(){ return !!localStorage.getItem(RESTORE_KEY); }
function undoRestore(){
  const raw=localStorage.getItem(RESTORE_KEY);
  if(!raw){ toast('되돌릴 게 없어요'); return; }
  let prev; try{ prev=JSON.parse(raw); }catch(e){ toast('되돌릴 자료가 깨졌어요'); return; }
  if(!confirm('불러오기 직전 상태로 되돌릴까요?\n방금 불러온 내용은 사라집니다.')) return;
  DB=prev; ensureSchema();
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  localStorage.removeItem(RESTORE_KEY);
  cloudPushNow(); closeModal();
  $('#hospName').textContent=DB.hospName||'우리병원 관리';
  applyRole(); go('home'); toast('되돌렸어요');
}
function wipeData(){
  if(!confirm('모든 데이터를 삭제하고 초기 상태로 되돌릴까요? 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(STORE_KEY); loadDB(); closeModal();
  $('#hospName').textContent=DB.hospName; go('home'); toast('초기화되었습니다');
}

/* ========================================================================
   공통 (모달 / 토스트 / 유틸)
   ======================================================================== */
/* 여러 단계를 지나는 화면(급여 짝짓기·명세서 미리보기 등)에서 되돌아갈 수 있게.
   두 번째 인자로 '이전 화면을 다시 그리는 함수'를 주면 위에 ‹ 이전 이 붙는다. */
let mBackFn=null;
function modal(html, back){
  mBackFn = back || null;
  $('#modalBody').innerHTML = (mBackFn? `<button class="mback" onclick="modalBack()">‹ 이전</button>` : '') + html;
  $('#modalBg').classList.add('open'); document.body.style.overflow='hidden';
  $('#modal').scrollTop=0;
}
function modalBack(){ const f=mBackFn; mBackFn=null; if(f) f(); }
function closeModal(){ mBackFn=null; $('#modalBg').classList.remove('open'); document.body.style.overflow=''; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ========================================================================
   공유 동기화 — 데이터를 "누가 보느냐"로 나눠 담는다
   ------------------------------------------------------------------------
   예전에는 전부를 문서 하나에 넣고 로그인한 사람에게 통째로 내려줬다.
   화면에서 가려도 데이터는 이미 그 사람 폰에 가 있었다. 그래서 나눈다.

     shared/main      재고·출퇴근·연월차·공지·거래처   승인된 직원 모두
     roster/main      직원 명단 (PIN 은 여기 없다)      승인된 직원 모두
     secrets/main     PIN·인사기록                      최고관리자·인사담당자
     people/{직원}    계약서·급여·신청서·사직서         본인 + 관리자
     claims/{기기}    이 기기가 누구 것인지             본인(신청) · 관리자(승인)

   막는 것은 화면이 아니라 보안규칙이다(firestore.rules). 규칙은 사람을
   request.auth.uid 로 알아보고, uid 가 누구인지는 claims 문서가 말해준다.
   ======================================================================== */
let fdb=null, cloudReady=false, applyingRemote=false, pushTimer=null;
let myUid='', myClaim=null, claimResolved=false;
let baseUnsubs=[];             // 항상 켜둔다 — 이 기기가 누구인지, 복구 문이 열렸는지
let unsubs=[];                 // 승인된 뒤에만 여는 것들. 로그아웃하면 이것만 닫는다
let pinMap={};                 // 관리자만 채워진다. 직원 기기에서는 비어 있다
let got={shared:false, roster:false, secrets:false, people:false};   // 받아본 적 있는 문서만 되쓴다
let mine={shared:0, roster:0, secrets:0, people:0};                  // 내가 마지막으로 쓴 시각
// 내가 방금 쓴 것보다 오래된 문서가 도착하면 버린다.
// 안 그러면 계정을 만든 직후 그 전에 저장된 빈 명단이 도착해 계정을 지운다 — 실제로 그랬다.
function stale(kind, d){ return !!(d && d.updatedAt && mine[kind] && d.updatedAt < mine[kind]); }
let booting=false;             // 최초 이전 중에만 전부 쓸 수 있다
let legacyDoc=null;            // 옛 단일 문서 — 옮기고 나면 읽기만 한다

const WS = ()=> window.WORKSPACE_ID || 'clinic';
const B_SHARED = ['version','hospName','inventory','invLogs','purchases','attendance','leaves',
  'implants','implantLogs','implantCases','masters','notices','duties','vendors','hosp',
  'docTypes','docForms','geo','members','prefs','payLock','lastBackupAt'];
const B_PERSON = ['contracts','payslips','resignations','docReqs'];

function cloudConfigured(){
  const c=window.FIREBASE_CONFIG;
  return !!(c && c.apiKey && c.projectId && !window.__noFB && typeof firebase!=='undefined');
}

function refRoster(){ return wsRef().collection('roster').doc('main'); }
