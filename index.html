/* ---- 서류 · 신청서 -----------------------------------------------------
   노무 신청서는 종류가 많다 — 육아휴직·출산전후휴가·가족돌봄·병가·무급휴가…
   병원마다 쓰는 것도 부르는 이름도 달라서 목록으로 두고 직접 늘리게 한다.

   흐름: 관리자가 양식을 올려두면 → 직원이 내려받아 작성하고 → 올린다 →
   관리자가 확인하고 승인한다.
   지금은 파일을 올릴 곳(Firebase Storage)이 없어서 신청·승인·기록까지만
   된다. 첨부 자리(files)는 미리 비워 두었으니 Storage 를 켜면 그대로 붙는다. */
const DOCTYPE_SEED=[
  {name:'육아휴직', note:'만 8세 이하 또는 초등학교 2학년 이하 자녀'},
  {name:'출산전후휴가', note:''},
  {name:'배우자 출산휴가', note:''},
  {name:'가족돌봄휴가', note:''},
  {name:'병가', note:'진단서는 종이로 받아 병원이 보관하세요'},
  {name:'무급휴가', note:''},
  {name:'경조사휴가', note:''},
];
const DOC_STATES={제출:'warn', 승인:'ok', 반려:'grey'};
function ensureDocTypes(){
  if(!Array.isArray(DB.docTypes)) DB.docTypes=[];
  if(!DB.docTypes.length) DB.docTypes=DOCTYPE_SEED.map(x=>({id:uid(), name:x.name, note:x.note, at:now()}));
}
function docTypeById(id){ return (DB.docTypes||[]).find(t=>t.id===id); }
function docTypeName(id){ const t=docTypeById(id); return t? t.name : '기타'; }
function docReqsOf(sid){ return (DB.docReqs||[]).filter(r=>r.staffId===sid).sort((a,b)=>String(b.at).localeCompare(String(a.at))); }
function docPending(){ return (DB.docReqs||[]).filter(r=>r.status==='제출'); }

/* 신청서 쓰기 — 관리자는 직원을 골라 대신 올릴 수 있다.
   권고사직처럼 병원이 먼저 얘기를 꺼내는 경우와, 로그인이 막힌 퇴사자 때문이다. */
function openDocForm(sid){
  ensureDocTypes();
  const me=currentUser(); if(!me) return;
  const forSelf=!isHR();
  const target=forSelf? me.id : (sid||me.id);
  const types=DB.docTypes||[];
  if(!types.length){ toast('먼저 신청 유형을 만들어 주세요'); openDocTypes(); return; }
  modal(`<h3>📋 신청서 내기</h3>
    ${forSelf? `<div class="hint">낸 시각이 그대로 기록돼요. 관리자가 확인하고 승인합니다.</div>`
             : `<div class="hint">직원 <b>대신</b> 올리는 화면이에요. 누가 대신 올렸는지 기록에 남습니다.</div>`}
    ${forSelf? '' : `<label class="field"><span>누구 것인가요</span><select id="dqStaff">
      ${DB.staff.map(s=>`<option value="${s.id}" ${s.id===target?'selected':''}>${esc(s.name)}${s.active===false?' (퇴사)':''}${esc(s.dept?' · '+s.dept:'')}</option>`).join('')}
    </select></label>`}
    <label class="field"><span>무엇을 신청하나요</span><select id="dqType" onchange="docTypeHint()">
      ${types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
    </select></label>
    <div id="dqHint" class="tiny muted" style="margin:-6px 2px 10px"></div>
    <div class="two">
      <label class="field"><span>시작일</span><input id="dqFrom" type="date" value="${todayKey()}"></label>
      <label class="field"><span>종료일 (모르면 비워두세요)</span><input id="dqTo" type="date"></label>
    </div>
    <label class="field"><span>사유 · 하고 싶은 말</span><textarea id="dqWhy" rows="3" placeholder="안 적어도 돼요"></textarea></label>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:11px 13px;margin-bottom:12px">
      <div class="tiny muted">📎 <b>서류 파일 올리기는 아직 준비 중</b>이에요. 지금은 종이로 내시고, 관리자가 받았다고 표시합니다.</div>
    </div>
    <button class="btn block" onclick="saveDocReq()">신청서 내기</button>`,
    isHR()? (()=>{ hrTab('docs'); closeModal(); }) : null);
  docTypeHint();
}
function docTypeHint(){
  const el=$('#dqHint'), sel=$('#dqType'); if(!el||!sel) return;
  const t=docTypeById(sel.value);
  el.innerHTML = t&&t.note? esc(t.note) : '';
}
function saveDocReq(){
  const me=currentUser(); if(!me) return;
  const forSelf=!isHR();
  const sid = forSelf? me.id : (($('#dqStaff')||{}).value||me.id);
  const typeId=$('#dqType').value;
  const from=$('#dqFrom').value||todayKey(), to=$('#dqTo').value||'';
  if(to && to<from){ toast('종료일이 시작일보다 빨라요'); return; }
  if(!Array.isArray(DB.docReqs)) DB.docReqs=[];
  DB.docReqs.unshift({id:uid(), staffId:sid, typeId, from, to,
    reason:($('#dqWhy').value||'').trim(), status:'제출',
    at:now(), by:me.id, byName:me.name, onBehalf:!forSelf,
    handledAt:null, handledBy:null, handleNote:'',
    paperGot:false, paperNote:'', files:[]});          // files 는 Storage 켜면 채운다
  if(!forSelf) hrLog('신청서', `${(staffById(sid)||{}).name||''} ${docTypeName(typeId)} 대신 등록`);
  saveDB(); closeModal(); renderStaff(); renderHome();
  toast(forSelf? '신청서를 냈어요' : '대신 등록했어요');
}
function openDocReq(id){
  const r=(DB.docReqs||[]).find(x=>x.id===id); if(!r) return;
  const s=staffById(r.staffId), me=currentUser();
  const mine=me&&me.id===r.staffId;
  const t=docTypeById(r.typeId);
  modal(`<h3>📋 ${esc(docTypeName(r.typeId))} · ${esc(staffLabel(r.staffId))}</h3>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:13px 14px;margin-bottom:14px">
      <div class="spread" style="padding:3px 0"><span class="tiny muted">낸 날</span>
        <b class="tiny">${fmtDateFull(String(r.at).slice(0,10))} ${fmtTime(r.at)}${r.onBehalf?` · ${esc(r.byName||'')}가 대신`:''}</b></div>
      <div class="spread" style="padding:3px 0"><span class="tiny muted">기간</span>
        <b class="tiny">${esc(r.from)}${r.to?' ~ '+esc(r.to):' ~ (미정)'}</b></div>
      <div class="spread" style="padding:3px 0"><span class="tiny muted">상태</span>
        <b class="tiny"><span class="pill ${DOC_STATES[r.status]||'grey'}">${esc(r.status)}</span></b></div>
      ${r.handledAt?`<div class="spread" style="padding:3px 0"><span class="tiny muted">처리</span>
        <b class="tiny">${fmtDateFull(String(r.handledAt).slice(0,10))} · ${esc((staffById(r.handledBy)||{}).name||'')}</b></div>`:''}
      ${r.reason?`<div style="margin-top:8px"><div class="tiny muted">사유</div>
        <div class="tiny" style="white-space:pre-wrap;margin-top:3px">${esc(r.reason)}</div></div>`:''}
      ${r.handleNote?`<div style="margin-top:8px"><div class="tiny muted">처리 메모</div>
        <div class="tiny" style="white-space:pre-wrap;margin-top:3px">${esc(r.handleNote)}</div></div>`:''}
    </div>
    ${t&&t.note?`<div class="tiny muted" style="margin:-6px 2px 12px">${esc(t.note)}</div>`:''}

    ${isHR()? `<div class="card" style="box-shadow:none;background:var(--bg);padding:12px 14px;margin-bottom:12px">
      <label class="trow" style="cursor:pointer;gap:8px;padding:2px 0;border:0">
        <input type="checkbox" id="dqPaper" ${r.paperGot?'checked':''} style="width:auto;margin:0;flex:none">
        <span class="tiny grow"><b>서류를 종이로 받았어요</b> — 원본은 병원이 보관합니다</span></label>
      <input id="dqPaperNote" value="${esc(r.paperNote||'')}" placeholder="예: 진단서 1부 · 8/19 접수" style="margin-top:8px">
      <div class="tiny muted" style="margin-top:6px">진단서 같은 건강 관련 서류는 앱에 올리지 않고 여기에 표시만 해두세요.</div>
      <button class="btn soft sm block" style="margin-top:8px" onclick="saveDocPaper('${r.id}')">표시 저장</button>
    </div>` : (r.paperGot?`<div class="tiny" style="color:var(--ok);font-weight:700;margin:0 2px 12px">✓ 서류 접수됨</div>`:'')}

    ${isHR()&&r.status==='제출'? `<label class="field"><span>처리 메모 (안 적어도 돼요)</span><input id="dqNote" placeholder="예: 8/25부터 시작하기로 함"></label>
      <div class="row">
        <button class="btn grow" onclick="handleDocReq('${r.id}','승인')">승인</button>
        <button class="btn soft grow" style="color:var(--danger)" onclick="handleDocReq('${r.id}','반려')">반려</button>
      </div>`:''}
    ${mine&&r.status==='제출'?`<button class="btn soft block" style="margin-top:8px;color:var(--danger)" onclick="delDocReq('${r.id}')">신청 취소</button>`:''}
    ${isHR()&&r.status!=='제출'?`<button class="btn soft block" onclick="handleDocReq('${r.id}','제출')">처리 되돌리기</button>`:''}`,
    isHR()? (()=>{ hrTab('docs'); closeModal(); }) : null);
}
function saveDocPaper(id){
  const r=(DB.docReqs||[]).find(x=>x.id===id); if(!r||!isHR()) return;
  r.paperGot=$('#dqPaper').checked; r.paperNote=($('#dqPaperNote').value||'').trim();
  saveDB(); toast(r.paperGot?'서류 받은 것으로 표시했어요':'표시를 지웠어요');
  openDocReq(id);
}
function handleDocReq(id, st){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const r=(DB.docReqs||[]).find(x=>x.id===id); if(!r) return;
  const me=currentUser();
  const note=($('#dqNote')||{}).value;
  r.status=st;
  if(st==='제출'){ r.handledAt=null; r.handledBy=null; }
  else { r.handledAt=now(); r.handledBy=me?me.id:''; if(note!=null) r.handleNote=String(note).trim(); }
  hrLog('신청서', `${staffLabel(r.staffId)} ${docTypeName(r.typeId)} ${st}`);
  saveDB(); closeModal(); renderStaff(); renderHome();
  toast(st==='제출'? '되돌렸어요' : st+'했어요');
}
function delDocReq(id){
  const r=(DB.docReqs||[]).find(x=>x.id===id), me=currentUser();
  if(!r||!me||me.id!==r.staffId) return;
  if(!confirm('낸 신청서를 취소할까요?')) return;
  DB.docReqs=DB.docReqs.filter(x=>x.id!==id);
  saveDB(); closeModal(); renderStaff(); toast('취소했어요');
}

/* 신청 유형 — 병원이 직접 늘리고 줄인다 */
function openDocTypes(back){
  ensureDocTypes();
  modal(`<h3>🗂️ 신청 유형</h3>
    <div class="hint">병원에서 쓰는 신청서 종류를 적어두는 곳이에요. 여기 없는 건 직접 추가하시면 됩니다.</div>
    <div style="max-height:34vh;overflow:auto;margin:12px 0">
      ${(DB.docTypes||[]).map(t=>{
        const n=(DB.docReqs||[]).filter(r=>r.typeId===t.id).length;
        return `<div class="trow" style="gap:6px">
          <div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">${esc(t.name)}</div>
            <div class="tiny muted">${t.note?esc(t.note):'—'}${n?` · 신청 ${n}건`:''}</div></div>
          <button class="btn soft xs" onclick="editDocType('${t.id}')">✏️</button>
          <button class="btn soft xs" style="color:var(--danger)" onclick="delDocType('${t.id}')">✕</button>
        </div>`; }).join('')}
    </div>
    <div class="card" style="box-shadow:none;background:var(--bg);padding:11px 12px">
      <div class="tiny muted" style="margin-bottom:7px">새 유형 추가</div>
      <input id="dtN" placeholder="예: 배우자 출산휴가" style="margin-bottom:5px">
      <input id="dtNote" placeholder="설명 (안 적어도 돼요)" style="margin-bottom:6px">
      <button class="btn sm block" onclick="addDocType()">추가</button>
    </div>`, back||null);
}
function addDocType(){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const name=($('#dtN').value||'').trim(); if(!name){ toast('이름을 적어주세요'); return; }
  if((DB.docTypes||[]).some(t=>t.name===name)){ toast('이미 있는 유형이에요'); return; }
  DB.docTypes.push({id:uid(), name, note:($('#dtNote').value||'').trim(), at:now()});
  saveDB(); openDocTypes(); toast('추가했어요');
}
function editDocType(id){
  const t=docTypeById(id); if(!t) return;
  const n=prompt('유형 이름', t.name); if(n==null) return;
  if(!n.trim()) return;
  const note=prompt('설명 (없으면 비워두세요)', t.note||'');
  t.name=n.trim(); if(note!=null) t.note=note.trim();
  saveDB(); openDocTypes(); toast('바꿨어요');
}
function delDocType(id){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const n=(DB.docReqs||[]).filter(r=>r.typeId===id).length;
  if(n){ toast(`이미 낸 신청서 ${n}건이 있어 지울 수 없어요`); return; }
  DB.docTypes=(DB.docTypes||[]).filter(t=>t.id!==id);
  saveDB(); openDocTypes(); toast('지웠어요');
}

/* 양식 보관함 — 관리자가 양식을 올려두면 직원이 내려받아 쓴다.
   파일은 Storage 를 켜야 올릴 수 있어서, 지금은 어떤 양식이 있는지와
   어디서 받는지만 적어둔다. */
function openDocForms(back){
  ensureDocTypes();
  const list=(DB.docForms||[]);
  modal(`<h3>📁 양식 보관함</h3>
    <div class="hint">직원이 받아서 쓸 양식을 모아두는 곳이에요.</div>
    <div class="card" style="box-shadow:none;background:var(--warn-soft);border:0;padding:12px 14px;margin:12px 0">
      <div class="tiny" style="font-weight:900;color:var(--warn);margin-bottom:4px">📎 파일 올리기는 아직 준비 중이에요</div>
      <div class="tiny muted">파일을 넣어둘 곳(Firebase Storage)을 켜야 합니다. 그때까지는 양식 이름과 <b>어디서 받는지</b>만 적어두세요 — 직원이 보고 찾아갈 수 있게요.</div>
    </div>
    <div style="max-height:32vh;overflow:auto;margin-bottom:12px">
      ${list.length? list.map(f=>`<div class="trow" style="gap:6px">
        <div class="avatar" style="background:var(--brand-soft);color:var(--brand)">📄</div>
        <div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">${esc(f.name)}</div>
          <div class="tiny muted">${f.where?esc(f.where):'받는 곳 안 적음'}</div></div>
        ${isHR()?`<button class="btn soft xs" onclick="delDocForm('${f.id}')" style="color:var(--danger)">✕</button>`:''}
      </div>`).join('') : emptyBox('📁','아직 등록한 양식이 없어요')}
    </div>
    ${isHR()?`<div class="card" style="box-shadow:none;background:var(--bg);padding:11px 12px">
      <div class="tiny muted" style="margin-bottom:7px">양식 추가</div>
      <input id="dfName" placeholder="예: 육아휴직 신청서" style="margin-bottom:5px">
      <input id="dfWhere" placeholder="어디서 받나요 (예: 고용노동부 누리집 서식자료실)" style="margin-bottom:6px">
      <button class="btn sm block" onclick="addDocForm()">추가</button>
    </div>`:''}`, back||null);
}
function addDocForm(){
  if(!isHR()){ toast('최고관리자와 인사담당자만 할 수 있어요'); return; }
  const name=($('#dfName').value||'').trim(); if(!name){ toast('양식 이름을 적어주세요'); return; }
  if(!Array.isArray(DB.docForms)) DB.docForms=[];
  DB.docForms.push({id:uid(), name, where:($('#dfWhere').value||'').trim(), at:now(), file:null});
  saveDB(); openDocForms(); toast('추가했어요');
}
function delDocForm(id){
  if(!isHR()) return;
  if(!confirm('이 양식을 지울까요?')) return;
  DB.docForms=(DB.docForms||[]).filter(f=>f.id!==id);
  saveDB(); openDocForms(); toast('지웠어요');
}

/* 서류 탭 — 신청서와 사직서를 한자리에서 본다 */
function hrDocsView(){
  ensureDocTypes();
  const reqs=(DB.docReqs||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const resigns=(DB.resignations||[]).slice().sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));
  const pend=reqs.filter(r=>r.status==='제출').length + resigns.filter(r=>r.status==='제출').length;
  const row=(icon,title,sub,pill,pillCls,go)=>`<div class="trow" style="cursor:pointer" onclick="${go}">
      <div class="avatar" style="background:var(--brand-soft);color:var(--brand)">${icon}</div>
      <div class="grow" style="min-width:0"><div style="font-weight:800">${title}</div>
        <div class="tiny muted">${sub}</div></div>
      <span class="pill ${pillCls}">${pill}</span><span class="tiny muted">›</span></div>`;
  return `<div class="hint">직원이 낸 신청서와 사직서를 여기서 확인하고 승인해요. 직원 대신 올려드릴 수도 있습니다.</div>
    <div class="row" style="gap:6px;margin:12px 2px">
      <button class="btn sm" onclick="openDocForm()">＋ 신청서</button>
      <button class="btn soft sm" onclick="openResignFormFor()">＋ 사직서</button>
      <span class="grow"></span>
      <button class="btn soft sm" onclick="openDocForms()">📁 양식</button>
      <button class="btn soft sm" onclick="openDocTypes()">🗂️ 유형</button>
    </div>
    ${pend? `<div class="card" style="box-shadow:none;background:var(--warn-soft);border:0;padding:11px 14px;margin-bottom:10px">
      <div class="tiny" style="font-weight:900;color:var(--warn)">처리를 기다리는 서류 ${pend}건</div></div>`:''}
    ${(reqs.length||resigns.length)? `<div>
      ${resigns.map(r=>row('📄', `사직서 · ${esc(staffLabel(r.staffId))}`,
          `${fmtDateFull(String(r.submittedAt).slice(0,10))} 냄 · 마지막 ${esc(r.lastDay||'-')}`,
          esc(r.status), r.status==='제출'?'warn':'ok', `openResignView('${r.id}')`)).join('')}
      ${reqs.map(r=>row('📋', `${esc(docTypeName(r.typeId))} · ${esc(staffLabel(r.staffId))}`,
          `${fmtDateFull(String(r.at).slice(0,10))} 냄 · ${esc(r.from)}${r.to?' ~ '+esc(r.to):''}${r.onBehalf?' · 대신 등록':''}${r.paperGot?' · 서류 받음':''}`,
          esc(r.status), DOC_STATES[r.status]||'grey', `openDocReq('${r.id}')`)).join('')}
    </div>` : emptyBox('🗂️','아직 낸 서류가 없어요')}`;
}

/* 사직서 — 관리자가 직원 대신 올릴 수 있게. 권고사직이나, 로그인이 막힌
   퇴사자를 대신 등록할 때 필요하다. */
function openResignFormFor(sid){
  if(!isHR()) return openResignForm();
  modal(`<h3>📄 사직서 대신 등록</h3>
    <div class="hint">직원 <b>대신</b> 올리는 화면이에요. 권고사직이거나 이미 퇴사 처리돼 로그인이 막힌 분을 등록할 때 씁니다. 누가 대신 올렸는지 기록에 남습니다.</div>
    <label class="field"><span>누구 것인가요</span><select id="rgStaff">
      ${DB.staff.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}${s.active===false?' (퇴사)':''}${esc(s.dept?' · '+s.dept:'')}</option>`).join('')}
    </select></label>
    <label class="field"><span>낸 날 (종이로 받은 날을 적으세요)</span><input id="rgOn" type="date" value="${todayKey()}"></label>
    <label class="field"><span>마지막 근무일</span><input id="rgLast" type="date" value="${todayKey()}"></label>
    <label class="field"><span>사유 · 메모</span><textarea id="rgWhy" rows="3" placeholder="예: 권고사직 · 본인 동의"></textarea></label>
    <div class="tiny muted" style="margin:-4px 2px 12px">종이 사직서 원본은 병원이 보관하세요. 근로계약 서류는 퇴직일부터 <b>3년</b> 보관해야 합니다.<br><span class="lawcite">근거 · 근로기준법 제42조</span></div>
    <button class="btn block" onclick="saveResignFor()">대신 등록</button>`,
    ()=>{ hrTab('docs'); closeModal(); });
}
function saveResignFor(){
  if(!isHR()) return;
  const me=currentUser();
  const sid=$('#rgStaff').value, on=$('#rgOn').value||todayKey();
  const lastDay=$('#rgLast').value||todayKey(), reason=($('#rgWhy').value||'').trim();
  if(!Array.isArray(DB.resignations)) DB.resignations=[];
  DB.resignations.unshift({id:uid(), staffId:sid, submittedAt:on+'T09:00:00.000Z', submitDay:on,
    lastDay, reason, status:'제출', handledAt:null, handledBy:null,
    onBehalf:true, by:me?me.id:'', byName:me?me.name:''});
  hrLog('사직', `${staffLabel(sid)} 사직서 대신 등록 (낸 날 ${on})`);
  saveDB(); closeModal(); renderStaff(); renderHome(); toast('대신 등록했어요');
}

/* ---- 인쇄 -------------------------------------------------------------- */
function printDoc(title, body){
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  const d=f.contentDocument;
  d.open();
  d.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    *{box-sizing:border-box} body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      color:#12211f; padding:28px 26px; word-break:keep-all; line-height:1.7}
    h1{font-size:22px; font-weight:800; letter-spacing:-.01em; line-height:1.35; margin:0 0 6px; text-align:center}
    .sub{font-size:12.5px; color:#4b5f5c; text-align:center; margin:0 0 20px}
    table{width:100%; border-collapse:collapse; font-size:12.5px}
    th,td{border:1px solid #c9d6d3; padding:7px 10px; text-align:left; vertical-align:top}
    th{background:#f2f7f6; width:34%; font-weight:700}
    .note{font-size:11.5px; color:#4b5f5c; margin-top:14px}
    .sign{margin-top:26px; font-size:12.5px; line-height:2.4}
    .foot{font-size:11px; color:#6b7d7a; margin-top:18px}
    @page{margin:14mm}
  </style></head><body>${body}</body></html>`);
  d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('인쇄 창을 열지 못했어요'); }
                   setTimeout(()=>f.remove(), 1500); }, 260);
}

/* ---- 직원 탭 — 관리자는 노무, 직원은 자기 1페이지 ---------------------- */
let hrView='check';
function hrTab(v){ hrView=v; renderStaff(); }
function renderStaff(){
  const wrap=$('#staffWrap'); if(!wrap) return;
  if(!isHR()){ wrap.innerHTML=myPageHtml(); return; }
  const tabs=[['check','점검'],['list','명단'],['notice','공지'],['contract','근로계약서'],['pay','급여명세서'],['docs','서류']];
  const pend=(DB.resignations||[]).filter(r=>r.status==='제출').length
            +(DB.docReqs||[]).filter(r=>r.status==='제출').length;
  wrap.innerHTML=`<div class="spread" style="margin:4px 2px 12px">
      <h2 class="sec" style="margin:0">👥 직원 · 노무</h2>
      ${hrView==='list'?`<button class="btn sm" onclick="openStaffForm()">＋ 직원</button>`:''}
    </div>
    <div class="seg" style="margin-bottom:12px">
      ${tabs.map(t=>`<button class="${t[0]===hrView?'on':''}" onclick="hrTab('${t[0]}')">${t[1]}${t[0]==='docs'&&pend?` <span class="pill warn" style="margin-left:3px">${pend}</span>`:''}</button>`).join('')}
    </div>
    <div>${
      hrView==='check'? hrCheckView() :
      hrView==='notice'? hrNoticeView() :
      hrView==='contract'? hrContractView() :
      hrView==='pay'? hrPayView() :
      hrView==='docs'? hrDocsView() :
      hrView==='resign'? hrDocsView() : hrListHtml()}</div>`;
}
let staffShowGone=false;
function toggleGone(){ staffShowGone=!staffShowGone; renderStaff(); }
function hrListHtml(){
  if(!DB.staff.length) return `<div class="card">${emptyBox('👥','＋직원 버튼으로 직원을 추가하세요')}</div>`;
  const gone=DB.staff.filter(s=>s.active===false);
  const list=staffShowGone? gone : DB.staff.filter(s=>s.active!==false);
  return `<div class="hint">직원 <b>이름을 누르면</b> 정보·연차·담당을 바로 고칠 수 있어요.</div>
    <div class="row" style="gap:6px;margin:10px 2px">
      <button class="btn ${staffShowGone?'soft':''} sm" onclick="if(staffShowGone)toggleGone()">재직 ${DB.staff.length-gone.length}</button>
      <button class="btn ${staffShowGone?'':'soft'} sm" onclick="if(!staffShowGone)toggleGone()">퇴사 ${gone.length}</button>
      <span class="grow"></span>
      <button class="btn soft sm" onclick="openDuties()">🧰 담당</button>
      <button class="btn soft sm" onclick="openVendors()">🏢 거래처</button>
    </div>
    <div>`
    + (list.length? list.map(s=>{
    const r=annualRemain(s), c=contractOf(s.id), ps=payslipsOf(s.id)[0], rg=resignOf(s.id);
    const flags=[];
    if(isEmployer(s)) flags.push('<span class="pill grey">사업주</span>');
    else if(!c) flags.push('<span class="pill danger">계약서 없음</span>');
    else if(!c.agreedAt) flags.push('<span class="pill warn">계약서 확인 전</span>');
    if(rg && rg.status==='제출') flags.push('<span class="pill warn">사직서</span>');
    if(s.active===false) flags.push(`<span class="pill grey">퇴사${s.retiredAt?' · '+esc(s.retiredAt):''}</span>`);
    dutiesOf(s).forEach(d=>flags.push(`<span class="pill info">${esc(d)}</span>`));
    return `<div class="card" style="padding:13px 14px;margin-bottom:8px">
      <div class="spread" style="cursor:pointer" onclick="openStaffHub('${s.id}')">
        <div class="row" style="gap:11px"><div class="avatar">${esc(initials(s.name))}</div>
          <div><div class="t" style="font-weight:800">${esc(s.name)} <span class="tiny muted" style="font-weight:600">${esc(s.position||'')}</span>
            ${s.role!==ROLE_STAFF?`<span class="pill info">${esc(ROLE_KO[s.role]||'')}</span>`:''}</div>
            <div class="d tiny muted">${esc(s.dept||'부서 미지정')}${s.joinDate?' · 입사 '+s.joinDate+(serviceNth(s.joinDate)?' · '+serviceNth(s.joinDate)+'년차':''):''}</div></div></div>
        <div style="text-align:right"><div style="font-weight:800;color:var(--brand)">${leaveWord()} ${r.remain}일</div>
          <div class="tiny muted">/ 총 ${r.total}일${s.annualAuto===false?' (수동)':''}</div></div></div>
      ${flags.length?`<div class="row" style="gap:5px;margin-top:8px;flex-wrap:wrap">${flags.join('')}</div>`:''}
      <div class="row" style="gap:6px;margin-top:9px;flex-wrap:wrap">
        <button class="btn soft xs" onclick="openContract('${s.id}')">📝 계약서</button>
        ${ps?`<button class="btn soft xs" onclick="openPayslip('${ps.id}')">💰 ${esc(ps.ym)}</button>`:''}
        ${rg?`<button class="btn soft xs" onclick="openResignView('${rg.id}')">📄 사직서</button>`:''}
        ${s.active!==false
          ? `<button class="btn soft xs" onclick="retireStaff('${s.id}')">🚪 퇴사 처리</button>`
          : `<button class="btn soft xs" onclick="unretireStaff('${s.id}')">↩︎ 복직</button>`}
      </div></div>`;
  }).join('') : emptyBox('👥', staffShowGone?'퇴사한 직원이 없어요':'재직중인 직원이 없어요'))
    + '</div>';
}
// 직원이 보는 내 1페이지 — 자기 것만 보인다

          <div class="grow" style="min-width:0"><div class="tiny" style="font-weight:${read?'600':'900'}">${n.must?'📌 ':''}${esc(n.title)}</div>

            <div class="tiny muted">${esc(r.from)}${r.to?' ~ '+esc(r.to):''} · ${fmtDateFull(String(r.at).slice(0,10))} 냄</div></div>

    <div class="card" style="padding:13px 14px">
      <button class="btn soft block" onclick="changeMyPin()">내 PIN 변경</button>
    </div>`;
}

function tipHtml(html){
  return `<span class="tip" tabindex="0" role="button" aria-label="설명 보기" onclick="tipTap(event,this)">i<span class="tipbox">${html}</span></span>`;
}
function tipTap(e,el){
  if(e.target.closest && e.target.closest('.tipbox')) return;   // 설명 안을 눌러도 안 닫힌다
  e.stopPropagation();
  const was=el.classList.contains('on');
  document.querySelectorAll('.tip.on').forEach(x=>x.classList.remove('on'));
  if(!was) el.classList.add('on');
}
function sechead(title, html){ return `<div class="sechead"><span>${title}</span>${tipHtml(html)}</div>`; }

  $('#hospName').textContent=DB.hospName; toast('저장되었습니다'); }
function setGeoOn(v){ DB.geo.on=!!v; saveDB();
  if(v && DB.geo.lat==null) toast('켜짐 · 먼저 "현재 위치를 병원으로 저장"을 눌러주세요');
  else toast(v?'GPS 출근 확인 켜짐':'GPS 출근 확인 꺼짐'); }
function setGeoRadius(v){ DB.geo.radiusM=parseInt(v,10)||200; saveDB(); toast(`반경 ${DB.geo.radiusM}m로 설정`); }
function saveClinicLoc(){
  if(!navigator.geolocation){ toast('이 기기는 위치를 지원하지 않아요'); return; }
  toast('📍 위치 확인 중…');
  navigator.geolocation.getCurrentPosition(pos=>{
    DB.geo.lat=pos.coords.latitude; DB.geo.lng=pos.coords.longitude; saveDB();
    toast('병원 위치를 저장했어요');
    if($('#modalBg').classList.contains('open')) openMenu();
  }, ()=>{ toast('위치 권한이 필요해요(크롬/사파리에서 위치 허용)'); }, {enableHighAccuracy:true, timeout:8000, maximumAge:0});
}
/* ---------- 백업 · 복구 ----------
   복구는 되돌리기의 마지막 수단이라, 실수로 눌러도 데이터가 날아가지 않게 만든다.
   ① 무엇이 든 파일인지 보여주고 확인받는다  ② 덮기 직전 상태를 남겨 한 번 되돌릴 수 있게 한다
   ③ 옛 백업에 없는 항목은 ensureSchema()가 채운다  ④ 공유 서버에 곧바로 반영한다 */
const RESTORE_KEY = 'hospital_mgr_prev' + (WS_ID==='clinic' ? '' : ':'+WS_ID);
const BACKUP_KEYS = ['staff','inventory','invLogs','attendance','leaves','implantCases',
                     'notices','contracts','payslips','docReqs','vendors'];
function backupSummary(d){
  const n=k=>Array.isArray(d&&d[k])?d[k].length:0;
  return { staff:n('staff'), inv:n('inventory'), att:n('attendance'), leave:n('leaves'),
           pay:n('payslips'), doc:n('docReqs'), imp:n('implantCases'),
           at: d && d.lastBackupAt ? String(d.lastBackupAt).slice(0,10) : '' };
}
// 이 앱의 백업이 맞는지 — 형식만 흉내 낸 파일이 전체 데이터를 덮어쓰지 못하게
function looksLikeBackup(d){
  if(!d || typeof d!=='object' || !d.version || !Array.isArray(d.staff)) return false;
  return BACKUP_KEYS.filter(k=>Array.isArray(d[k])).length >= 3;
}
function summaryLine(s){
  return `직원 ${s.staff}명 · 재고 ${s.inv}건 · 근무기록 ${s.att}건 · 연월차 ${s.leave}건 · 급여명세서 ${s.pay}건`;
}
function exportData(){
  DB.lastBackupAt = new Date().toISOString();
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`병원관리_백업_${todayKey()}.json`; a.click(); URL.revokeObjectURL(a.href);
  saveDB();
  toast(`백업 저장 — ${summaryLine(backupSummary(DB))}`);
  if($('#modalBg').classList.contains('open')) openMenu();
}

/* ---------- 리포트 내보내기 (엑셀에서 열리는 CSV) ---------- */
function csvBlob(rows){
  const q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportInventory(){
  const rows=[['품목명','분류','단위','현재수량','최소보유량','거래처','단가','유통기한','상태','메모']];
  DB.inventory.forEach(i=>{ const dd=dDays(i.expiry);
    rows.push([i.name,i.category,i.unit,i.qty,i.minQty,i.vendor||'',i.price||'',i.expiry||'',
      i.qty===0?'품절':(i.qty<=i.minQty?'부족':(dd!==null&&dd<0?'유통기한만료':(dd!==null&&dd<=30?'유통기한임박':'충분'))), i.note]); });
  download(csvBlob(rows), `재고현황_${todayKey()}.csv`); toast('재고 현황을 내보냈어요');
}
function exportAttendance(mk){
  mk = mk || (($('#attDate') && $('#attDate').value) || todayKey()).slice(0,7);
  const rows=[['날짜','직원','부서','출근','퇴근','근무시간']];
  DB.attendance.filter(a=>a.date.startsWith(mk))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(a=>{ const s=staffById(a.staffId);
      rows.push([a.date, s?s.name:'', s?s.dept:'', a.inAt?fmtTime(a.inAt):'', a.outAt?fmtTime(a.outAt):'',
        (hoursBetween(a.inAt,a.outAt)||0).toFixed(1)]); });
  download(csvBlob(rows), `근무기록_${mk}.csv`); toast(`${mk} 근무기록을 내보냈어요`);
}
function exportLeaves(){
  const tl={annual:'연차',monthly:'월차',half:'반차',sick:'병가',etc:'기타'};
  const st={pending:'대기',approved:'승인',rejected:'반려'};
  const rows=[['직원','종류','시작일','종료일','일수','상태','사유','신청일']];
  DB.leaves.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))
    .forEach(l=>{ const s=staffById(l.staffId);

/* ---------- 최고관리자 아이디·비밀번호 ----------
   실장이 원장을 대신하는 일이 잦아, 최고관리자는 어느 기기에서든 바로 들어가야 한다.
   앱은 정답을 모른다. 아이디와 비밀번호를 늘려 만든 값만 서버에 적고, 맞는지는
   보안규칙이 판단한다. 틀려도 아무 말이 없어서 한 번에 한 번씩만 물어볼 수 있다. */
const OWNER_ITER = 250000;
async function ownerHash(id, pw, saltB64){
  const base = await crypto.subtle.importKey('raw',
    new TextEncoder().encode(String(id).trim().toLowerCase()+'|'+String(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:b64d(saltB64), iterations:OWNER_ITER, hash:'SHA-256'}, base, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function newSalt(){
  const a=new Uint8Array(16); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a));
}
/* 비밀번호를 잊었을 때 쓰는 한 번짜리 코드.
   지금까지는 잊으면 Firebase 콘솔에서 복구 문을 여는 길 하나뿐이었다.
   콘솔에 2단계 인증까지 걸리면 폰까지 있어야 하고, 폰을 잃으면 병원이 통째로 잠긴다.
   종이에 적어 둘 수 있는 코드를 같이 준다 — 콘솔도 만든 곳도 필요 없다.
   0·O·1·I 처럼 헷갈리는 글자는 뺐다. 손으로 옮겨 적을 물건이기 때문이다. */
function newRecoveryCodes(n){
  const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const b=new Uint8Array(n*10); crypto.getRandomValues(b);
  const out=[];
  for(let i=0;i<n;i++){
    let c=''; for(let j=0;j<10;j++) c+=AB[b[i*10+j] % AB.length];
    out.push(c.slice(0,5)+'-'+c.slice(5));
  }
  return out;
}
// 최고관리자 열쇠를 새로 정한다(=처음 만들 때 · 바꿀 때)
// 돌려주는 것은 종이에 적을 복구 코드다. 이때 한 번만 보여줄 수 있다 —
// 서버에는 늘린 값만 남아서 앱도 다시 꺼내지 못한다.
async function setOwnerKey(id, pw, staffId){
  const salt = newSalt();
  const hash = await ownerHash(id, pw, salt);
  const plain = newRecoveryCodes(8);
  const codes = [];
  for(const c of plain) codes.push(await ownerHash('recovery', c, salt));
  await refOwnerKey().set({ hash, codes, at: now() });   // 이건 꼭 되어야 한다
  // 표지판은 못 적어도 넘어간다. 규칙이 아직 옛 판일 수 있다.
  try{
    await refMeta().set({ ownerSalt: salt, ownerStaffId: staffId,
      hasClinic: (DB.staff||[]).length>0, updatedAt: Date.now() }, {merge:true});
  }catch(e){ console.warn('[건너뜀] meta —', (e&&e.code)||e); }
  return plain;
}

function watchClaim(){
  if(!myUid) return;
  watchRecovery(); watchLicense();
  // 서버가 확인해 준 등록만 믿는다.
  // 예전에는 아직 서버에 저장되지도 않은 내 글씨(대기 중 쓰기)를 보고 데이터를
  // 요청했다. 서버는 "그런 등록 없다"며 거절했고, 거절당한 구독은 다시 살아나지
  // 않는다. 그래서 명단이 안 내려오는 일이 생겼다 — 될 때도 있고 안 될 때도 있었다.
  baseUnsubs.push(refClaims().doc(myUid).onSnapshot({includeMetadataChanges:true}, snap=>{
    if(snap.metadata.hasPendingWrites) return;      // 아직 내 글씨다. 서버 확인을 기다린다
    myClaim = snap.exists ? snap.data() : null;
    claimResolved = true;
    if(myClaim && myClaim.approved && myClaim.staffId){
      if(sessionId()!==myClaim.staffId) setSession(myClaim.staffId);
      openData();
    }else{
      closeData();
      updateSyncBadge(myClaim ? 'waiting' : 'connecting');
      // 여기서 옛 자료를 옮기면 안 된다. 승인받지 못한 기기가 명단을 만들어
      // 버리면 '이미 연 병원' 이 되어 아무도 첫 관리자가 될 수 없다.
      applyRole();
    }
  }, ()=>updateSyncBadge('offline')));
}

}

/* 구독 기한과 제작자가 손댄 기록.
   기한은 서버가 막는 것이라 앱이 미리 알려주기만 한다 — 며칠 남았는지 모르고
   어느 날 갑자기 자료가 안 보이면 그게 더 나쁘다.
   제작자 기록은 숨기면 안 된다. 남의 병원 비밀번호를 초기화해 놓고
   아무도 모르게 두는 일이 없어야 한다. */
let licenseInfo=null, opsLatest=null;
function licenseUntil(){
  const p=licenseInfo && licenseInfo.paidUntil;
  if(!p) return null;
  try{ return p.toDate? p.toDate() : new Date(p); }catch(e){ return null; }
}
function licenseDaysLeft(){
  const d=licenseUntil(); if(!d||isNaN(d)) return null;
  return Math.ceil((d - Date.now())/86400000);
}
function watchLicense(){
  if(!fdb) return;
  baseUnsubs.push(refLicense().onSnapshot(s=>{
    licenseInfo = s.exists? (s.data()||{}) : null; renderOpsBars();
  }, ()=>{}));
  baseUnsubs.push(refOpslog().onSnapshot(qs=>{
    let latest=null;
    qs.forEach(d=>{ const v=d.data()||{};
      if(!latest || String(v.at||'') > String(latest.at||'')) latest=Object.assign({id:d.id}, v); });
    opsLatest=latest; renderOpsBars();
  }, ()=>{}));
}
function renderOpsBars(){
  const left=licenseDaysLeft(), sus=licenseInfo && licenseInfo.status==='suspended';
  let msg='';
  if(sus) msg='⏸ 사용이 멈춰 있어요 — 만든 곳에 문의해 주세요.<br><span style="font-weight:400">자료는 지워지지 않았고, 다시 열리면 그대로 살아납니다.</span>';
  else if(left!=null && left<=0) msg='📅 이용 기간이 끝났어요 — 자료를 새로 받아오지 못합니다.<br><span style="font-weight:400">기간을 늘리면 그대로 살아납니다. 기기에 남은 자료는 <b>설정 → 전체 백업</b>으로 받을 수 있어요.</span>';
  else if(left!=null && left<=7) msg=`📅 이용 기간이 <b>${left}일</b> 남았어요.`;
  setBar('licenseBar', msg, left!=null && left<=0 ? '#7a2e0c' : '#12303a');

  const o=opsLatest;
  const seen=(()=>{ try{ return localStorage.getItem('ops_seen')||''; }catch(e){ return ''; } })();
  setBar('opsBar', (o && o.id!==seen)
    ? `🛠 만든 곳에서 <b>${esc(o.what||'설정을 손댔어요')}</b>${o.at?` · ${esc(String(o.at).slice(0,10))}`:''}`+
      `<br><span style="font-weight:400"><a href="#" onclick="dismissOps();return false" style="color:#ffe8a8">확인했어요</a></span>`
    : '', '#3a2f12');
}
function dismissOps(){
  try{ localStorage.setItem('ops_seen', (opsLatest&&opsLatest.id)||''); }catch(e){}
  renderOpsBars();
}
function myRole(){ return (myClaim && myClaim.role) || ''; }
function claimIsAdmin(){ return myRole()===ROLE_OWNER || myRole()===ROLE_HR; }

/* ---------- 내가 볼 수 있는 것만 구독한다 ---------- */
let dataOpen=false, reopenTimer=null, reopenTries=0;
// 시차 때문에 한 번 거절당했다고 영영 못 읽으면 안 된다. 잠깐 뒤 다시 연다.
function reopenSoon(why){
  console.warn('[다시 연결] '+why);
  if(reopenTries>=3) return;
  reopenTries++;
  clearTimeout(reopenTimer);
  reopenTimer=setTimeout(()=>{ closeData(); if(myClaim && myClaim.approved) openData(); }, 700*reopenTries);
}
function openData(){
  if(dataOpen) return; dataOpen=true; reopenTries=0;
  const sid=myClaim.staffId;

  unsubs.push(refShared().onSnapshot(s=>{
    cloudReady=true; updateSyncBadge('online');
    const d=s.data(); if(!d) { migrateIfNeeded(); return; }
    if(stale('shared',d)) return;
    got.shared=true;
    applyLocal(()=>{ B_SHARED.forEach(k=>{ if(d[k]!==undefined) DB[k]=d[k]; }); ensureSchema(); });
  }, e=>{ updateSyncBadge('offline'); reopenSoon('shared '+((e&&e.code)||e)); }));

  unsubs.push(refRoster().onSnapshot(s=>{
    const d=s.data(); if(!d||!Array.isArray(d.staff)) return;
    if(stale('roster',d)) return;
    got.roster=true;
    applyLocal(()=>{ DB.staff=d.staff; mergeStaff(); ensureSchema(); });
  }, e=>reopenSoon('roster '+((e&&e.code)||e))));

  if(claimIsAdmin()){
    watchPendingClaims();
    unsubs.push(refSecrets().onSnapshot(s=>{
      const d=s.data()||{}; if(stale('secrets',d)) return; got.secrets=true;
      pinMap = d.pins || {};
      applyLocal(()=>{ DB.adminPin=d.adminPin||''; DB.hrLogs=Array.isArray(d.hrLogs)?d.hrLogs:[]; mergeStaff(); });
    }, e=>reopenSoon('secrets '+((e&&e.code)||e))));
    unsubs.push(wsRef().collection('people').onSnapshot(qs=>{
      got.people=true;
      applyLocal(()=>{
        B_PERSON.forEach(k=>DB[k]=[]);
        qs.forEach(doc=>{ const d=doc.data()||{};
          B_PERSON.forEach(k=>{ if(Array.isArray(d[k])) DB[k]=DB[k].concat(d[k]); }); });
        ensureSchema();
      });
    }, e=>reopenSoon('people '+((e&&e.code)||e))));
  }else{
    // 직원 기기는 자기 문서 하나만 본다. 남의 급여는 아예 내려오지 않는다.
    unsubs.push(refPeople(sid).onSnapshot(s=>{
      const d=s.data()||{}; if(stale('people',d)) return; got.people=true;
      applyLocal(()=>{ B_PERSON.forEach(k=>{ DB[k]=Array.isArray(d[k])?d[k]:[]; }); ensureSchema(); });
    }, e=>reopenSoon('내 문서 '+((e&&e.code)||e))));
  }
}
/* ---------- 기기 승인 (관리자) ---------- */
let pendingClaims=[];
function watchPendingClaims(){
  unsubs.push(refClaims().onSnapshot(qs=>{
    console.log('[대기목록 스냅샷] 문서', qs.size);
    pendingClaims=[];
    qs.forEach(d=>{ const c=d.data()||{}; if(!c.approved) pendingClaims.push(Object.assign({uid:d.id}, c)); });
    pendingClaims.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
    const dot=$('#claimDot'); if(dot) dot.style.display = pendingClaims.length? '' : 'none';
    if($('#claimList')) renderClaimList();
  }, e=>reopenSoon('대기목록 '+((e&&e.code)||e))));
}
function openOwnerKeySetup(afterRecovery){

    ${afterRecovery? `<div class="hint" style="background:var(--warn-soft)">복구 코드로 들어오셨어요. <b>지금 새로 정해야</b> 방금 쓴 코드가 더는 통하지 않습니다.</div>`:''}
    <div class="tiny muted" style="margin:10px 2px">이걸 아는 사람은 <b>어느 기기에서든</b> 최고관리자로 바로 들어옵니다. 기기 승인이 필요 없어요. 원장님과 실장님만 아셔야 합니다.</div>
    <label class="field"><span>아이디</span><input id="okId" autocomplete="username" placeholder="영문·숫자"></label>
    <label class="field"><span>비밀번호 (8자 이상)</span><input id="okPw" type="password" autocomplete="new-password" placeholder="••••••••"></label>
    <label class="field"><span>한 번 더</span><input id="okPw2" type="password" autocomplete="new-password" placeholder="••••••••"></label>
    <button class="btn block" onclick="saveOwnerKey()">저장</button>
    <div class="tiny muted" style="margin-top:10px">바꾸면 <b>예전 비밀번호로는 못 들어옵니다.</b> 이미 승인된 기기는 그대로 쓸 수 있어요.</div>`, openMenu);
}
async function saveOwnerKey(){
  const id=($('#okId').value||'').trim(), a=$('#okPw').value||'', b=$('#okPw2').value||'';
  if(!id){ toast('아이디를 입력하세요'); return; }
  if(a.length<8){ toast('비밀번호는 8자 이상으로 정해주세요'); return; }

}
function openDeviceClaims(){
  modal(`<h3>📱 기기 승인</h3>
    <div class="tiny muted" style="margin:0 2px 10px">직원이 자기 폰으로 처음 들어오면 여기에 뜹니다. <b>본인이 맞는지 확인하고</b> 승인하세요. 승인한 기기만 데이터를 받습니다.</div>
    <div id="claimList"></div>
    <div class="tiny muted" style="margin:12px 2px 0">기기를 잃어버렸으면 아래 <b>쓰던 기기</b>에서 그 기기를 지우세요. 지우면 그 폰은 바로 못 들어옵니다.</div>
    <div id="claimActive" style="margin-top:8px"></div>`, openMenu);
  renderClaimList(); renderActiveClaims();
}
function renderClaimList(){
  const el=$('#claimList'); if(!el) return;
  if(!pendingClaims.length){ el.innerHTML=`<div class="card" style="padding:14px;text-align:center"><span class="tiny muted">기다리는 기기가 없어요</span></div>`; return; }
  el.innerHTML = pendingClaims.map(c=>{
    const s=(DB.staff||[]).find(x=>normPhone(x.phone)===normPhone(c.phone||'') && x.active!==false);
    const who = c.name || (s?s.name:'') || '(명단에 없는 번호)';
    return `<div class="card" style="padding:12px 13px;margin-bottom:8px">
      <div class="row" style="justify-content:space-between;gap:8px">
        <div><b>${esc(who)}</b> <span class="tiny muted">${esc(c.phone||'')}</span></div>
        <span class="pill pend">대기</span></div>
      <div class="tiny muted" style="margin-top:4px">${esc(String(c.device||'').slice(0,60))}</div>
      <div class="two" style="gap:8px;margin-top:9px">
        <button class="btn ok xs" onclick="approveClaim('${c.uid}')">승인</button>
        <button class="btn danger xs" onclick="rejectClaim('${c.uid}')">거절</button>
      </div></div>`;
  }).join('');
}
function renderActiveClaims(){
  const el=$('#claimActive'); if(!el||!fdb) return;
  refClaims().get().then(qs=>{
    const rows=[]; qs.forEach(d=>{ const c=d.data()||{}; if(c.approved) rows.push(Object.assign({uid:d.id},c)); });
    if(!rows.length){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="tiny muted" style="font-weight:800;margin:0 2px 6px">쓰던 기기</div>` +
      rows.map(c=>`<div class="row" style="justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
        <span class="tiny"><b>${esc(c.name||'')}</b> ${esc(c.phone||'')}${c.uid===myUid?' · <b>지금 이 기기</b>':''}</span>
        ${c.uid===myUid?'':`<button class="btn danger xs" onclick="rejectClaim('${c.uid}')">지우기</button>`}
      </div>`).join('');
  }).catch(()=>{});
}
async function approveClaim(uid){
  const c=pendingClaims.find(x=>x.uid===uid); if(!c) return;
  const st=(DB.staff||[]).find(x=>normPhone(x.phone)===normPhone(c.phone||'') && x.active!==false);
  if(!st){ toast('그 번호로 등록된 직원이 없어요'); return; }
  if(c.pinHash){                                  // 직원이 넣은 PIN 이 맞는지 여기서 대조한다
    const h=await sha256Hex(String(st.pin||'')+'|'+normPhone(st.phone));
    if(h!==c.pinHash){ toast('PIN이 맞지 않아요 — 승인하지 않았어요'); return; }
  }
  try{
    await refClaims().doc(uid).set({ staffId:st.id, name:st.name, phone:normPhone(st.phone),
      role:st.role||ROLE_STAFF, approved:true, approvedAt:now(), approvedBy:(currentUser()||{}).name||'' }, {merge:true});
    toast(`${st.name}님 기기를 승인했어요`);
  }catch(e){ toast('승인하지 못했어요'); }
}
function rejectClaim(uid){
  if(uid===myUid){ toast('지금 쓰는 기기는 지울 수 없어요'); return; }
  if(!confirm('이 기기를 지울까요?\n그 기기는 바로 들어올 수 없게 됩니다.')) return;
  refClaims().doc(uid).delete().then(()=>{ toast('지웠어요'); renderActiveClaims(); }).catch(()=>toast('지우지 못했어요'));
}

function closeData(){
  if(!dataOpen) return; dataOpen=false;
  unsubs.forEach(f=>{ try{f();}catch(e){} }); unsubs=[];
  cloudReady=false; pinMap={}; pendingClaims=[];
  
  got={shared:false, roster:false, secrets:false, people:false};
}

/* ---------- 옛 단일 문서 → 새 구조로 한 번만 옮긴다 ---------- */
let migrating=false;
function migrateIfNeeded(){
  if(migrating || !legacyDoc) return;
  migrating=true;
  refShared().get().then(sh=>{
    if(sh.exists){ migrating=false; return; }             // 이미 옮겼다
    booting=true;
    return legacyDoc.get().then(old=>{
      const raw=old.exists && old.data() && old.data().db;
      let had=false;
      if(raw){ try{ const o=JSON.parse(raw); if(o && o.version){ applyLocal(()=>{ DB=o; ensureSchema(); }); had=true; } }catch(e){} }
      // 아무도 없는 상태로 빈 명단을 먼저 저장하면, 서버가 '이미 연 병원' 으로 보고
      // 정작 첫 관리자를 막는다. 옮길 것이 있을 때만 쓴다.
      if(!had && !(DB.staff||[]).length) return;
      return writeAll();
    }).then(()=>{ booting=false; migrating=false; });
  }).catch(()=>{ migrating=false; });
}

/* ---------- 내보내기 ---------- */
// 한 번도 받아본 적 없는 문서는 덮어쓰지 않는다.
// 아직 못 받은 기기가 저장을 하면 자기 빈 데이터로 남의 것을 지워버린다 — 실제로 명단이 날아갔다.
function writeAll(){
  if(!fdb) return Promise.resolve();
  const jobs=[], t=Date.now(), stamp={ updatedAt: t };
  const admin = booting || claimIsAdmin();
  // 어느 문서에서 막혔는지 알 수 있어야 한다. 뭉뚱그린 실패는 원인을 못 찾는다.
  const job=(name, p)=>jobs.push(p.catch(e=>{
    console.warn('[쓰기 막힘] '+name+' — '+((e&&e.code)||e)); throw e; }));
  // 있으면 좋고 없어도 되는 것. 이게 실패한다고 계정 만들기가 통째로 되돌아가면 안 된다.
  // 실제로 그랬다 — 규칙에 meta 가 없던 서버에서 계정이 만들어지자마자 지워졌다.
  const jobOptional=(name, p)=>jobs.push(p.catch(e=>{
    console.warn('[건너뜀] '+name+' — '+((e&&e.code)||e)+' (없어도 됩니다)'); }));

  if(booting || got.shared){ mine.shared=t; job('shared', refShared().set(Object.assign(pickShared(), stamp))); }
  if(booting || (admin && got.roster)){  mine.roster=t;  job('roster',  refRoster().set(Object.assign(pickRoster(), stamp)));
    // 문 앞 표지판 — 사람이 있는지만 적는다. 이름도 번호도 담지 않는다.
    jobOptional('meta', refMeta().set({ hasClinic: (DB.staff||[]).length>0, updatedAt:t }));
    // 계량기 — 몇 명인지만. merge 로 적어야 나중에 붙을 칸을 지우지 않는다.
    jobOptional('usage', refUsage().set({
      staffCount: (DB.staff||[]).filter(s=>s.active!==false).length, updatedAt:t }, {merge:true})); }
  if(booting || (admin && got.secrets)){ mine.secrets=t; job('secrets', refSecrets().set(Object.assign(pickSecrets(), stamp))); }

  if(admin){
    if(booting || got.people){ mine.people=t; personIds().forEach(sid=>
      job('people/'+sid, refPeople(sid).set(Object.assign(pickPerson(sid), stamp)))); }
  }else if(myClaim && myClaim.staffId && got.people){
    mine.people=t;
    job('people/'+myClaim.staffId, refPeople(myClaim.staffId).set(Object.assign(pickPerson(myClaim.staffId), stamp)));
  }
  if(!jobs.length) return Promise.resolve();
  return Promise.all(jobs).catch(()=>updateSyncBadge('offline'));
}
function cloudPushNow(){
  if(!fdb || applyingRemote) return;
  clearTimeout(pushTimer);
  writeAll();
}
function cloudPush(force){
  if(applyingRemote || !fdb) return;
  if(!cloudReady && !force) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{
    if(DB.invLogs && DB.invLogs.length>800) DB.invLogs=DB.invLogs.slice(0,800);
    writeAll();
  }, 450);
}

/* ========================================================================
   권한(역할) / 직원 승인
   - 관리자: 전부. 직원(담당자): 재고·출퇴근·연월차 신청까지만.
   - 관리자 PIN으로 전환. 직원은 최초 '사용 요청' → 관리자 승인 후 사용.
   - (참고) 화면 단에서 숨기는 방식 — 신뢰하는 병원 직원 사이용.
   ======================================================================== */
function normPhone(s){ return String(s||'').replace(/\D/g,''); }
function sessionId(){ return localStorage.getItem('hosp_uid')||''; }
function setSession(id){ id? localStorage.setItem('hosp_uid',id) : localStorage.removeItem('hosp_uid'); }
function currentUser(){ const id=sessionId(); return id? DB.staff.find(s=>s.id===id && s.active!==false) : null; }
// 권한 3단계 — 오너(최고관리자) · 인사담당자 · 직원
// 예전 데이터의 '관리자'가 곧 오너다. 값을 그대로 둬서 로그인이 끊기지 않는다.
const ROLE_OWNER='관리자', ROLE_HR='인사담당자', ROLE_STAFF='직원';
const ROLE_KO={[ROLE_OWNER]:'최고관리자', [ROLE_HR]:'인사담당자', [ROLE_STAFF]:'직원'};
function hasAdmin(){ return DB.staff.some(s=>s.role===ROLE_OWNER && s.active!==false); }
function isOwner(){ const u=currentUser(); return !!u && u.role===ROLE_OWNER; }
// 인사담당자는 직원·출퇴근·연월차·노무를 본다. 재고 삭제나 권한 변경은 오너만.
function isHR(){ const u=currentUser(); return !!u && (u.role===ROLE_OWNER || u.role===ROLE_HR); }
function isAdmin(){ return isHR(); }
let gateState=null;
function applyRole(){
  ensureSchema();
  // 이 기기에 남은 기록이 아니라 서버가 인정했는지로 문을 연다.
  // 예전에는 브라우저에 옛 자료가 있으면 승인 없이도 화면이 열렸다 —
  // 서버에서는 아무것도 못 받는데 들어간 것처럼 보였다.
  if(fdb && claimResolved && !(myClaim && myClaim.approved)){
    document.body.setAttribute('data-role','staff');
    if(myClaim && !myClaim.approved){ wantSetup=false; wantOwner=false; setGate('waiting'); return; }
    if(wantOwner){ setGate('owner'); return; }
    if(wantSetup){ setGate('setup'); return; }
    setGate('login'); return;
  }
  const u=currentUser();
  if(!u){
    document.body.setAttribute('data-role','staff');
    // 승인을 기다리는 중이면 로그인 화면으로 되돌리지 않는다
    if(myClaim && !myClaim.approved){ wantSetup=false; wantOwner=false; setGate('waiting'); return; }
    if(wantOwner){ setGate('owner'); return; }
    if(wantSetup){ setGate('setup'); return; }
    // 공유 모드에서는 명단을 못 읽는 게 정상이다(승인 전이라 서버가 막는다).
    // 그걸 '첫 사용' 으로 착각하면 직원에게 원장 계정을 만들라고 권하게 된다.
    setGate((fdb || hasAdmin()) ? 'login' : 'setup'); return;
  }
  const owner = u.role===ROLE_OWNER, admin = owner || u.role===ROLE_HR;
  document.body.setAttribute('data-role', owner?'owner':(admin?'hr':'staff'));
  const rt=$('#roleTag'); if(rt){ rt.textContent = owner?'👑 최고관리자':(admin?'📋 인사담당자':'👤 직원');

async function sha256Hex(str){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// 이 기기가 누구 것인지 문서로 못 박는다. 관리자는 스스로 열고, 직원은 승인을 받는다.
function claimDevice(u, approved){
  if(!fdb || !myUid) return Promise.resolve();
  return refClaims().doc(myUid).set({
    staffId:u.id, name:u.name, phone:normPhone(u.phone), role:u.role||ROLE_STAFF,
    approved:!!approved, at:now(), device:(navigator.userAgent||'').slice(0,120)
  });   // 실패를 삼키지 않는다. 왜 못 들어가는지 사용자가 알아야 한다.
}
async function doLogin(){
  const ph=normPhone($('#lgPhone').value), pin=($('#lgPin').value||'').trim();
  if(!ph||!pin){ toast('전화번호와 PIN을 입력하세요'); return; }

  // 이 기기가 명단을 볼 수 있으면(관리자이거나 아직 규칙 전이면) 바로 확인한다
  const u=(DB.staff||[]).find(s=>normPhone(s.phone)===ph && String(s.pin||'')===pin && s.active!==false);
  if(u){
    const admin = u.role===ROLE_OWNER || u.role===ROLE_HR;
    setSession(u.id);
    try{
      await claimDevice(u, admin);            // 관리자 기기는 스스로 열린다
    }catch(e){
      setSession('');
      if(admin){
        // 이미 병원이 열려 있으면 관리자라도 스스로 열 수 없다. 다른 관리자 기기가 승인해야 한다.
        try{
          await refClaims().doc(myUid).set({ phone:ph, pinHash:await sha256Hex(pin+'|'+ph),
            approved:false, at:now(), device:(navigator.userAgent||'').slice(0,120) });
          setGate('waiting');
          toast('이 기기는 아직 등록 전이에요 — 다른 관리자 기기에서 승인해 주세요');
        }catch(e2){ toast('서버가 막았어요. 규칙이 걸린 뒤 처음이면 관리자에게 승인을 받아야 해요'); }
      }else{
        toast('서버가 막았어요 — 관리자에게 문의하세요');
      }
      return;
    }
    if(!admin && fdb){ setGate('waiting'); toast('사용 요청을 보냈어요 — 관리자 승인을 기다려주세요'); return; }
    applyRole(); go('home'); toast(`${u.name}님 환영합니다`);
    return;
  }
  if(!fdb){ toast('전화번호 또는 PIN이 맞지 않아요'); return; }

  // 명단이 안 보이는 기기 — 맞는지 여기서 알 수 없으니 신청만 남기고 관리자가 대조한다
  if(!myUid){ toast('연결 중이에요. 잠시 뒤 다시 눌러주세요'); return; }

  // 아직 아무도 없는 병원이면 신청서를 받아줄 사람이 없다. 막다른 길로 보내지 않는다.
  try{
    const m=await refMeta().get();
    const empty = !m.exists || (m.data()||{}).hasClinic !== true;
    if(empty){
      wantSetup=true; setGate(null); setGate('setup');
      toast('아직 아무도 없는 병원이에요 — 먼저 관리자를 만들어 주세요');
      return;
    }
  }catch(e){ /* 못 읽으면 정상(승인 전) — 그대로 신청으로 간다 */ }

  const h=await sha256Hex(pin+'|'+ph);
  try{
    await refClaims().doc(myUid).set({ phone:ph, pinHash:h, approved:false, at:now(),
      device:(navigator.userAgent||'').slice(0,120) });
    setGate('waiting'); toast('사용 요청을 보냈어요 — 관리자 승인을 기다려주세요');
  }catch(e){ toast('요청을 보내지 못했어요. 잠시 뒤 다시 해주세요'); }
}

    .then(()=>fdb && owId ? setOwnerKey(owId, owPw, u.id).catch(e=>{
        console.warn('[아이디·비밀번호 저장 실패]', (e&&e.code)||e);
        toast('계정은 만들어졌지만 아이디·비밀번호는 저장 못 했어요 — 설정에서 다시 정해주세요');
      }) : null)
    .then(codes=>{ booting=false; if(codes && codes.length) showRecoveryCodes(codes); })
    .catch(err=>{                                 // 이미 열려 있거나, 아직 개통 승인을 못 받았다
      console.error('[개설 실패]', err && (err.code||err.message||err));
      booting=false;
      DB.staff=DB.staff.filter(x=>x.id!==u.id); setSession(''); saveDB();
      if(fdb&&myUid) refClaims().doc(myUid).delete().catch(()=>{});
      setGate(null); setGate('login');
      explainSetupFail(name);
    });
  applyRole(); go('home'); toast('관리자 계정을 만들었어요');
}
/* 개설이 막히는 이유가 둘인데 지금까지 하나로만 말했다.
   이미 열린 병원이라 막힌 것과, 아직 개통 승인을 못 받아 막힌 것은 할 일이 다르다. */
async function explainSetupFail(hospName){
  let need=false, approved=true;
  try{
    const c=await fdb.collection('config').doc('main').get();
    need = !!(c.exists && (c.data()||{}).requireApproval===true);
    if(need){
      const h=await fdb.collection('hospitals').doc(WS()).get();
      approved = !!(h.exists && (h.data()||{}).approved===true);
    }
  }catch(e){}
  if(need && !approved){
    modal(`<h3>🏥 아직 개통 전이에요</h3>
      <div class="hint">이 주소(<code>${esc(WS())}</code>)는 아직 열려 있지 않아요. 만든 곳이 열어줘야 씁니다.<br>
        아래로 <b>개설 신청</b>을 남기면 연락이 갑니다.</div>
      <label class="field" style="margin-top:12px"><span>병원 이름</span>
        <input id="rqName" value="${esc(hospName||DB.hospName||'')}" maxlength="60"></label>
      <label class="field"><span>연락처 (전화 또는 카톡 아이디)</span>
        <input id="rqContact" placeholder="01012345678" maxlength="60"></label>
      <button class="btn block" onclick="sendOpenRequest()">개설 신청하기</button>
      <div class="tiny muted" style="margin-top:10px">신청에는 <b>이름과 연락처만</b> 담깁니다.</div>`);
    return;
  }
  toast('이미 열려 있는 병원이에요 — 로그인한 뒤 다른 관리자 기기에서 승인받으세요');
}
async function sendOpenRequest(){
  const name=(($('#rqName')||{}).value||'').trim(), contact=(($('#rqContact')||{}).value||'').trim();
  if(!name||!contact){ toast('병원 이름과 연락처를 넣어주세요'); return; }
  try{
    await fdb.collection('hospreq').doc(WS()).set({ name, contact, at: now() });
    closeModal(); toast('신청했어요 — 열리면 연락드립니다');
  }catch(e){ toast('신청하지 못했어요 — '+((e&&e.code)||e)); }
}
function logout(){ if(!confirm('로그아웃할까요?')) return; setSession(''); closeModal(); applyRole(); toast('로그아웃되었습니다'); }
function changeMyPin(){
  if(!currentUser()) return;
  modal(`<h3>🔒 내 PIN 변경</h3>
    <label class="field"><span>새 PIN (숫자 4자리 이상)</span><input id="mp1" class="pinbox" inputmode="numeric" maxlength="8" type="password" placeholder="••••"></label>
    <label class="field"><span>한 번 더</span><input id="mp2" class="pinbox" inputmode="numeric" maxlength="8" type="password" placeholder="••••"></label>
    <button class="btn block" onclick="saveMyPin()">저장</button>`);
}
function saveMyPin(){
  const a=($('#mp1').value||'').trim(), b=($('#mp2').value||'').trim();
  if(!/^\d{4,8}$/.test(a)){ toast('숫자 4~8자리로 정해주세요'); return; }
  if(a!==b){ toast('두 번 입력이 달라요'); return; }
  currentUser().pin=a; saveDB(); closeModal(); toast('PIN을 변경했어요');
}

/* ========================================================================
   공용 기기 출근 키오스크 (로그인 없이 이름+PIN으로 출퇴근 체크)
   ======================================================================== */
let kioskOn=false, kSel=null, kPin='', kClockTimer=null;
function enterKiosk(){
  kioskOn=true; kSel=null; kPin='';
  try{ if(location.hash!=='#kiosk') history.replaceState(null,'','#kiosk'); }catch(e){}
  closeModal();
  $('#kHosp').textContent = DB.hospName || '출근 체크';
  $('#kiosk').classList.add('show'); document.body.style.overflow='hidden';
  startKClock(); renderKiosk();
}
function exitKiosk(){
  if(hasAdmin()){
    const pin = prompt('관리자 PIN을 입력하면 출근 화면에서 나갑니다.');
    if(pin===null) return;
    const ok = DB.staff.some(s=>s.role==='관리자' && s.active!==false && String(s.pin||'')===String(pin).trim());
    if(!ok){ toast('관리자 PIN이 맞지 않아요'); return; }
  }
  kioskOn=false; stopKClock();
  $('#kiosk').classList.remove('show'); document.body.style.overflow='';
  try{ history.replaceState(null,'', location.pathname+location.search); }catch(e){}
}
function startKClock(){ stopKClock();
  const upd=()=>{ const n=new Date();
    const c=$('#kClock'); if(c) c.textContent=pad(n.getHours())+':'+pad(n.getMinutes());
    const d=$('#kDate'); if(d) d.textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'}); };
  upd(); kClockTimer=setInterval(upd,15000);
}
function stopKClock(){ if(kClockTimer){ clearInterval(kClockTimer); kClockTimer=null; } }
function renderKiosk(){
  kSel=null; kPin='';
  const tk=todayKey();
  const staff=DB.staff.filter(s=>s.active!==false);
  if(!staff.length){ $('#kBody').innerHTML=`<div style="opacity:.85;text-align:center;padding:40px 10px;line-height:1.7">등록된 직원이 없어요.<br>관리자 앱의 <b>직원 탭</b>에서 먼저 등록하세요.</div>`; return; }
  const cards=staff.map(s=>{
    const a=DB.attendance.find(x=>x.staffId===s.id && x.date===tk);
    let cls='', stat, hint;
    if(a&&a.inAt&&a.outAt){ cls='kdone'; stat=`<span class="pill info">퇴근 ${fmtTime(a.outAt)}</span>`; hint='오늘 근무 완료'; }
    else if(a&&a.inAt){ cls='inwork'; stat=`<span class="pill ok">근무중 ${fmtTime(a.inAt)}~</span>`; hint='👉 눌러서 퇴근'; }
    else { stat=`<span class="pill warn">미출근</span>`; hint='👉 눌러서 출근'; }
    return `<button class="kcard ${cls}" onclick="kioskPick('${s.id}')">
      <div class="kn">${esc(s.name)}</div><div class="kd">${esc(s.dept||'')||'&nbsp;'}</div>
      <div class="kstat">${stat}</div><div class="kd" style="margin-top:7px">${hint}</div></button>`;
  }).join('');
  $('#kBody').innerHTML=`<div class="kgrid">${cards}</div>`;
}
function kioskPick(id){
  const s=staffById(id); if(!s) return;
  const tk=todayKey();
  const a=DB.attendance.find(x=>x.staffId===s.id && x.date===tk);
  if(a&&a.inAt&&a.outAt){ toast(`${s.name}님은 오늘 근무 완료예요`); return; }
  if(!s.pin){ kioskCommit(id); return; }   // PIN 미설정 직원은 바로 처리
  kSel=id; kPin=''; renderKpin();
}
function renderKpin(){
  const s=staffById(kSel); if(!s) return;
  const tk=todayKey();
  const a=DB.attendance.find(x=>x.staffId===s.id && x.date===tk);
  const action=(a&&a.inAt&&!a.outAt)?'퇴근':'출근';
  const dotN=Math.max(4,kPin.length);
  const dots=Array.from({length:dotN},(_,i)=>`<span class="kdot ${i<kPin.length?'on':''}"></span>`).join('');
  $('#kBody').innerHTML=`<div class="kpin">
    <div class="who">${esc(s.name)}</div>
    <div class="act">${action} · 개인 PIN 입력</div>
    <div class="kdots">${dots}</div>
    <div class="kpad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="kkey" onclick="kKey('${n}')">${n}</button>`).join('')}
      <button class="kkey mini" onclick="kBack()">지움</button>
      <button class="kkey" onclick="kKey('0')">0</button>
      <button class="kkey mini" onclick="renderKiosk()">취소</button>
    </div></div>`;
}
function kKey(d){ const s=staffById(kSel); if(!s) return; if(kPin.length>=8) return;
  kPin+=d; renderKpin();
  if(kPin.length===String(s.pin).length) setTimeout(kVerify,140);
}
function kBack(){ kPin=kPin.slice(0,-1); renderKpin(); }
function kVerify(){ const s=staffById(kSel); if(!s) return;
  if(String(kPin)!==String(s.pin)){ toast('PIN이 맞지 않아요'); kPin=''; renderKpin(); return; }
  kioskCommit(kSel);
}
function kioskCommit(id){
  const s=staffById(id); const tk=todayKey();
  let a=DB.attendance.find(x=>x.staffId===id && x.date===tk); let msg;
  if(!a || !a.inAt){ a=getAtt(id,tk,true); a.inAt=stampFor(tk); msg=`${s.name}님 출근 · ${fmtTime(a.inAt)}`; }
  else if(!a.outAt){ a.outAt=stampFor(tk); msg=`${s.name}님 퇴근 · ${fmtHours(hoursBetween(a.inAt,a.outAt))} 근무`; }
  else { toast(`${s.name}님은 오늘 근무 완료예요`); renderKiosk(); return; }
  saveDB();
  try{ renderHome(); if(currentTab==='att') renderAtt(); }catch(e){}
  kSel=null; kPin='';
  $('#kBody').innerHTML=`<div class="kpin" style="padding-top:30px">
    <div style="font-size:60px">✅</div>
    <div class="who" style="margin-top:10px">${esc(msg)}</div>
    <div class="act" style="margin-top:10px">잠시 후 명단으로 돌아갑니다</div></div>`;
  setTimeout(()=>{ if(kioskOn) renderKiosk(); },1700);
}

/* ---------- 시작 ---------- */
/* 카톡·인스타 같은 앱 안에서 링크를 누르면 그 앱 전용 브라우저가 열린다.
   그 브라우저는 사파리·크롬과 저장 공간이 따로라, 거기서 기기를 승인받아도
   나중에 사파리로 들어오면 승인이 안 된 기기가 된다. 직원은 "왜 자꾸 승인하래요"
   가 되고, 홈 화면에 추가도 안 된다. 그래서 들어오자마자 알려주고 내보낸다. */
const IN_APP_BROWSER = /KAKAOTALK|FBAN|FBAV|FB_IAB|Instagram|Line\/|NAVER\(inapp|DaumApps|everytimeApp|kakaostory/i
  .test(navigator.userAgent || '');
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');

function showInAppBrowserBar(){
  if(!IN_APP_BROWSER) return;
  const bar = $('#iabBar'); if(!bar) return;
  const 안내 = IS_IOS
    ? '아래쪽 <b>공유 버튼(↑)</b> 또는 <b>⋯</b> 을 누르고 <b>Safari로 열기</b> 를 눌러주세요.'
    : '오른쪽 아래 <b>⋮</b> 를 누르고 <b>다른 브라우저로 열기</b> 를 눌러주세요.';
  bar.innerHTML =
    `지금 <b>다른 앱 안의 창</b>으로 열렸어요. 이대로 쓰면 <b>다음에 또 승인을 받아야 합니다.</b><br>${안내}
     <div class="row">
       <button onclick="openInRealBrowser()">브라우저로 열기</button>
       <button onclick="copyAppLink()">주소 복사</button>
     </div>`;
  bar.classList.add('show');
}
function openInRealBrowser(){
  // 카톡 안드로이드는 이 주소를 알아듣고 기본 브라우저를 연다. 아이폰은 방법이 없어서
  // 주소만 복사해 주고, 사파리에 직접 붙여넣게 한다.
  if(!IS_IOS){ location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return; }
  copyAppLink();
  alert('주소를 복사했어요.\n\nSafari 를 열고 주소창에 붙여넣어 주세요.');
}
// 데스크 태블릿에 띄울 주소. '#kiosk 를 붙이세요' 라고 적어두면 아무도 안 붙인다.
function copyKioskLink(){
  const url = location.origin + location.pathname
            + (WS_ID==='clinic' ? '' : '?h='+encodeURIComponent(WS_ID)) + '#kiosk';
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>toast('복사했어요 — 공용 기기에 붙여넣고 북마크하세요'),
          ()=>prompt('이 주소를 공용 기기에 붙여넣으세요', url));
}
function copyAppLink(){
  const url = location.href;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>toast('주소를 복사했어요'), ()=>prompt('이 주소를 복사해 주세요', url));
}

function boot(){
  loadDB();
  $('#hospName').textContent = DB.hospName || '우리병원 관리';
  $('#todayStr').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  $('#attDate').value = todayKey();
  renderHome();
  applyRole();
  showInAppBrowserBar();
  cloudInit();
  if(location.hash==='#kiosk') enterKiosk();   // 공용 기기: 바로 출근 화면
  // PWA: 오프라인/홈화면 설치 지원 (http/https로 열었을 때만)
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
