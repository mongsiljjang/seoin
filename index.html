<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#10213b" />
<title>병원 관리 · 재고 / 출퇴근 / 연월차</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="병원관리" />
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#17202a; --sub:#68727d;
    --line:#e6eaf0; --brand:#175cd3; --brand-2:#2f7ae5; --brand-soft:#e8f0ff;
    --ok:#138a5b; --ok-soft:#e5f5ee; --warn:#c77800; --warn-soft:#fdf1db;
    --danger:#c03434; --danger-soft:#fbe9e9; --pend:#6b46c1; --pend-soft:#efeafc;
    --hdr1:#10213b; --hdr2:#1d4f99;
    --shadow:0 8px 30px rgba(20,31,45,.07);
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    word-break:keep-all; overflow-wrap:anywhere;   /* 한국어는 어절 단위로 끊어야 읽힌다 */
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 14px}

  /* Header */
  header.app{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--hdr1),var(--hdr2));
    color:#fff; padding:14px 0 12px;
    box-shadow:0 2px 12px rgba(8,60,74,.18);
  }
  header.app .wrap{display:flex; align-items:center; gap:8px}
  header.app .wrap > div{min-width:0}
  .logo{font-size:22px; flex:none}
  header.app h1{font-size:17px; margin:0; font-weight:800; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header.app .sub{font-size:11.5px; opacity:.9; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hbtn{margin-left:auto; background:rgba(255,255,255,.18); border:0; color:#fff;
    font-size:12px; font-weight:700; padding:8px 12px; border-radius:999px; cursor:pointer}

  main{padding-top:14px}
  .page{display:none; animation:fade .18s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2.sec{font-size:14px; color:var(--sub); font-weight:800; margin:18px 2px 8px;
    letter-spacing:.2px; text-transform:none}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:13px}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:0; border-radius:12px; font-weight:800; font-size:14px; padding:12px 14px;
    cursor:pointer; background:var(--brand); color:#fff; transition:transform .05s}
  .btn:active{transform:scale(.97)}
  .btn.block{width:100%}
  .btn.ghost{background:var(--brand-soft); color:var(--brand)}
  .btn.soft{background:#eef4f6; color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.warn{background:var(--warn)}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:8px 11px; font-size:13px; border-radius:10px}
  .btn.xs{padding:6px 9px; font-size:12px; border-radius:9px; font-weight:700}

  .row{display:flex; gap:8px; align-items:center}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .grow{flex:1}
  .muted{color:var(--sub)}
  .tiny{font-size:12px}
  .big{font-size:26px; font-weight:900; letter-spacing:-1px}

  /* Inputs */
  label.field{display:block; margin-bottom:10px}
  label.field > span{display:block; font-size:12.5px; color:var(--sub); font-weight:700; margin-bottom:5px}
  input,select,textarea{
    width:100%; font-size:16px; padding:12px; border:1.5px solid var(--line);
    border-radius:11px; background:#fbfdfe; color:var(--ink); font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand)}
  textarea{min-height:64px; resize:vertical}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

  /* Pills / badges */
  .pill{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800;
    padding:4px 9px; border-radius:999px; white-space:nowrap}
  .pill.ok{background:var(--ok-soft); color:var(--ok)}
  .pill.warn{background:var(--warn-soft); color:var(--warn)}
  .pill.danger{background:var(--danger-soft); color:var(--danger)}
  .pill.pend{background:var(--pend-soft); color:var(--pend)}
  .pill.info{background:var(--brand-soft); color:var(--brand)}
  .pill.grey{background:#eef2f4; color:var(--sub)}

  /* List items */
  .item{display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .avatar{width:40px; height:40px; border-radius:12px; flex:none; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:15px; background:var(--brand-soft); color:var(--brand)}
  .item .t{font-weight:800; font-size:15px}
  .item .d{font-size:12.5px; color:var(--sub); margin-top:1px}

  .empty{text-align:center; color:var(--sub); padding:28px 10px; font-size:14px}
  .empty .ic{font-size:34px; display:block; margin-bottom:8px; opacity:.5}

  /* stat grid */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 15px; box-shadow:var(--shadow)}
  .stat .n{font-size:24px; font-weight:900; letter-spacing:-1px}
  .stat .l{font-size:12px; color:var(--sub); font-weight:700; margin-top:2px}
  .stat.tap{cursor:pointer}

  /* 홈 히어로(오늘 처리할 일) */
  .hero{background:linear-gradient(135deg,var(--hdr1),var(--hdr2)); color:#fff; border:0;
    box-shadow:0 12px 30px rgba(16,33,59,.28); border-radius:22px; padding:18px}
  .hero .htop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .hero .hlabel{font-size:12.5px; font-weight:800; opacity:.9}
  .hero .hval{font-size:34px; font-weight:900; letter-spacing:-1.5px; margin:5px 0 0}
  .hero .hbtn2{background:rgba(255,255,255,.2); border:0; color:#fff; font-weight:800; font-size:12.5px;
    padding:8px 13px; border-radius:999px; cursor:pointer; flex:none; white-space:nowrap}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:15px}
  .grid4 .g{background:rgba(255,255,255,.13); border-radius:14px; padding:11px 6px; text-align:center; cursor:pointer}
  .grid4 .g .gn{font-size:21px; font-weight:900; letter-spacing:-.5px}
  .grid4 .g .gl{font-size:10.5px; opacity:.88; margin-top:3px; font-weight:700}

  /* segmented control */
  .seg{display:flex; background:#eaf1f3; border-radius:12px; padding:4px; gap:4px; margin-bottom:12px}
  .seg button{flex:1; border:0; background:transparent; font-weight:800; font-size:13px; color:var(--sub);
    padding:9px 4px; border-radius:9px; cursor:pointer}
  .seg button.on{background:#fff; color:var(--brand); box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* 치식도 — 16개가 한 줄에 들어가야 해서 칸을 최대한 좁게 */
  .teeth{display:grid; grid-template-columns:repeat(16,1fr); gap:2px}
  .teeth button{padding:7px 0; font-size:10px; font-weight:800; color:var(--sub);
    border:1px solid var(--line); background:var(--card); border-radius:5px; cursor:pointer}
  .teeth button.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .teeth button:nth-child(8){margin-right:6px}
  .archl{font-size:10.5px; color:var(--muted); font-weight:700; margin:8px 2px 3px}
  .trow{display:flex; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:0}
  .tno{font-weight:900; font-size:14px; min-width:30px}

  /* 재고 한 줄 목록 — 카드 대신 줄로 쌓아 세로 길이를 줄인다 */
  .irow{display:flex; align-items:center; gap:11px; padding:13px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; margin-bottom:7px; cursor:pointer}
  .irow:active{background:#f2f6f8}
  .irow .dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px}
  .irow .nm{font-weight:800; font-size:15px; line-height:1.32}
  .irow .qty{font-weight:800; font-size:19px; white-space:nowrap; text-align:right}
  .irow .qty u{font-size:11.5px; font-weight:700; color:var(--muted); margin-left:2px; text-decoration:none}
  .irow .chev{color:var(--muted); font-size:17px; margin-left:-2px}
  .cntrow{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line)}
  .cntrow:last-child{border-bottom:0}
  .cntrow input{width:74px; text-align:center; font-weight:800; padding:9px 6px}

  /* search */
  .search{position:relative; margin-bottom:10px}
  .search input{padding-left:38px}
  .search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5}

  /* Bottom nav */
  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff;
    border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(16,60,74,.06)}
  nav.tabs button{flex:1; border:0; background:transparent; color:var(--sub); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 2px; font-weight:700}
  nav.tabs button .i{font-size:21px; line-height:1}
  nav.tabs button .x{font-size:10.5px}
  nav.tabs button.on{color:var(--brand)}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(16,40,50,.45); z-index:50; display:none;
    align-items:flex-end; justify-content:center}
  .modal-bg.open{display:flex; animation:fade .15s}
  .modal{background:#fff; width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:18px 16px 22px;
    max-height:92vh; overflow:auto; animation:slideup .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal h3{margin:0 0 14px; font-size:17px; font-weight:900}
  .lawcite{display:inline-block; margin-top:4px; font-size:11.5px; font-weight:700; color:var(--sub); opacity:.9}
  .dchip{display:inline-flex; align-items:center; gap:5px; background:#eef4f5; border:1px solid var(--line);
    border-radius:999px; padding:5px 11px 5px 8px; font-size:12.5px; font-weight:700; color:var(--sub); cursor:pointer}
  .dchip input{width:auto; margin:0; flex:none}
  .dchip:has(input:checked){background:var(--brand-soft); border-color:var(--brand); color:var(--brand)}
  /* 설정처럼 설명이 긴 화면 — 제목 옆 ⓘ 에 설명을 접어 넣는다.
     PC 는 마우스를 올리면 뜨고, 폰은 커서가 없으니 눌러야 뜬다.
     둘 다 되게 hover 와 focus 를 함께 건다. */
  .sechead{display:flex; align-items:center; gap:6px; position:relative;
    margin:0 2px 8px; font-size:12.5px; font-weight:800; color:var(--sub)}
  .tip{display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:19px; height:19px; border-radius:999px; background:#dbe4e8; color:var(--ink);
    font-size:11.5px; font-weight:900; cursor:pointer; user-select:none}
  .tip:hover, .tip:focus, .tip.on{background:var(--brand); color:#fff; outline:none}
  .tipbox{display:none; position:absolute; left:0; right:0; top:calc(100% + 7px); z-index:6;
    background:#12303a; color:#fff; font-size:12.5px; font-weight:500; line-height:1.75;
    padding:12px 14px; border-radius:12px; word-break:keep-all; text-align:left;
    box-shadow:0 8px 24px rgba(0,0,0,.3); cursor:auto}
  .tipbox b{color:#ffe8a8}
  .tipbox .lawcite{color:#b9ccd3; opacity:1}
  .tip:hover .tipbox, .tip:focus .tipbox, .tip.on .tipbox{display:block}
  .setrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .setrow .btn{flex:1 1 auto; min-width:132px}
  .setrow select{flex:1 1 132px; width:auto; min-width:120px}
  .setnote{font-size:11.5px; font-weight:700; color:var(--sub); margin:7px 2px 0; word-break:keep-all}

  .mback{display:inline-flex; align-items:center; border:0; background:#eaf1f3; color:var(--sub);
    font-size:12.5px; font-weight:800; padding:6px 12px 6px 9px; border-radius:999px; cursor:pointer; margin-bottom:11px}
  .mback:active{background:#dde8ea}
  .modal .close{position:absolute}
  .grabber{width:38px; height:4px; border-radius:9px; background:#d5e0e4; margin:0 auto 14px}

  .toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#12303a; color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:999px;
    z-index:80; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

  .divider{height:1px; background:var(--line); margin:12px 0}
  .hint{font-size:12px; color:var(--sub); background:var(--brand-soft); border-radius:10px; padding:9px 11px; margin-bottom:10px}

  /* 역할(권한) — 직원 모드에서는 관리자 전용 요소 숨김 */
  body[data-role="staff"] .admin-only{ display:none !important; }
  /* 권한 변경·PIN 재설정·직원 삭제처럼 오너만 만지는 것 */
  body:not([data-role="owner"]) .owner-only{ display:none !important; }
  /* 노무(공지 관리·계약서·급여·사직서 처리)는 오너와 인사담당자 */
  body[data-role="staff"] .hr-only{ display:none !important; }
  .roletag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;white-space:nowrap;flex:none;cursor:pointer}
  #syncBadge{flex:none}
  .abadge{position:absolute; top:0; right:0; min-width:17px; height:17px; padding:0 4px; border-radius:999px;
    background:#e5484d; color:#fff; font-size:10px; font-weight:900; display:none; align-items:center; justify-content:center; line-height:1}
  /* 잠금 화면(참여/승인대기/거절) */
  #gate{position:fixed; inset:0; z-index:70; background:var(--bg); overflow:auto; display:none}
  #gate.show{display:block}
  .gatewrap{max-width:460px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
    justify-content:center; padding:32px 22px; text-align:center}
  .gate-ic{font-size:52px; margin-bottom:14px}
  .gate-h{font-size:21px; font-weight:900; margin-bottom:8px; color:var(--ink)}
  .gate-p{font-size:14px; color:var(--sub); margin-bottom:22px; line-height:1.6}
  .gate-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); text-align:left}
  .pinbox{letter-spacing:8px; text-align:center; font-size:24px; font-weight:800}
  #adminBanner{background:var(--warn-soft); color:var(--warn); font-size:12.5px; font-weight:700;
    padding:9px 14px; text-align:center; cursor:pointer; display:none}
  #adminBanner.show{display:block}
  #iabBar{background:#fff4e5; color:#8a5200; border-bottom:1px solid #f0d9b5;
    padding:11px 14px; font-size:13px; line-height:1.65; display:none}
  #iabBar.show{display:block}
  #iabBar b{color:#7a4600}
  #iabBar .row{display:flex; gap:7px; margin-top:8px; flex-wrap:wrap}
  #iabBar button{border:1px solid #e0c493; background:#fff; color:#7a4600;
    border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:800;
    font-family:inherit; cursor:pointer}

  /* 출근 키오스크(공용 기기 모드) */
  #kiosk{position:fixed; inset:0; z-index:75; background:linear-gradient(160deg,var(--hdr1),#0a1626);
    color:#fff; display:none; overflow:auto}
  #kiosk.show{display:block}
  .kwrap{max-width:600px; margin:0 auto; min-height:100dvh; padding:24px 18px 30px; display:flex; flex-direction:column}
  .khead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .khosp{font-size:23px; font-weight:900; letter-spacing:-.5px}
  .ksub{font-size:13px; opacity:.8; margin-top:2px}
  .kclock{font-size:30px; font-weight:900; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1}
  .kdate{font-size:12px; opacity:.75; text-align:right; margin-top:4px}
  .kgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px}
  .kcard{background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.16); border-radius:18px;
    padding:15px 14px; cursor:pointer; text-align:left; color:#fff; font-family:inherit; transition:transform .05s}
  .kcard:active{transform:scale(.98)}
  .kcard .kn{font-size:19px; font-weight:900}
  .kcard .kd{font-size:12px; opacity:.8; margin-top:2px}
  .kcard .kstat{margin-top:9px}
  .kcard.inwork{background:rgba(19,138,91,.3); border-color:rgba(120,230,180,.45)}
  .kcard.kdone{opacity:.62}
  .kexit{margin-top:22px; align-self:center; background:rgba(255,255,255,.12); color:#fff; border:0;
    border-radius:999px; padding:11px 22px; font-weight:800; font-size:13px; cursor:pointer}
  .kpin{max-width:360px; margin:8px auto 0; text-align:center}
  .kpin .who{font-size:24px; font-weight:900}
  .kpin .act{font-size:14px; opacity:.85; margin:4px 0 18px}
  .kdots{display:flex; gap:13px; justify-content:center; margin-bottom:22px; min-height:16px}
  .kdot{width:15px; height:15px; border-radius:999px; background:rgba(255,255,255,.28)}
  .kdot.on{background:#fff}
  .kpad{display:grid; grid-template-columns:repeat(3,1fr); gap:11px}
  .kkey{background:rgba(255,255,255,.12); border:0; color:#fff; font-size:24px; font-weight:800;
    padding:17px 0; border-radius:16px; cursor:pointer; font-family:inherit}
  .kkey:active{background:rgba(255,255,255,.28)}
  .kkey.mini{font-size:15px; font-weight:700}

  /* 임플란트 모듈 */
  .summary3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px}
  .summary3 .stat{padding:11px 12px}
  .chips{display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px}
  .chip{white-space:nowrap; border:1.5px solid var(--line); background:#fff; color:var(--sub);
    font-weight:800; font-size:13px; padding:8px 15px; border-radius:999px; cursor:pointer; flex:none}
  .chip.on{background:var(--brand); color:#fff; border-color:var(--brand)}
  table.mtx{border-collapse:separate; border-spacing:7px; width:100%}
  table.mtx th{font-size:11.5px; color:var(--sub); font-weight:800; padding:2px}
  table.mtx td.rowh{font-size:12.5px; font-weight:900; text-align:right; padding-right:4px; white-space:nowrap; color:var(--ink)}
  .mtx .cell{border-radius:13px; text-align:center; padding:12px 4px; font-weight:900; font-size:17px;
    border:1.5px solid transparent; cursor:pointer; min-width:48px; transition:transform .05s}
  .mtx .cell:active{transform:scale(.95)}
  .mtx .cell .u{display:block; font-size:9.5px; font-weight:700; opacity:.65; margin-top:1px}
  .mtx .cell.ok{background:var(--ok-soft); color:#0f7a4f; border-color:#cfeadd}
  .mtx .cell.low{background:var(--warn-soft); color:#9a6410; border-color:#f0d9a8}
  .mtx .cell.zero{background:var(--danger-soft); color:#a23a2a; border-color:#f0c9c0}
  .mtx .cell.empty{background:#f6f8fb; color:#aab3bf; font-weight:700}
  .legend2{display:flex; gap:14px; font-size:11.5px; color:var(--sub); font-weight:700; margin-top:8px}
  .legend2 i{width:11px; height:11px; border-radius:4px; display:inline-block; margin-right:4px; vertical-align:-1px}

<script>
/* ==========================================================================
   병원 관리 앱 — 재고 / 출퇴근 / 연월차 / 직원
   데이터는 이 기기의 브라우저(localStorage)에 저장됩니다.
   ========================================================================== */

/* 병원마다 다른 자리를 쓴다.
   예전에는 모든 병원이 'clinic' 한 자리를 같이 썼다. 병원이 둘이 되면 섞인다.
   주소 뒤에 ?h=코드 를 붙여 열면 그 병원이 되고, 한 번 열면 이 기기가 기억한다.
   아무것도 없으면 처음 만든 병원 그대로다 — 쓰던 사람이 갑자기 빈 앱을 보면 안 된다. */
const WS_ID = (function(){
  let ws='';
  try{
    const q=String(new URLSearchParams(location.search).get('h')||'').trim().toLowerCase();
    if(/^[a-z0-9-]{2,32}$/.test(q)){ ws=q; localStorage.setItem('hospital_ws', ws); }
  }catch(e){}
  if(!ws){ try{ ws=localStorage.getItem('hospital_ws')||''; }catch(e){} }
  return ws || (window.WORKSPACE_ID || 'clinic');
})();
const WS = ()=>WS_ID;
// 기기에 남기는 자리도 병원마다 갈라야 한다. 안 그러면 옆 병원 자료가 화면에 뜬다.
// 처음 병원은 예전 이름을 그대로 쓴다 — 이름을 바꾸면 쓰던 자료가 사라진다.
const STORE_KEY = 'hospital_mgr_v1' + (WS_ID==='clinic' ? '' : ':'+WS_ID);
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=> Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);

/* ---------- 저장소 ---------- */
let DB;
function loadDB(){
  try{ DB = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ DB=null; }
  if(!DB || !DB.version){
    DB = { version:1, hospName:'우리병원 관리',
      staff:[], inventory:[], invLogs:[], attendance:[], leaves:[] };
    seedDemo();
    saveDB();
  }
  ensureSchema();
}
function ensureSchema(){ if(!DB) return; if(!Array.isArray(DB.members)) DB.members=[];
  if(!DB.prefs || typeof DB.prefs!=='object') DB.prefs={};   // 계정별 개인 설정 (자주 쓰는 품목 순서 등)
  if(!Array.isArray(DB.implantCases)) DB.implantCases=[];    // 임플란트 대장 (수기 관리대장을 그대로 옮긴 것)
  ensureMasters();                                           // 재료 목록(제조사·브랜드·사이즈)
  if(typeof DB.adminPin!=='string') DB.adminPin='';
  if(!Array.isArray(DB.implants)) DB.implants=[];            // 예전 버전에서 올라온 데이터엔 없다
  if(!Array.isArray(DB.implantLogs)) DB.implantLogs=[];
  backfillAdj();                                             // 기록에 적으므로 implantLogs 다음이어야 한다
  // 노무 — 공지·근로계약서·급여명세서·사직서. 금액이 든 것은 enc 안에 잠겨 있다.
  if(!Array.isArray(DB.notices)) DB.notices=[];
  if(!Array.isArray(DB.contracts)) DB.contracts=[];
  if(!Array.isArray(DB.payslips)) DB.payslips=[];
  if(!Array.isArray(DB.resignations)) DB.resignations=[];
  if(!Array.isArray(DB.hrLogs)) DB.hrLogs=[];
  if(!Array.isArray(DB.duties)) DB.duties=[];        // 담당 분야 — 병원이 직접 만든다
  if(!Array.isArray(DB.vendors)) DB.vendors=[];      // 거래처 · 영업사원 연락처
  if(!DB.hosp || typeof DB.hosp!=='object') DB.hosp={headcount:null};   // 상시 근로자 수
  if(!Array.isArray(DB.docTypes)) DB.docTypes=[];    // 신청 유형 — 병원이 직접 늘린다
  if(!Array.isArray(DB.docForms)) DB.docForms=[];    // 양식 보관함
  if(!Array.isArray(DB.docReqs)) DB.docReqs=[];      // 낸 신청서
  if(DB.payLock && typeof DB.payLock!=='object') DB.payLock=null;
  if(!DB.geo || typeof DB.geo!=='object') DB.geo={on:false,lat:null,lng:null,radiusM:200};
  if(typeof DB.geo.radiusM!=='number') DB.geo.radiusM=200; }
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); cloudPush(); }

function seedDemo(){
  const s1=uid(), s2=uid(), s3=uid();
  DB.staff = [
    {id:s1, name:'김간호', dept:'간호부', position:'수간호사', joinDate:'2021-03-02', annualTotal:16, phone:'01011112222', pin:'1234', role:'관리자', active:true},
    {id:s2, name:'이원무', dept:'원무과', position:'주임', joinDate:'2022-07-11', annualTotal:15, phone:'01033334444', pin:'1234', role:'직원', active:true},
    {id:s3, name:'박물리', dept:'물리치료실', position:'치료사', joinDate:'2023-01-04', annualTotal:15, phone:'01055556666', pin:'1234', role:'직원', active:true},
  ];
  DB.inventory = [
    {id:uid(), name:'주사기 10cc', category:'소모품', unit:'개', qty:40, minQty:100, note:'', updatedAt:now()},
    {id:uid(), name:'멸균거즈', category:'소모품', unit:'팩', qty:22, minQty:20, note:'', updatedAt:now()},
    {id:uid(), name:'알콜솜', category:'소모품', unit:'통', qty:8, minQty:15, note:'', updatedAt:now()},
    {id:uid(), name:'라텍스 장갑(M)', category:'위생', unit:'박스', qty:12, minQty:10, note:'', updatedAt:now()},
    {id:uid(), name:'수액세트', category:'의약외품', unit:'개', qty:60, minQty:50, note:'', updatedAt:now()},
  ];
  DB.implants = [
    { id:uid(), brand:'오스템', line:'TS III', part:'픽스처', vendor:'A덴탈', price:180000, note:'',
      variants:[
        {id:uid(),label:'3.5×8.5',qty:8,minQty:3,lot:''},{id:uid(),label:'3.5×10',qty:2,minQty:3,lot:''},
        {id:uid(),label:'4.0×8.5',qty:12,minQty:3,lot:''},{id:uid(),label:'4.0×10',qty:3,minQty:3,lot:''},
        {id:uid(),label:'4.0×11.5',qty:7,minQty:3,lot:''},{id:uid(),label:'4.5×10',qty:0,minQty:3,lot:''},
        {id:uid(),label:'5.0×10',qty:5,minQty:3,lot:''},
      ]},
    { id:uid(), brand:'오스템', line:'힐링 어버트먼트', part:'힐링캡', vendor:'A덴탈', price:9000, note:'',
      variants:[ {id:uid(),label:'Ø4.5 GH3',qty:10,minQty:5,lot:''},{id:uid(),label:'Ø4.5 GH5',qty:4,minQty:5,lot:''},{id:uid(),label:'Ø5.5 GH3',qty:6,minQty:5,lot:''} ]},
  ];
}

/* ---------- 날짜/시간 유틸 ---------- */
function now(){ return new Date().toISOString(); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayKey(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function monthKey(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function fmtDate(key){ if(!key) return '-'; const [y,m,d]=key.split('-'); return `${m}.${d}`; }
function fmtDateFull(key){ if(!key) return '-'; const [y,m,d]=key.split('-');
  const wd=['일','월','화','수','목','금','토'][new Date(+y,+m-1,+d).getDay()];
  return `${y}.${m}.${d}(${wd})`; }
function fmtTime(iso){ if(!iso) return '--:--'; const d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function hoursBetween(a,b){ if(!a||!b) return 0; return Math.max(0,(new Date(b)-new Date(a))/3.6e6); }
function fmtHours(h){ const H=Math.floor(h), M=Math.round((h-H)*60); return H+'시간'+(M?` ${M}분`:''); }

/* 하루치 근로를 종류별로 나눈다.
   1.5배를 곱하는 것은 노무사 몫이고, 앱은 어떤 시간이 며칠에 얼마나 있었는지까지만 센다.
   가산이 붙는 기준이 셋인데 서로 다른 것을 본다 —
     연장 · 하루 소정근로시간을 넘긴 만큼          (퇴근이 늦어지면 생긴다)
     야간 · 밤 10시부터 아침 6시 사이              (시각이 기준이라 연장과 겹칠 수 있다)
     휴일 · 쉬기로 한 날에 나온 날                 (그날은 전부 휴일근로다)
   그래서 야간은 연장·휴일과 겹쳐도 따로 센다. 겹친 것을 어떻게 합칠지는 노무사가 정한다.
   총 근무시간은 예전 그대로 둔다 — 나누는 것과 세는 것은 다른 일이다.
   <span>근거 · 근로기준법 제56조. 다만 상시 4명 이하면 이 가산이 적용되지 않는다(제11조)</span> */
function restDayIdx(){ const n = DB.hosp && DB.hosp.restDayIdx; return (n>=0 && n<=6)? +n : 0; }
const WEEK_KO=['일','월','화','수','목','금','토'];
function isWeeklyRest(date){ const d=new Date(date+'T00:00:00'); return !isNaN(d) && d.getDay()===restDayIdx(); }

/* 쉬는 날 목록 — 공휴일과 병원이 정한 휴무일을 한 자리에 둔다.
   공공데이터 API 를 붙이지 않은 이유가 셋 있다.
     하나 · 서버가 없어 API 키를 숨길 데가 없다
     둘   · 임시공휴일·선거일·병원 휴무일(학회·여름휴가)은 어차피 API 에 없다.
            손으로 넣는 자리가 반드시 있어야 하고, 그러면 API 몫이 거의 없다
     셋   · 급여가 걸린 숫자다. 자료마다 다른 날짜를 앱이 미리 박아두면 안 된다
   그래서 날짜가 고정된 것만 앱이 만들고, 음력·대체·임시 공휴일은 사람이 넣는다. */
function hospHolidays(){ return (DB.hosp && Array.isArray(DB.hosp.holidays))? DB.hosp.holidays : []; }
function holidayNameOf(date){ const h=hospHolidays().find(x=>x && x.date===date); return h? (h.name||'휴일') : null; }
function isRestDay(date){ return isWeeklyRest(date) || !!holidayNameOf(date); }
function restDayLabel(date){
  const n=holidayNameOf(date);
  if(n) return n;
  return isWeeklyRest(date)? WEEK_KO[restDayIdx()]+'요일' : '';
}
/* 해마다 같은 날에 오는 것만. 근로자의 날은 관공서 공휴일은 아니지만
   근로자에게는 법으로 정해진 유급휴일이라 같이 넣는다.
   <span>근거 · 관공서의 공휴일에 관한 규정 · 근로자의 날 제정에 관한 법률</span> */
const FIXED_HOLIDAYS=[['01-01','신정'],['03-01','삼일절'],['05-01','근로자의 날'],
  ['05-05','어린이날'],['06-06','현충일'],['08-15','광복절'],
  ['10-03','개천절'],['10-09','한글날'],['12-25','성탄절']];
function nightHours(inAt,outAt){
  if(!inAt||!outAt) return 0;
  const a=new Date(inAt), b=new Date(outAt); if(isNaN(a)||isNaN(b)||b<=a) return 0;
  let ms=0;                       // 밤을 넘겨 일하는 경우가 있어 앞뒤 하루씩 같이 본다
  for(let k=-1;k<=1;k++){
    const from=new Date(a.getFullYear(),a.getMonth(),a.getDate()+k,22,0,0);
    const to  =new Date(a.getFullYear(),a.getMonth(),a.getDate()+k+1,6,0,0);
    ms += Math.max(0, Math.min(+b,+to) - Math.max(+a,+from));
  }
  return ms/3.6e6;
}
function dayWork(att, st){
  const total = hoursBetween(att&&att.inAt, att&&att.outAt);
  if(!total) return {total:0, over:0, night:0, holiday:0};
  const holiday = isRestDay(att.date)? total : 0;
  return { total,
    over: holiday? 0 : Math.max(0, total - dailyHoursOf(st)),
    night: nightHours(att.inAt, att.outAt),
    holiday };
}

function annualByService(joinDate, ref){
  if(!joinDate) return null;
  const j=new Date(joinDate+'T00:00:00'); if(isNaN(j)) return null;
  const now = ref? new Date(ref+'T00:00:00') : new Date();
  let years = now.getFullYear()-j.getFullYear();
  const m = now.getMonth()-j.getMonth();
  if(m<0 || (m===0 && now.getDate()<j.getDate())) years--;   // 만근속 연수
  const nth = years + 1;                                      // n년차(1-based)
  if(nth<=1) return 11;
  if(nth<=3) return 15;
  return Math.min(25, 16 + Math.floor((nth-4)/2));
}
function serviceNth(joinDate, ref){   // n년차(1-based). 입사일 없으면 null
  if(!joinDate) return null;
  const j=new Date(joinDate+'T00:00:00'); if(isNaN(j)) return null;
  const now = ref? new Date(ref+'T00:00:00') : new Date();
  let years=now.getFullYear()-j.getFullYear(); const m=now.getMonth()-j.getMonth();
  if(m<0 || (m===0 && now.getDate()<j.getDate())) years--;
  return Math.max(1, years+1);
}
/* 실제 적용 총 연차: 자동(입사일) 또는 관리자 수동 지정 */
function annualTotalOf(st){
  if(st.annualAuto!==false){ const a=annualByService(st.joinDate); if(a!=null) return a; }
  return (+st.annualTotal||0);
}
/* 하루 소정근무시간 — 주 3일 근무와 주 5일 근무가 한 병원에 섞여 있다.
   8시간 근무하는 곳이 오히려 드물어서, 연차를 날수로만 세면 짧게 일하는
   사람이 손해를 본다. 그래서 사람마다 하루 길이를 적어두고 시간으로 환산한다. */
function dailyHoursOf(st){ const h=+((st&&st.dailyHours)||0); return h>0? h : 8; }

/* 연차가 새로 채워지는 한 해를 어디서 끊는가.
   입사일 기준이면 사람마다 다르고, 회계연도 기준이면 모두 1월 1일에 같이 끊는다.
   병원마다 다르게 쓰기 때문에 고를 수 있어야 한다. */
function leaveBasis(){ return (DB.hosp && DB.hosp.leaveBasis==='fiscal')? 'fiscal' : 'join'; }
function ymdOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function leaveYearRange(st, ref){
  const now = ref? new Date(ref+'T00:00:00') : new Date();
  const fiscal = ()=>({ from: now.getFullYear()+'-01-01', to: now.getFullYear()+'-12-31' });
  if(leaveBasis()==='fiscal' || !st || !st.joinDate) return fiscal();
  const j=new Date(st.joinDate+'T00:00:00'); if(isNaN(j)) return fiscal();
  let start=new Date(now.getFullYear(), j.getMonth(), j.getDate());
  if(start>now) start=new Date(now.getFullYear()-1, j.getMonth(), j.getDate());
  const end=new Date(start.getFullYear()+1, start.getMonth(), start.getDate());
  end.setDate(end.getDate()-1);
  return { from: ymdOf(start), to: ymdOf(end) };
}
function annualRemain(st){
  const r = leaveYearRange(st);
  const used = DB.leaves.filter(l=>l.staffId===st.id && l.status==='approved'
      && l.startDate && l.startDate>=r.from && l.startDate<=r.to)
    .reduce((s,l)=>s+(+l.days||0),0);
  const total = annualTotalOf(st), dh = dailyHoursOf(st), remain = total-used;
  return { total, used, remain, range:r, dailyHours:dh,
           totalH: total*dh, usedH: used*dh, remainH: remain*dh };
}

function computeAlerts(){
  const a=[];
  DB.inventory.forEach(i=>{
    if(i.qty===0) a.push({level:'danger',icon:'📦',title:`${i.name} 품절`,sub:`최소 ${i.minQty}${i.unit}`,tab:'inv'});
    else if(i.qty<=i.minQty) a.push({level:'warn',icon:'📦',title:`${i.name} 부족`,sub:`현재 ${i.qty}${i.unit} · 최소 ${i.minQty}${i.unit}`,tab:'inv'});
    const dd=dDays(i.expiry);
    if(dd!==null){
      if(dd<0) a.push({level:'danger',icon:'📅',title:`${i.name} 유통기한 만료`,sub:`${i.expiry} · ${-dd}일 지남`,tab:'inv'});
      else if(dd<=30) a.push({level:'warn',icon:'📅',title:`${i.name} 유통기한 임박`,sub:`D-${dd} · ${i.expiry}`,tab:'inv'});
    }
  });
  (DB.implants||[]).forEach(p=>p.variants.forEach(v=>{
    if(v.qty===0) a.push({level:'danger',icon:'🦷',title:`${p.brand} ${v.label} 품절`,sub:`${p.part||''} · ${p.line||''}`,tab:'inv',mode:'implant'});
    else if(v.qty<=(+v.minQty||0)) a.push({level:'warn',icon:'🦷',title:`${p.brand} ${v.label} 부족`,sub:`${v.qty}개 · 최소 ${v.minQty}`,tab:'inv',mode:'implant'});
  }));
  if(isAdmin()){
    DB.leaves.filter(l=>l.status==='pending').forEach(l=>{ const s=staffById(l.staffId);
      a.push({level:'info',icon:'🌴',title:`연월차 승인 대기 · ${s?s.name:'(직원)'}`,sub:`${fmtDate(l.startDate)}${l.startDate!==l.endDate?'~'+fmtDate(l.endDate):''} · ${l.days}일`,tab:'leave'}); });
    (DB.resignations||[]).filter(r=>r.status==='제출').forEach(r=>{ const s=staffById(r.staffId);
      a.push({level:'warn',icon:'📄',title:`사직서 · ${s?s.name:'(직원)'}`,sub:`${fmtDate(String(r.submittedAt).slice(0,10))} 제출 · 마지막 ${r.lastDay||'-'}`,tab:'staff'}); });
    (DB.docReqs||[]).filter(r=>r.status==='제출').forEach(r=>{ const s=staffById(r.staffId);
      a.push({level:'warn',icon:'📋',title:`${docTypeName(r.typeId)} · ${s?s.name:'(직원)'}`,sub:`${fmtDate(String(r.at).slice(0,10))} 신청 · ${r.from}${r.to?'~'+r.to:''}`,tab:'staff'}); });
  }
  const me=currentUser();
  if(me) noticeMustUnread(me.id).forEach(n=>
    a.push({level:'warn',icon:'📌',title:`필독 공지 · ${n.title}`,sub:'아직 확인하지 않았어요',tab:'home'}));
  const rank={danger:0,warn:1,info:2};
  a.sort((x,y)=>rank[x.level]-rank[y.level]);
  return a;
}

/* ---- 자주 쓰는 품목 (계정별) ------------------------------------------
   같은 병원이라도 사람마다 손이 자주 가는 물건이 다르다. 순서는 본인
   계정에만 저장되고 다른 직원 화면은 건드리지 않는다. */
function myPins(){
  const u=currentUser(); if(!u) return [];
  const pf=DB.prefs[u.id]; return (pf && Array.isArray(pf.pins))? pf.pins : [];
}
function setMyPins(arr){
  const u=currentUser(); if(!u) return;
  if(!DB.prefs[u.id]) DB.prefs[u.id]={};
  DB.prefs[u.id].pins=arr; saveDB();
}
function isPinned(id){ return myPins().includes(id); }
function togglePin(id, silent){
  if(!currentUser()){ toast('로그인하면 자주 쓰는 품목을 정할 수 있어요'); return; }
  const arr=myPins().slice(), k=arr.indexOf(id);
  if(k<0) arr.unshift(id); else arr.splice(k,1);       // 새로 담으면 맨 위로
  setMyPins(arr);
  if(!silent) toast(k<0? '자주 쓰는 품목에 올렸어요' : '자주 쓰는 품목에서 내렸어요');
  renderInv();
}
// 자주 쓰는 것 안에서 위/아래로 한 칸씩
function movePin(id, dir){
  const arr=myPins().slice(), k=arr.indexOf(id); if(k<0) return;
  const t=k+dir; if(t<0||t>=arr.length) return;
  [arr[k],arr[t]]=[arr[t],arr[k]];
  setMyPins(arr); renderInv();
  const it=itemById(id); if(it) openItemDetail(id);
}
// 자주 쓰는 것을 순서대로 맨 위에 놓고, 나머지는 기존 정렬을 따른다
function pinSort(list){
  const pins=myPins();
  return list.slice().sort((a,b)=>{
    const pa=pins.indexOf(a.id), pb=pins.indexOf(b.id);
    if(pa>=0&&pb>=0) return pa-pb;
    if(pa>=0) return -1;
    if(pb>=0) return 1;
    return 0;
  });
}

/* ---- 소진 예측 · 주문 텀 ------------------------------------------------
   쓸 때마다 －출고를 누르면 일이 많아진다. 가끔 '남은 개수'만 세어 넣으면
   그 사이 사용량을 역산하고, 입고 간격의 평균으로 주문 시점을 잡는다. */
const DAY_MS=86400000;
const tms=v=>+new Date(v);
function num1(n){ return n>=10? Math.round(n) : Math.round(n*10)/10; }
function mdy(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }

// 하루 평균 사용량 — 실사가 2회 이상이면 실사로, 아니면 최근 60일 출고 기록으로.
function usageStats(it){
  const cs=it.counts||[]; let used=0, days=0;
  for(let k=1;k<cs.length;k++){
    const d=(tms(cs[k].at)-tms(cs[k-1].at))/DAY_MS;
    if(d<0.5) continue;                        // 같은 날 두 번 센 건 건너뛴다
    used+=Math.max(0,+cs[k].used||0); days+=d;
  }
  if(days>=1 && used>0) return {daily:used/days, span:Math.round(days), src:'count'};
  const since=tms(now())-60*DAY_MS;
  const outs=DB.invLogs.filter(l=>l.itemId===it.id && l.type==='out' && tms(l.at)>=since);
  if(outs.length>=2){
    const first=Math.min(...outs.map(l=>tms(l.at)));
    const d=Math.max(7,(tms(now())-first)/DAY_MS);
    const u=outs.reduce((s,l)=>s+(+l.amount||0),0);
    if(u>0) return {daily:u/d, span:Math.round(d), src:'out'};
  }
  return {daily:0, span:0, src:''};
}
// 주문 텀 = 입고와 입고 사이 간격의 평균
function orderCycle(it){
  const ins=DB.invLogs.filter(l=>l.itemId===it.id && l.type==='in').map(l=>tms(l.at)).sort((a,b)=>a-b);
  const recent=ins.slice(-6), gaps=[];
  for(let k=1;k<recent.length;k++){ const g=(recent[k]-recent[k-1])/DAY_MS; if(g>=1) gaps.push(g); }
  if(!gaps.length) return null;
  return {days:Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length), last:ins[ins.length-1], n:gaps.length};
}
// 최소 보유량에 닿는 날 = 주문해야 하는 날
function forecast(it){
  const u=usageStats(it); if(!u.daily) return null;
  const left=(it.qty-(+it.minQty||0))/u.daily;
  return {daily:u.daily, src:u.src, span:u.span, left:Math.floor(left),
    empty:Math.floor(it.qty/u.daily), at:tms(now())+Math.max(0,left)*DAY_MS};
}
function needsOrder(it){ const f=forecast(it); return it.qty<=it.minQty || !!(f && f.left<=7); }
function fcLine(it){
  const f=forecast(it); if(!f) return '';
  const oc=orderCycle(it);
  const col=f.left<=0?'var(--danger)':f.left<=7?'var(--warn)':'var(--muted)';
  const when=f.left<=0? '지금 주문하세요' : `${f.left}일 뒤 주문 (${mdy(f.at)})`;
  return `<div class="tiny" style="margin-top:4px;color:${col};word-break:keep-all">`
    + `하루 평균 ${num1(f.daily)}${esc(it.unit)} · ${when}`
    + (oc?` · 주문 텀 평균 ${oc.days}일`:'')
    + (f.src==='out'?' <span class="muted">(출고 기록 기준)</span>':'') + `</div>`;
}

// 재고 세기(실사) — 남은 개수만 받아 그 사이 사용량을 역산한다.
function recordCount(it, actual, memo){
  const before=it.qty, prev=(it.counts||[]).slice(-1)[0];
  let used=null;
  if(prev){
    const inSince=DB.invLogs.filter(l=>l.itemId===it.id && l.type==='in' && tms(l.at)>tms(prev.at))
      .reduce((s,l)=>s+(+l.amount||0),0);
    used=Math.max(0,(+prev.qty||0)+inSince-actual);   // 지난번 센 양 + 그 뒤 입고 － 지금 남은 양
  }
  it.counts=[...(it.counts||[]), {at:now(), qty:actual, used}].slice(-12);
  it.qty=actual; it.updatedAt=now();
  DB.invLogs.unshift({id:uid(), itemId:it.id, type:'count', amount:Math.abs(actual-before),
    qtyBefore:before, qtyAfter:actual, memo:memo||'', at:now()});
  return used;
}

/* 노션처럼 — 평소엔 버튼이 안 보이고, 누르면 할 수 있는 것이 나온다.
   탭하면 상세, 꾹 누르면 바로 짧은 메뉴. */
let lpTimer=null, lpFired=false;
function bindRowGestures(){
  $$('#invList .irow').forEach(el=>{
    const id=el.dataset.id;
    const hold=()=>{ lpFired=false; clearTimeout(lpTimer);
      lpTimer=setTimeout(()=>{ lpFired=true; try{navigator.vibrate&&navigator.vibrate(12);}catch(e){} openRowMenu(id); },450); };
    const drop=()=>clearTimeout(lpTimer);
    el.addEventListener('touchstart',hold,{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,drop,{passive:true}));
    el.addEventListener('mousedown',hold); ['mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,drop));
    el.addEventListener('contextmenu',e=>{ e.preventDefault(); drop(); openRowMenu(id); });
    el.addEventListener('click',()=>{ if(lpFired){ lpFired=false; return; } openItemDetail(id); });
  });
}
function openRowMenu(id){
  const it=itemById(id); if(!it) return;
  modal(`<h3>${esc(it.name)}</h3>
    <div class="tiny muted" style="margin:-6px 2px 14px">${it.qty}${esc(it.unit)} · ${esc(it.category||'분류없음')}</div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ok grow" onclick="quickAdjust('${id}','in')">＋ 입고</button>
      <button class="btn warn grow" onclick="quickAdjust('${id}','out')">－ 출고</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn soft grow" onclick="countOne('${id}')">📋 세기</button>
      <button class="btn soft grow" onclick="togglePin('${id}');closeModal()">${isPinned(id)?'★ 자주 해제':'☆ 자주 등록'}</button>
    </div>
    <div class="divider"></div>
    <div class="row">
      <button class="btn soft grow" onclick="openInvForm('${id}')">✏️ 수정</button>

    </div>
    ${isOwner()?'':'<div class="tiny muted" style="text-align:center;margin-top:10px">삭제는 최고관리자만 할 수 있어요</div>'}`);
}

// 여러 품목을 한 번에 세는 화면
function openCountSheet(){
  const list=pinSort(DB.inventory.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')));
  if(!list.length){ toast('먼저 품목을 등록하세요'); return; }
  modal(`
    <h3>📋 재고 세기</h3>
    <div class="tiny muted" style="margin:-4px 2px 10px">남은 개수만 적으세요. <b>안 센 건 비워두면</b> 넘어가요.</div>
    <div style="max-height:52vh;overflow:auto;margin-bottom:12px">
      ${list.map(i=>`<div class="cntrow">
          <div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14.5px">${isPinned(i.id)?'<span style="color:var(--warn)">★</span> ':''}${esc(i.name)}</div>
            <div class="tiny muted">${i.qty}${esc(i.unit)}</div></div>
          <input class="cntIn" data-id="${i.id}" type="number" inputmode="numeric" min="0" placeholder="${i.qty}"></div>`).join('')}
    </div>
    <button class="btn block" onclick="saveCountSheet()">다 셌어요</button>`);
}
function saveCountSheet(){
  const memo='';
  let n=0, gap=0;
  $$('.cntIn').forEach(el=>{
    const v=el.value.trim(); if(v==='') return;
    const it=itemById(el.dataset.id); if(!it) return;
    const actual=Math.max(0,parseInt(v,10)||0);
    if(actual!==it.qty) gap++;
    recordCount(it,actual,memo); n++;
  });
  if(!n){ toast('센 품목의 개수를 적어주세요'); return; }
  saveDB(); closeModal(); renderInv();
  toast(`${n}개 품목 반영${gap?` · ${gap}개는 앱 기록과 달라 맞췄어요`:''}`);
}
// 품목 하나만 세기
function countOne(id){
  const it=itemById(id); if(!it) return;
  const f=forecast(it);
  modal(`
    <h3>📋 재고 세기 · ${esc(it.name)}</h3>
    <div class="tiny muted" style="margin-bottom:12px">앱 기록 <b>${it.qty}${esc(it.unit)}</b>${f?` · 하루 평균 ${num1(f.daily)}${esc(it.unit)}`:''}</div>
    <label class="field"><span>지금 남은 개수 (${esc(it.unit)})</span>
      <input id="cnt1" type="number" inputmode="numeric" min="0" value="${it.qty}"
        style="font-size:22px;text-align:center;font-weight:800"></label>
    <label class="field"><span>메모 (선택)</span><input id="cnt1Memo" placeholder="예: 월말 실사"></label>
    <button class="btn block" onclick="saveCountOne('${id}')">반영하기</button>`);
}
function saveCountOne(id){
  const it=itemById(id); if(!it) return;
  const actual=Math.max(0,parseInt($('#cnt1').value,10)||0);
  const used=recordCount(it,actual,($('#cnt1Memo').value||'').trim());
  saveDB(); closeModal(); renderInv();
  toast(used===null? `${it.name} ${actual}${it.unit} 기록 · 다음에 또 세면 사용량이 나와요`
                   : `${it.name} ${actual}${it.unit} · 그 사이 ${used}${it.unit} 사용`);
}

let invFilter='all';
function setInvFilter(f){ invFilter=f; $$('#invFilter button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); renderInv(); }
function renderInv(){
  const q = ($('#invSearch').value||'').trim().toLowerCase();
  let list = DB.inventory.slice().sort((a,b)=>(a.qty<=a.minQty?0:1)-(b.qty<=b.minQty?0:1) || a.name.localeCompare(b.name,'ko'));
  if(q) list = list.filter(i=>(i.name+' '+(i.category||'')).toLowerCase().includes(q));
  if(invFilter==='low') list=list.filter(i=>i.qty<=i.minQty);
  if(invFilter==='ok') list=list.filter(i=>i.qty>i.minQty);
  if(invFilter==='order') list=list.filter(needsOrder);
  if(invFilter==='pin') list=list.filter(i=>isPinned(i.id));
  list=pinSort(list);
  const box = $('#invList');
  // 품목이 적으면 검색창을 숨긴다 — 화면이 짧을수록 쓰기 쉽다
  const sw=$('#invSearchWrap'); if(sw) sw.style.display = (DB.inventory.length>8||q)?'':'none';
  // 필터 칩에 개수를 얹어 통계 블록을 대신한다
  const all=DB.inventory, cnt={all:all.length, low:all.filter(i=>i.qty<=i.minQty).length,
    order:all.filter(needsOrder).length, ok:all.filter(i=>i.qty>i.minQty).length,
    pin:all.filter(i=>isPinned(i.id)).length};
  $$('#invFilter button').forEach(b=>{
    const base={all:'전체',pin:'★ 자주',order:'주문임박',low:'부족',ok:'충분'}[b.dataset.f];
    const n=cnt[b.dataset.f];
    b.innerHTML = base + (n?` <span style="opacity:.65;font-size:11.5px">${n}</span>`:'');
  });
  if(!list.length){ box.innerHTML = `<div class="card">${emptyBox('📦', DB.inventory.length?'조건에 맞는 품목이 없어요':'＋품목 버튼으로 재고를 추가하세요')}</div>`; refreshBell(); return; }
  box.innerHTML = list.map(i=>{
    const f=forecast(i), dd=dDays(i.expiry);
    // 색 하나로 상태를 말한다 — 품절 빨강, 부족 주황, 주문 임박 주황, 그 외 초록
    const st = i.qty===0? 'var(--danger)' : i.qty<=i.minQty? 'var(--warn)'
      : (f&&f.left<=7)? 'var(--warn)' : (dd!==null&&dd<=30)? 'var(--danger)' : 'var(--ok)';
    // 한 줄만 보여준다. 급한 게 있으면 그것만, 없으면 분류·최소량.
    const note = i.qty===0? '품절'
      : i.qty<=i.minQty? `부족 · 최소 ${i.minQty}${esc(i.unit)}`
      : (f&&f.left<=7)? (f.left<=0?'지금 주문':`${f.left}일 뒤 주문`)
      : (dd!==null&&dd<0)? '유통기한 만료' : (dd!==null&&dd<=30)? `유통기한 D-${dd}`
      : [esc(i.category||''), f?`하루 ${num1(f.daily)}${esc(i.unit)}`:''].filter(Boolean).join(' · ');
    return `<div class="irow" data-id="${i.id}">
      <span class="dot" style="background:${st}"></span>
      <div class="grow" style="min-width:0">
        <div class="nm">${isPinned(i.id)?'<span style="color:var(--warn)">★</span> ':''}${esc(i.name)}</div>
        ${note?`<div class="tiny" style="color:${st===('var(--ok)')?'var(--muted)':st};margin-top:1px">${note}</div>`:''}
      </div>
      <div class="qty">${i.qty}<u>${esc(i.unit)}</u></div>
      <span class="chev">›</span>
    </div>`;
  }).join('');
  bindRowGestures();
  refreshBell();
}

function doAdjust(id,type){
  const it=itemById(id); const amt=Math.abs(parseInt($('#qAmt').value,10)||0);
  if(!amt){ toast('수량을 입력하세요'); return; }
  const before=it.qty;
  it.qty = type==='in'? it.qty+amt : Math.max(0, it.qty-amt);
  it.updatedAt=now();
  DB.invLogs.unshift({id:uid(), itemId:id, type, amount:amt, qtyBefore:before, qtyAfter:it.qty,
    memo:($('#qMemo').value||'').trim(), at:now()});
  saveDB(); closeModal(); renderInv();
  toast(`${it.name} ${type==='in'?'입고':'출고'} ${amt}${it.unit} 완료`);
  if(it.qty<=it.minQty) setTimeout(()=>toast(`⚠️ ${it.name} 재고 부족 (${it.qty}${it.unit})`),1400);
}

function downloadTemplate(){

function handleImport(ev){
  const f=ev.target.files[0]; if(!f) return;
  const isCsv=/\.csv$/i.test(f.name);
  const r=new FileReader();
  r.onload=()=>{
    try{
      let rows;
      if(!isCsv && typeof XLSX!=='undefined'){
        const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      }else{
        rows=parseCSV(typeof r.result==='string'?r.result:new TextDecoder('utf-8').decode(r.result));
      }
      const items=rowsToItems(rows);
      if(!items.length){ toast('읽을 수 있는 품목이 없어요'); return; }
      previewImport(items);
    }catch(e){ toast('파일을 읽지 못했어요. 양식을 확인해 주세요'); }
  };
  if(!isCsv && typeof XLSX!=='undefined') r.readAsArrayBuffer(f);
  else r.readAsText(f,'utf-8');
}
function parseCSV(text){
  const out=[]; let row=[], cur='', q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); if(row.some(x=>x!=='')) out.push(row); row=[]; cur=''; }
      else cur+=c; } }
  if(cur!==''||row.length){ row.push(cur); if(row.some(x=>x!=='')) out.push(row); }
  return out;
}
function rowsToItems(rows){
  rows=rows.filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(!rows.length) return [];
  const norm=s=>String(s||'').replace(/\s|\(.*?\)/g,'').toLowerCase();
  const header=rows[0].map(norm);
  const idx={};
  for(const key in COLMAP){ idx[key]=header.findIndex(h=>COLMAP[key].some(k=>norm(k)===h||h.includes(norm(k)))); }
  let hasHeader = idx.name>=0;
  // 헤더가 없으면 순서 가정: 품목명,분류,단위,현재수량,최소보유량,메모
  let dataRows, col;
  if(hasHeader){ dataRows=rows.slice(1); col=idx; }
  else { dataRows=rows; col={name:0,category:1,unit:2,qty:3,minQty:4,vendor:5,price:6,expiry:7,note:8}; }
  const num=v=>{ const n=parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n)?null:n; };
  const pick=(r,k)=> col[k]>=0 && col[k]!=null ? r[col[k]] : undefined;
  const normDate=v=>{ v=String(v??'').trim(); if(!v) return ''; const m=v.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/); return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''; };
  const items=[];
  for(const r of dataRows){
    const name=String(pick(r,'name')??'').trim(); if(!name) continue;
    items.push({
      name,
      category:String(pick(r,'category')??'').trim(),
      unit:String(pick(r,'unit')??'').trim()||'개',
      qty:Math.max(0,num(pick(r,'qty'))??0),
      minQty:Math.max(0,num(pick(r,'minQty'))??10),
      vendor:String(pick(r,'vendor')??'').trim(),
      price:Math.max(0,num(pick(r,'price'))??0),
      expiry:normDate(pick(r,'expiry')),
      note:String(pick(r,'note')??'').trim(),
    });
  }
  return items;
}

/* ========================================================================
   임플란트 모듈 (브랜드·부품종류·규격 매트릭스)
   ======================================================================== */
let currentImplantId=null;
const implantById=id=>DB.implants.find(p=>p.id===id);
function parseDL(label){ const m=String(label||'').match(/^\s*(?:Ø|ø|D)?\s*(\d+(?:\.\d+)?)\s*[x×X*]\s*(\d+(?:\.\d+)?)\s*$/); return m?{d:parseFloat(m[1]),l:parseFloat(m[2])}:null; }
function vState(v){ return v.qty===0?'zero':(v.qty<=(+v.minQty||0)?'low':'ok'); }
/* 임플란트 재고 대사(입고·사용·현재고·실재고·오차) */
const USE_CATS=[{k:'normal',ko:'일반',cls:'info'},{k:'insurance',ko:'보험',cls:'pend'},{k:'fail',ko:'페일',cls:'danger'}];
function catKo(k){ const c=USE_CATS.find(x=>x.k===k); return c?c.ko:'일반'; }
function vUse(v){ return (+v.uNor||0)+(+v.uIns||0)+(+v.uFail||0); }
function vDiff(v){ return (v.phys==null||v.phys==='')? null : (parseInt(v.phys,10)-(+v.qty||0)); }  // 실재고-현재고
function pIn(p){ return p.variants.reduce((s,v)=>s+(+v.inTot||0),0); }
function pQty(p){ return p.variants.reduce((s,v)=>s+(+v.qty||0),0); }
function pUse(p){ return p.variants.reduce((s,v)=>s+vUse(v),0); }
function pPhys(p){ return p.variants.reduce((s,v)=>s+((v.phys!=null&&v.phys!=='')?parseInt(v.phys,10):(+v.qty||0)),0); }
function pDiff(p){ return p.variants.reduce((s,v)=>{ const d=vDiff(v); return s+(d||0); },0); }
function pHasCount(p){ return p.variants.some(v=>v.phys!=null&&v.phys!==''); }

/* ---- 페일 교환 ----------------------------------------------------------
   페일난 픽스처는 버리지 않는다. 모아뒀다가 분기마다 업체와 바꾼다 —
   실장 말 그대로다: "페일난 것은 모아둔다 — 교환 대상이다"
   (docs/CALL_2026-08-19_REQUIREMENTS.md 1-4장, 01:00~01:03).

   재고가 움직이는 자리는 '입고 확인' 한 곳뿐이다.

     페일 기록   재고 −1   이미 몸에서 나간 물건이다. 여기는 바뀐 것이 없다
     교환 신청   변동 없음  신청은 신청일 뿐이다
     입고 확인   재고 +N   신청한 개수를 넘겨 받을 수 없다

   교환으로 들어온 것은 매입(inTot)에 넣지 않는다. 돈을 낸 것이 아닌데
   섞으면 산 개수가 부풀어 원가가 흐려진다. 재고 개수는 맞아떨어져서
   눈에 안 띈다 — 이 앱이 잡아내려는 바로 그 종류의 오차다.

   그래서 장부 식이 한 항 늘었다:  매입 + 교환입고 − 사용 = 현재고 */
function exReq(v){ return +v.exReq||0; }                              // 신청 누적
function exIn(v){ return +v.exIn||0; }                                // 받은 누적
function failOpen(v){ return Math.max(0,(+v.uFail||0)-exReq(v)); }    // 아직 신청 안 한 페일
function failWait(v){ return Math.max(0,exReq(v)-exIn(v)); }          // 신청했는데 안 온 것
function vOpen(v){ return +v.opening||0; }                            // 0번 칸 — 이월재고
function vAdj(v){ return +v.adj||0; }                                  // 실사 보정 누적(±) · 화면에 안 낸다
function vBook(v){ return vOpen(v)+(+v.inTot||0)+exIn(v)+vAdj(v)-vUse(v); }
function pOpen(p){ return (p.variants||[]).reduce((s,v)=>s+vOpen(v),0); }
function pAdj(p){ return (p.variants||[]).reduce((s,v)=>s+vAdj(v),0); }

/* ---- 이월재고와 보정 ----------------------------------------------------
   장부 식:  이월 + 매입 + 교환입고 + 보정 − 사용 = 현재고

   **이월재고(0번 칸)** 는 통화록 1-1장에서 실장이 번호까지 붙여 말한 칸이다
   — 전월에서 넘어온 것, 양도양수, 패키지 잔량. 앱을 쓰기 전부터 선반에
   있던 물건이 여기 들어간다. 지금까지 이 칸이 없어서 다섯 칸이 네 칸이었고,
   갈 곳 없는 재고가 아무 데도 안 잡혀 '매입 50 · 사용 0 인데 현재고 65'
   같은 일이 생겼다.

   **보정** 은 실사에서 맞춘 몫이다. 값은 남기되 **요약 화면에는 내지 않는다.**
   재고 앱이 화면에 '손으로 몇 개 고쳤음'을 띄우면, 그건 병원에 도움이 되는
   정보가 아니라 남에게 보여줄 때 불리해지는 문서가 된다. 필요한 사람은
   기록(implantLogs)에서 본다.

   매입에 얹지 않는 이유는 그대로다 — 사지도 않은 것이 매입으로 잡히면
   원가가 흐려지고, 그것도 결국 숨기는 것이다. */
function bumpAdj(v, delta){ if(delta) v.adj=vAdj(v)+delta; }
function bumpOpen(v, delta){ if(delta) v.opening=vOpen(v)+delta; }

/* 0번 칸이 없던 시절에 갈 곳 없던 재고를 한 번만 이월로 옮긴다.
   앱을 쓰기 전부터 선반에 있던 물건이라 이월재고가 맞는 자리다.
   재고 숫자와 매입은 한 개도 안 움직인다. */
function backfillAdj(){
  if(!DB || DB.adjBackfilledAt) return;             // 한 번만
  if(!Array.isArray(DB.implantLogs)) DB.implantLogs=[];   // 기록 자리가 없으면 만들고 간다.
  // 부르는 순서가 바뀌어도 앱이 안 열리는 일은 없어야 한다.
  let touched=0;
  (DB.implants||[]).forEach(p=>(p.variants||[]).forEach(v=>{
    const gap=(+v.qty||0)-vBook(v);
    if(!gap) return;
    bumpOpen(v, gap); touched++;
    implantLog(p.id, v.id, 'open', null, gap, +v.qty||0, +v.qty||0, '이월재고 등록');
  }));
  DB.adjBackfilledAt = now();
  if(touched) setTimeout(()=>toast(`${touched}개 규격의 이월재고를 잡았어요`), 900);
}
function pFailOpen(p){ return (p.variants||[]).reduce((s,v)=>s+failOpen(v),0); }
function pFailWait(p){ return (p.variants||[]).reduce((s,v)=>s+failWait(v),0); }
function pExIn(p){ return (p.variants||[]).reduce((s,v)=>s+exIn(v),0); }

// 교환 신청 — 재고를 건드리지 않는다. 페일난 개수보다 많이 신청할 수 없다.
function claimFail(pid, vid, n){
  const p=implantById(pid); if(!p) return 0;
  const v=(p.variants||[]).find(x=>x.id===vid); if(!v) return 0;
  const take=Math.max(0,Math.min(parseInt(n,10)||0, failOpen(v)));
  if(!take) return 0;
  v.exReq=exReq(v)+take;
  implantLog(p.id,v.id,'claim','fail',take,v.qty,v.qty,'페일 교환 신청');   // 앞뒤가 같다
  return take;
}
// 입고 확인 — 재고가 느는 유일한 자리다. 신청하지 않은 것은 받을 수 없다.
function receiveFail(pid, vid, n){
  const p=implantById(pid); if(!p) return 0;
  const v=(p.variants||[]).find(x=>x.id===vid); if(!v) return 0;
  const take=Math.max(0,Math.min(parseInt(n,10)||0, failWait(v)));
  if(!take) return 0;
  const before=+v.qty||0;
  v.exIn=exIn(v)+take; v.qty=before+take;
  implantLog(p.id,v.id,'in',null,take,before,v.qty,'페일 교환 입고');
  return take;
}

/* ---- 페일 교환 화면 ---- */

      몇 개 보냈고 몇 개 받았는지만 세어둡니다.<br>
      <b>신청했다고 재고가 늘지는 않아요.</b> 물건이 실제로 도착한 날 <b>들어왔어요</b>를 눌러주세요.</div>
    ${body}
    <div class="tiny muted" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      교환으로 받은 건 산 것으로 세지 않아요. 돈 주고 산 개수와 섞이면 나중에 얼마나 샀는지 알 수 없거든요.</div>`);
}
function doClaimFail(pid, vid){
  const p=implantById(pid), v=p&&(p.variants||[]).find(x=>x.id===vid); if(!v) return;
  const n=failOpen(v);
  if(!confirm(`${v.label} ${n}개 바꿔달라고 할까요?\n재고는 그대로예요.`)) return;
  const did=claimFail(pid,vid,n);
  saveDB(); openFailExchange();
  toast(did?`${did}개 신청했어요 · 재고는 그대로예요`:'신청할 게 없어요');
}
function doReceiveFail(pid, vid){
  const p=implantById(pid), v=p&&(p.variants||[]).find(x=>x.id===vid); if(!v) return;
  const max=failWait(v);
  const raw=prompt(`${v.label} — 몇 개 들어왔나요? (신청한 건 ${max}개)`, String(max));
  if(raw===null) return;
  const did=receiveFail(pid,vid,raw);
  saveDB(); openFailExchange(); renderInvPage();
  toast(did?`${did}개 들어왔어요 · 재고에 넣었어요`:'들어온 게 없어요');
}
function implantLog(pid,vid,type,cat,amount,before,after,memo){
  DB.implantLogs.unshift({id:uid(),pid,vid,type,cat:cat||null,amount,before,after,memo:memo||'',at:now()});
  if(DB.implantLogs.length>1200) DB.implantLogs=DB.implantLogs.slice(0,1200);
}
function recentUse(pid,days){
  const since=Date.now()-(days||30)*86400000, o={normal:0,insurance:0,fail:0,total:0};
  DB.implantLogs.forEach(l=>{ if(l.pid===pid && l.type==='out' && new Date(l.at).getTime()>=since){
    const k=l.cat||'normal'; if(o[k]!=null)o[k]+=l.amount; o.total+=l.amount; }});
  return o;
}

function saveStocktake(pid,reconcile){
  const p=implantById(pid); let changed=0, adjusted=0;
  p.variants.forEach(v=>{ const el=$('#stk_'+v.id); if(!el) return;
    const val=parseInt(el.value,10); if(isNaN(val)||val<0) return;
    v.phys=val; v.physAt=todayKey(); changed++;
    if(reconcile && val!==v.qty){ const before=v.qty; implantLog(pid,v.id,'adjust',null,val-before,before,val,'실사 보정(일괄)'); bumpAdj(v,val-before); v.qty=val; adjusted++; }
  });
  saveDB(); closeModal(); renderImplant();
  toast(reconcile?`실사 저장 · ${adjusted}개 규격 보정`:`실재고 ${changed}개 규격 저장`);
}
function matrixHtml(p,parsed){
  const fx=parsed.filter(x=>x.dl), others=parsed.filter(x=>!x.dl);
  const ax=specAxis(p.part), g=gridAxes(p);
  const dias=g.bs, lens=g.ss;
  const at=(d,l)=>fx.find(x=>x.dl.d===d&&x.dl.l===l);
  let t=`<div class="hint" style="margin-bottom:10px">📥 <b>빈 칸을 누르면</b> 그 규격이 만들어지고, <b>숫자가 있는 칸</b>은 <b style="color:var(--ok)">＋입고</b> · <b style="color:var(--warn)">－사용</b> · 실재고를 기록해요. 칸 모서리 <b style="color:var(--warn)">●</b> 는 실재고 오차. <span class="muted">(가로 = ${ax.s} mm, 세로 = ${ax.b} Ø)</span></div>`;
  t+=`<div style="overflow-x:auto"><table class="mtx"><tr><th></th>${lens.map(l=>`<th>${specNum(l)}</th>`).join('')}<th><button type="button" class="chip" onclick="addAxis('${p.id}','s')" title="${ax.s} 더하기">＋</button></th></tr>`;
  dias.forEach(d=>{ t+=`<tr><td class="rowh">Ø${specNum(d)}</td>`+lens.map(l=>{ const c=at(d,l);
    if(!c) return `<td><div class="cell empty" onclick="openVariantForm('${p.id}','','${d}×${l}')">＋</div></td>`;
    const df=vDiff(c.v);
    const dot = df!=null&&df!==0?`<span style="position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:${df<0?'var(--danger)':'var(--warn)'}"></span>`:'';
    return `<td><div class="cell ${vState(c.v)}" style="position:relative" onclick="openVariant('${p.id}','${c.v.id}')">${dot}${c.v.qty}<span class="u">개</span></div></td>`;
  }).join('')+`<td></td></tr>`; });
  t+=`<tr><td class="rowh"><button type="button" class="chip" onclick="addAxis('${p.id}','b')" title="${ax.b} 더하기">＋</button></td><td colspan="${lens.length+1}" class="tiny muted" style="text-align:left;padding-left:8px">특수 사이즈는 ＋로 눈금을 더하세요</td></tr>`;
  t+=`</table></div><div class="legend2"><span><i class="ok"></i>충분</span><span><i class="low"></i>부족</span><span><i class="zero"></i>품절</span></div>`;
  if(others.length) t+=`<div class="tiny muted" style="margin:12px 2px 4px">기타 규격</div>`+variantRows(p,others.map(x=>x.v));
  return t;
}
function variantRows(p,vars){
  return vars.map(v=>{ const st=vState(v); const d=vDiff(v);
    const pill=st==='zero'?'<span class="pill danger">품절</span>':st==='low'?'<span class="pill warn">부족</span>':'';
    const dpill = d!=null&&d!==0?`<span class="pill ${d<0?'danger':'warn'}">오차 ${d>0?'+':''}${d}</span>`:'';
    return `<div class="item">
      <div class="grow"><div class="t" style="font-size:14.5px">${esc(v.label)} ${pill}${dpill}</div>
        <div class="d tiny muted">${v.qty}개 · 최소 ${v.minQty||0}${v.lot?' · LOT '+esc(v.lot):''}</div></div>
      <div class="row" style="gap:5px">
        <button class="btn ok xs" onclick="adjustVariant('${p.id}','${v.id}','in')">＋</button>
        <button class="btn warn xs" onclick="adjustVariant('${p.id}','${v.id}','out')">－</button>
        <button class="btn soft xs" onclick="openVariant('${p.id}','${v.id}')">⋯</button>
      </div></div>`;
  }).join('');
}
const PARTS=['픽스처','어버트먼트','힐링캡','커버스크류','기타'];

/* ---- 규격 두 축 ---------------------------------------------------------
   × 를 손으로 치는 게 일이라 칸을 둘로 나눴다. 화면의 × 는 인쇄된 글자이고
   손으로 넣는 것은 숫자뿐이다.

   일반 치과는 픽스처를 두께와 길이로만 고른다(사용자 확인). 잇몸높이는
   힐링 쪽 축이다.

   범위는 막으려고 두는 것이 아니다. 붙여 쓴 숫자를 읽을 때 불가능한 해석을
   지우는 데 쓴다 — 임플란트에 두께 30mm 는 없으니 '3010' 은 3.0×10 하나만
   남는다. 짐작이 아니라 나머지가 물리적으로 불가능해서 남은 것이다.
   후보가 둘 이상이면 고르게 하고, 범위를 벗어나도 막지 않는다.
   모르는 기준으로 막으면 양치기가 된다 — 보험 안내와 같은 원칙이다.

   조사 근거는 docs/IMPLANT_SPECS.md 에 적었다. 값은 넉넉하게 잡았다. */
const SPEC_AXIS = {
  '픽스처':      {b:'두께', s:'길이',     bMin:2,   bMax:8,  sMin:4,   sMax:20},
  '힐링캡':      {b:'두께', s:'잇몸높이', bMin:2,   bMax:10, sMin:0.5, sMax:12},
  '어버트먼트':  {b:'두께', s:'높이',     bMin:2,   bMax:10, sMin:0.5, sMax:20}
};
// 커버스크류는 없다. 픽스처에 딸려 오고, 요즘은 커버 없이 힐링이 바로
// 들어가는 경우도 많다(사용자 확인). 따로 셀 물건이 아니다.

/* 표를 처음 펼칠 때 깔아 둘 눈금. 병원이 실제로 쓰는 것이 정답이므로
   등록된 규격이 있으면 그쪽이 이긴다. 이건 빈 표를 여는 시작점일 뿐이다.
   근거는 docs/IMPLANT_SPECS.md — 오스템 TS III 길이가 확인된 값이다. */
const SPEC_SEED = {

  '힐링캡':     {bs:[4.0,4.5,5.0,5.5,6.0], ss:[2,3,4,5,6]},
  '어버트먼트': {bs:[4.0,4.5,5.0,5.5,6.0], ss:[1,2,3,4,5]}
};
// 표의 눈금 — 병원이 쓰는 것 + 손으로 더한 것 + (아무것도 없으면) 시작점
function gridAxes(p){
  const useB=new Set(), useS=new Set();
  (p.variants||[]).forEach(v=>{ const dl=parseDL(v.label); if(dl){ useB.add(dl.d); useS.add(dl.l); } });
  (p.axisB||[]).forEach(n=>useB.add(+n));
  (p.axisS||[]).forEach(n=>useS.add(+n));
  // 시작점은 바닥이지 대체품이 아니다. 규격 하나를 넣었다고 표가 한 줄로
  // 쪼그라들면 나머지를 눌러 넣을 자리가 없어진다 — 표를 쓰는 이유가 사라진다.
  const seed=SPEC_SEED[p.part];
  if(seed){ seed.bs.forEach(n=>useB.add(n)); seed.ss.forEach(n=>useS.add(n)); }
  const num=(a,b)=>a-b;
  return { bs:[...useB].sort(num), ss:[...useS].sort(num) };
}
// 눈금 하나를 더한다. 특수 사이즈는 여기로 들어와 표에 자리를 얻는다.
function addAxis(pid, which){
  const p=implantById(pid), ax=specAxis(p.part);
  const 무엇 = which==='b'? ax.b : ax.s;
  const raw=prompt(`표에 더할 ${무엇}(mm)`, '');
  if(raw===null) return;
  const n=parseFloat(String(raw).replace(/[^0-9.]/g,''));
  if(!isFinite(n)||n<=0){ toast('숫자로 적어주세요'); return; }
  const key = which==='b'? 'axisB' : 'axisS';
  if(!Array.isArray(p[key])) p[key]=[];
  if(!p[key].includes(n)) p[key].push(n);
  saveDB(); renderImplant(); toast(`${무엇} ${specNum(n)} 을 표에 더했어요`);
}
function specAxis(part){ return SPEC_AXIS[part] || {b:'두께', s:'길이', bMin:0.5, bMax:30, sMin:0.5, sMax:30}; }

// 붙여 친 숫자가 한 가지로만 읽히면 그 자리에서 두 칸으로 갈라 놓는다.
// 확인 창을 띄우지 않는 이유 — × 치는 마찰을 없애려고 만든 기능에 마찰을
// 새로 붙일 수 없다. 대신 갈라진 결과가 칸에 그대로 보이므로 조용하지 않다.
function specSplit(part){
  const B=$('#vB'), S=$('#vS'); if(!B||!S) return;
  const raw=B.value.trim(); if(!raw) return;
  const ax=specAxis(part), n=parseFloat(raw);
  // 첫 칸에 적힌 것이 두께로 말이 되면 손대지 않는다. 3.5 를 치는 중일 뿐이다.
  if(isFinite(n) && String(n)===raw && n>=ax.bMin && n<=ax.bMax) return;
  const g=specGuess(raw, part);
  if(g.length!==1) return;                        // 여럿이거나 못 읽으면 손대지 않는다
  // 둘째 칸에 값이 남아 있어도 덮는다. '3010' 은 두께가 될 수 없으므로
  // 그대로 두면 3010×12 같은 이름이 조용히 만들어진다 — 실제로 그랬다.
  B.value=specNum(g[0].b); S.value=specNum(g[0].s);
}
function hasAxis(part){ return !!SPEC_AXIS[part]; }

// 숫자를 사람이 적던 대로 되돌린다. 4 → '4', 4.50 → '4.5'
function specNum(n){ return String(parseFloat(n)); }
// 규격 이름은 언제나 같은 모양으로 만든다 — 모양이 갈리면 재고가 갈린다
function dlLabel(b, s){
  const B=specNum(b); if(!isFinite(parseFloat(B))) return '';
  if(s===''||s==null) return B;
  const S=specNum(s); return isFinite(parseFloat(S)) ? `${B}×${S}` : B;
}
// 두 규격이 같은 것인가 — '4×12' 와 '4.0×12' 는 같다. 글자로 비교하면 갈린다.
function sameSpec(a, b){
  const x=parseDL(a), y=parseDL(b);
  if(x&&y) return x.d===y.d && x.l===y.l;
  return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
}
// 붙여 쓴 숫자에서 가능한 읽기를 모두 낸다. 고르는 것은 사람이 한다.
function specGuess(text, part){
  const t=String(text||'').trim(); if(!t) return [];
  const ax=specAxis(part);
  const 맞나=(b,s)=> b>=ax.bMin&&b<=ax.bMax && s>=ax.sMin&&s<=ax.sMax;
  // 구분자가 있으면 읽을 것도 없다
  const m=t.match(/^\s*(?:Ø|ø|D)?\s*(\d+(?:\.\d+)?)\s*(?:[x×X*,\-\s/]+)\s*(\d+(?:\.\d+)?)\s*(?:mm)?\s*$/);
  if(m) return [{b:+m[1], s:+m[2], sure:true}];
  const d=t.replace(/[^0-9]/g,''); if(d.length<2) return [];
  const out=[], seen=new Set();
  for(let i=1;i<d.length;i++){
    const L=d.slice(0,i), R=d.slice(i);
    // 앞은 두께다. 2자리면 소수점을 넣어 본다(30 → 3.0), 그대로도 본다.
    const bs = L.length===2 ? [+L, +(L[0]+'.'+L[1])] : [+L];
    const ss = R.length===2 ? [+R, +(R[0]+'.'+R[1])] : [+R];
    bs.forEach(b=>ss.forEach(s=>{
      if(!맞나(b,s)) return;
      const k=specNum(b)+'|'+specNum(s); if(seen.has(k)) return;
      seen.add(k); out.push({b,s,sure:false});
    }));
  }
  return out;
}

function saveVariant(pid,vid){
  const p=implantById(pid);
  let label;
  if(hasAxis(p.part) && $('#vB')){
    const b=$('#vB').value.trim(), sv=$('#vS').value.trim();
    // 한 칸에 붙여 썼으면 읽어 본다. 물리적으로 가능한 읽기가 하나뿐일 때만 넣는다.
    if(b && !sv){
      const g=specGuess(b, p.part);
      if(g.length===1){ label=dlLabel(g[0].b,g[0].s); }
      else if(g.length>1){ toast(`${g.map(x=>dlLabel(x.b,x.s)).join(' 인가요, ')} 인가요? 두 칸에 나눠 적어주세요`); return; }
      else { toast(`${specAxis(p.part).s}도 적어주세요`); return; }
    } else label=dlLabel(b, sv);
    if(!label){ toast('규격을 숫자로 적어주세요'); return; }
  } else {
    label=$('#vLabel').value.trim();
  }
  if(!label){ toast('규격을 입력하세요'); return; }
  const qty=Math.max(0,parseInt($('#vQty').value,10)||0);
  const data={ label, qty, minQty:Math.max(0,parseInt($('#vMin').value,10)||0), lot:$('#vLot').value.trim() };
  if(vid){ const v=p.variants.find(x=>x.id===vid);
    // 여기가 재고가 새던 자리다. 개수만 바뀌고 매입도 사용도 안 따라가서
    // 매입 50 · 사용 0 인데 현재고가 65 가 됐다.
    if(qty!==v.qty){ implantLog(pid,vid,'adjust',null,qty-v.qty,v.qty,qty,'규격 수정'); bumpAdj(v,qty-v.qty); }
    Object.assign(v, data); }
  else { const dup=p.variants.find(x=>sameSpec(x.label,label));
    if(dup){ toast(`이미 ${dup.label} 로 있어요`); return; }
    const nv={id:uid(), ...data, inTot:qty, uNor:0, uIns:0, uFail:0, phys:null, physAt:null};
    p.variants.push(nv); if(qty>0) implantLog(pid,nv.id,'in',null,qty,0,qty,'초기 등록'); }
  saveDB(); closeModal(); renderImplant(); toast('저장되었습니다');
}

  const p=implantById(pid); const v=p.variants.find(x=>x.id===vid); ivCat='normal';
  const catRow = type==='out' ? `<label class="field"><span>사용 구분 *</span>

function doVariantAdjust(pid,vid,type){
  const p=implantById(pid); const v=p.variants.find(x=>x.id===vid);
  const amt=Math.abs(parseInt($('#ivAmt').value,10)||0); if(!amt){ toast('수량을 입력하세요'); return; }
  const before=v.qty;
  if(type==='in'){ v.qty=v.qty+amt; v.inTot=(+v.inTot||0)+amt; implantLog(pid,vid,'in',null,amt,before,v.qty,''); }
  else { v.qty=Math.max(0,v.qty-amt);
    const cat=ivCat||'normal';
    if(cat==='insurance') v.uIns=(+v.uIns||0)+amt; else if(cat==='fail') v.uFail=(+v.uFail||0)+amt; else v.uNor=(+v.uNor||0)+amt;

/* ========================================================================
   임플란트 대장 — 손으로 쓰던 관리대장을 그대로 옮긴 것
   한 줄 = 임플란트 하나 = 치아 하나. 전악은 16~18줄이라 치식도에서
   찍어 한 번에 넣고, LOT만 치아별로 적는다.
   ======================================================================== */
const FDI_UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const FDI_LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const FDI_ALL=[...FDI_UP,...FDI_LO];
// 목록은 숫자순이 아니라 치식도에 적힌 순서로 — 그래야 눈으로 따라간다
const fdiSort=(a,b)=>FDI_ALL.indexOf(a)-FDI_ALL.indexOf(b);
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function chosung(ch){ const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch; }
// 성은 그대로, 나머지는 초성만. 덴트웹에서 초성으로 찾히면서 이름은 앱에 안 남는다.
function maskName(name){
  const t=(name||'').replace(/\s/g,''); if(!t) return '';
  return t[0] + t.slice(1).split('').map(chosung).join('');
}
function caseById(id){ return (DB.implantCases||[]).find(c=>c.id===id); }
function abCount(c){ return (c.teeth||[]).filter(t=>(t.ab||'').trim()||t.abT==='커스텀').length; }
// 규격 추천 목록 — 등록된 임플란트 제품에서 끌어온다
function lcOpts(part){
  const k = part==='픽스처'?'fixtures' : part==='힐링'?'healings' : part==='골이식'?'grafts' : part==='코핑'?'copings' : 'abutments';
  const m = mUsable(k).map(r=>mLabel(k,r)).filter(Boolean);
  if(m.length) return m;                       // 재료 목록을 잡아두면 그것만 쓴다
  const out=[];                                // 아직 안 잡았으면 등록된 임플란트 제품에서 끌어온다
  (DB.implants||[]).filter(p=>(p.part||'').includes(part)).forEach(p=>
    (p.variants||[]).forEach(v=>out.push(part==='픽스처'? `${p.brand} ${v.label}` : v.label)));
  return [...new Set(out)];
}

/* ---- 재료 목록(마스터) — 덴트웹의 "픽스쳐 설정"과 같은 자리 -------------
   제조사 → 브랜드 → 사이즈를 미리 잡아두고, 대장에서는 고르기만 한다.
   사이즈는 병원이 부르는 대로 적는다(예: 3607 = Ø3.6×7). */
const MKINDS={
  fixtures:{ko:'픽스처', cols:['제조사','브랜드','사이즈'], keys:['maker','brand','size']},
  abutments:{ko:'어버트먼트', cols:['이름'], keys:['name']},
  healings:{ko:'힐링', cols:['이름'], keys:['name']},
  grafts:{ko:'골이식', cols:['이름'], keys:['name']},      // 골이식재·멤브레인·메쉬 — 비급여
  copings:{ko:'코핑', cols:['이름'], keys:['name']},        // 커스텀이 대세라 가끔 쓴다
};
// 국내에서 많이 쓰는 제조사 — 나머지는 직접 입력
const MAKERS=['오스템','네오','디오','메가젠','Dentium','스트라우만'];
function ensureMasters(){
  if(!DB.masters || typeof DB.masters!=='object') DB.masters={};
  Object.keys(MKINDS).forEach(k=>{ if(!Array.isArray(DB.masters[k])) DB.masters[k]=[]; });
}
function mLabel(k,r){ return MKINDS[k].keys.map(x=>r[x]).filter(Boolean).join(' '); }
function mUsable(k){ ensureMasters(); return DB.masters[k].filter(r=>!r.off); }

/* 재료 목록 한 줄 = 재고의 규격 하나.
   수량은 재고(DB.implants)에 있으므로, 목록에서 숫자를 고치면 그 규격의 재고를
   그대로 고친다. 아직 재고에 없는 항목이면 그때 만든다 — 손으로 추가한 항목이
   임플란트 탭에 안 보여서 수량이 안 들어가던 문제를 여기서 막는다. */
const MPART={fixtures:'픽스처', abutments:'어버트먼트', healings:'힐링캡', grafts:'골이식', copings:'코핑'};
function mStock(k,r,create){
  const lab=mLabel(k,r); if(!lab) return null;
  const f=findVar(lab); if(f) return f;                 // 대장이 쓰는 것과 같은 규격을 찾는다
  if(!create) return null;
  if(!Array.isArray(DB.implants)) DB.implants=[];
  const part=MPART[k]; let p, label;
  if(k==='fixtures'){
    const maker=(r.maker||'').trim(), brand=(r.brand||'').trim(); label=(r.size||'').trim();
    if(!label) return null;
    p=DB.implants.find(x=>x.part===part && x.brand===maker && (x.line||'')===brand);
    if(!p){ p={id:uid(), brand:maker, line:brand, part, vendor:'', price:0, note:'', variants:[]}; DB.implants.push(p); }
  } else {
    label=(r.name||'').trim(); if(!label) return null;
    p=DB.implants.find(x=>x.part===part && x.brand==='재료목록');
    if(!p){ p={id:uid(), brand:'재료목록', line:'', part, vendor:'', price:0, note:'', variants:[]}; DB.implants.push(p); }
  }
  let v=(p.variants||[]).find(x=>x.label===label);
  if(!v){ v={id:uid(), label, qty:0, minQty:2, lot:''}; p.variants.push(v); }
  return {p,v};
}
function mQtyOf(k,r){ const f=mStock(k,r,false); return f? (+f.v.qty||0) : 0; }
// 목록에서 적은 숫자가 곧 현재 재고다. 차이만큼 입·출고로 남겨 이력이 끊기지 않게 한다.
function mSetQty(k,r,n,memo){
  const want=Math.max(0,Math.round(+n||0));
  const f=mStock(k,r,true); if(!f) return false;
  const before=+f.v.qty||0; if(before===want) return true;
  f.v.qty=want;
  // 산 것이 아니라 손으로 맞춘 것이다. 매입에 얹으면 원가가 흐려진다.
  bumpAdj(f.v, want-before);
  implantLog(f.p.id, f.v.id, 'adjust', null, Math.abs(want-before), before, want, memo||'재료 목록에서 수량 조정');
  return true;
}

/* ---- 거래명세서 올리기 ---------------------------------------------------
   목록을 손으로 만들 필요가 없다. 어차피 매입은 기록해야 하니, 거래처가 준
   명세서를 그대로 올리면 브랜드·사이즈가 잡히고 입고까지 한 번에 된다. */
const PCOL={
  name:['품목명','품명','품목','제품명','상품명','내역','품목및규격','자재명','item','품목/규격'],
  size:['규격','사이즈','size','스펙','spec'],
  maker:['제조사','메이커','제조원','maker','brand','브랜드'],
  qty:['수량','입고수량','개수','qty','수'],
  price:['단가','공급가','공급가액','금액','단가(원)','price'],
  vendor:['거래처','업체','공급자','판매처','상호','공급처','vendor'],
  date:['일자','날짜','거래일자','거래일','입고일','date'],
  lot:['lot','로트','제조번호','lot번호','로트번호','lotno'],
};
function pKind(txt){
  const t=String(txt||'').toLowerCase();
  if(/힐링|healing/.test(t)) return 'healings';        // '힐링 어버트먼트'는 힐링이다 — 먼저 본다
  if(/코핑|coping|아날로그|analog|스캔바디|scanbody/.test(t)) return 'copings';
  if(/골이식|본그라프트|bone|멤브레인|membrane|메쉬|mesh|차폐막|graft/.test(t)) return 'grafts';
  if(/어버트|abut|지대주/.test(t)) return 'abutments';
  return 'fixtures';
}
// "Dentium SuperLine 4010" → 제조사 Dentium · 브랜드 SuperLine · 사이즈 4010
function splitFixture(name, sizeCol, makerCol){
  let maker=String(makerCol||'').trim(), size=String(sizeCol||'').trim(), rest=String(name||'').trim();
  if(!size){
    const t=rest.split(/[\s,·\/]+/).filter(Boolean);
    for(let i=t.length-1;i>=0;i--){
      if(/^[Øø⌀]?\d+(\.\d+)?([x×*]\d+(\.\d+)?)?$/i.test(t[i]) || /^\d{4}$/.test(t[i])){ size=t[i]; t.splice(i,1); break; }
    }
    rest=t.join(' ');
  }
  let brand=rest;
  if(!maker){
    const t=rest.split(/\s+/).filter(Boolean);
    if(t.length>=2){ maker=t[0]; brand=t.slice(1).join(' '); }
  }
  return {maker, brand, size};
}

function handlePurchase(ev){
  const f=ev.target.files[0]; if(!f) return;
  const isCsv=/\.csv$/i.test(f.name), r=new FileReader();
  r.onload=()=>{
    try{
      let rows;
      if(!isCsv && typeof XLSX!=='undefined'){
        const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      } else rows=parseCSV(typeof r.result==='string'?r.result:new TextDecoder('utf-8').decode(r.result));
      const lines=purchaseRows(rows);
      if(!lines.length){ toast('읽을 수 있는 품목이 없어요'); return; }
      previewPurchase(lines);
    }catch(e){ toast('파일을 읽지 못했어요. 양식을 확인해 주세요'); }
  };
  if(!isCsv && typeof XLSX!=='undefined') r.readAsArrayBuffer(f); else r.readAsText(f,'utf-8');
}
function purchaseRows(rows){
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(!rows.length) return [];
  const norm=s=>String(s||'').replace(/\s|\(.*?\)/g,'').toLowerCase();
  const header=rows[0].map(norm), idx={};
  for(const k in PCOL) idx[k]=header.findIndex(h=>PCOL[k].some(x=>norm(x)===h||(h&&h.includes(norm(x)))));
  const hasHeader = idx.name>=0 || idx.qty>=0;
  const body = hasHeader? rows.slice(1) : rows;
  const col = hasHeader? idx : {name:0,size:1,qty:2,price:3,vendor:4,date:5,lot:6,maker:-1};
  const pick=(r,k)=> (col[k]!=null && col[k]>=0)? r[col[k]] : undefined;
  const num=v=>{ const n=parseInt(String(v??'').replace(/[^\d-]/g,''),10); return isNaN(n)?0:n; };
  const nd=v=>{ const m=String(v??'').match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/); return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''; };
  const out=[];
  for(const r of body){
    const nm=String(pick(r,'name')??'').trim(); if(!nm) continue;
    if(/합\s*계|소\s*계|총\s*계|부가세/.test(nm)) continue;          // 합계 줄은 건너뛴다
    const kind=pKind(nm+' '+String(pick(r,'size')??''));
    const sp=splitFixture(nm, pick(r,'size'), pick(r,'maker'));
    const label = kind==='fixtures'? [sp.maker,sp.brand,sp.size].filter(Boolean).join(' ')
                                   : [nm,String(pick(r,'size')??'').trim()].filter(Boolean).join(' ');
    out.push({kind, ...sp, label, qty:Math.max(0,num(pick(r,'qty'))||1),
      price:Math.max(0,num(pick(r,'price'))), vendor:String(pick(r,'vendor')??'').trim(),
      date:nd(pick(r,'date')), lot:String(pick(r,'lot')??'').trim()});
  }
  return out;
}
let pPending=null;
function previewPurchase(lines){

  const isNew=l=>!(DB.masters[l.kind]||[]).some(r=>mLabel(l.kind,r)===l.label);
  const nNew=lines.filter(isNew).length, totQ=lines.reduce((s,l)=>s+l.qty,0);

    <div style="max-height:40vh;overflow:auto;margin-bottom:12px">

          <div class="tiny muted">${MKINDS[l.kind].ko}${l.lot?' · LOT '+esc(l.lot):''}${l.price?' · '+won(l.price):''}</div>

    </div>
    <button class="btn block" onclick="applyPurchase()">재료 목록에 넣고 입고 처리</button>`, openPurchase);
}
function applyPurchase(){
  if(!pPending) return;
  ensureMasters();
  let added=0, stocked=0;
  pPending.forEach(l=>{
    // 1) 재료 목록
    let row=(DB.masters[l.kind]||[]).find(r=>mLabel(l.kind,r)===l.label);
    if(!row){
      row = l.kind==='fixtures'? {id:uid(),maker:l.maker,brand:l.brand,size:l.size,off:false}
                               : {id:uid(),name:l.label,off:false};
      DB.masters[l.kind].push(row); added++;
    }
    // 2) 재고 제품·규격
    const part = {fixtures:'픽스처',abutments:'어버트먼트',healings:'힐링캡',grafts:'골이식',copings:'코핑'}[l.kind];
    let prod, vlabel;
    if(l.kind==='fixtures'){
      prod=(DB.implants||[]).find(x=>x.brand===l.maker && (x.line||'')===(l.brand||'') && x.part===part);
      if(!prod){ prod={id:uid(),brand:l.maker||'미지정',line:l.brand||'',part,vendor:l.vendor||'',price:l.price||0,note:'',variants:[]}; DB.implants.push(prod); }
      vlabel=l.size||l.label;
    } else {
      prod=(DB.implants||[]).find(x=>x.part===part && x.brand==='재료목록');
      if(!prod){ prod={id:uid(),brand:'재료목록',line:'',part,vendor:l.vendor||'',price:0,note:'',variants:[]}; DB.implants.push(prod); }
      vlabel=l.label;
    }
    if(l.vendor && !prod.vendor) prod.vendor=l.vendor;
    if(l.price && !prod.price) prod.price=l.price;
    let v=prod.variants.find(x=>x.label===vlabel);
    if(!v){ v={id:uid(),label:vlabel,qty:0,minQty:2,lot:''}; prod.variants.push(v); }
    // 3) 입고
    if(l.qty>0){
      const before=v.qty; v.qty=before+l.qty; v.inTot=(+v.inTot||0)+l.qty;
      if(l.lot) v.lot=l.lot;
      implantLog(prod.id,v.id,'in',null,l.qty,before,v.qty,`거래명세서${l.vendor?' · '+l.vendor:''}${l.date?' · '+l.date:''}`);
      stocked+=l.qty;
    }
  });
  // 4) 명세서 자체도 남긴다 — 세무조사 때 필요하다
  if(!Array.isArray(DB.purchases)) DB.purchases=[];
  DB.purchases.unshift({id:uid(), at:now(),
    date:(pPending.find(l=>l.date)||{}).date||todayKey(),
    vendor:(pPending.find(l=>l.vendor)||{}).vendor||'',
    lines:pPending.map(l=>({label:l.label,kind:l.kind,qty:l.qty,price:l.price,lot:l.lot}))});
  if(DB.purchases.length>300) DB.purchases=DB.purchases.slice(0,300);
  pPending=null; saveDB(); closeModal(); renderInvPage();
  toast(`새 규격 ${added}개 · 입고 ${stocked}개 반영했어요`);
}

/* ---- 대장에 적으면 재고가 준다 ------------------------------------------
   한 번 적으면 끝나야 한다. 수정하면 바뀐 만큼만 반영한다. */
function findVar(label){
  const t=String(label||'').replace(/\s+/g,' ').trim(); if(!t) return null;
  for(const p of (DB.implants||[])) for(const v of (p.variants||[])){
    const a=`${p.brand} ${p.line||''} ${v.label}`.replace(/\s+/g,' ').trim();
    const b=`${p.brand} ${v.label}`.replace(/\s+/g,' ').trim();
    if(a===t || b===t || v.label===t) return {p,v};
  }
  return null;
}
function caseTally(teeth, insur){
  const m=new Map();                                   // "규격|구분" → 개수
  (teeth||[]).forEach(t=>{
    const cat = t.fail? 'fail' : (insur==='보험'?'insurance':'normal');
    [t.fx,t.heal,t.ab].forEach(lb=>{ const k=String(lb||'').trim(); if(!k) return;
      const key=k+'|'+cat; m.set(key,(m.get(key)||0)+1); });
    // 골이식재는 부위마다 병 수가 다르다. 비급여라 보험 구분과 무관하게 일반으로 센다.
    const gq=Math.max(0,+t.graftQty||0), gk=String(t.graft||'').trim();
    if(gk && gq){ const key=gk+'|normal'; m.set(key,(m.get(key)||0)+gq); }
  });
  return m;
}
function applyCaseStock(oldT, oldIns, newT, newIns, memo){
  const a=caseTally(oldT,oldIns), b=caseTally(newT,newIns);
  let out=0, back=0, miss=0; const missing=new Set();
  new Set([...a.keys(),...b.keys()]).forEach(k=>{
    const d=(b.get(k)||0)-(a.get(k)||0); if(!d) return;
    const i=k.lastIndexOf('|'), label=k.slice(0,i), cat=k.slice(i+1);
    const f=findVar(label);
    if(!f){ if(d>0){ miss+=d; missing.add(label); } return; }
    const {p,v}=f, before=v.qty;
    if(d>0){                                            // 새로 쓴 만큼 뺀다
      v.qty=Math.max(0,v.qty-d);
      if(cat==='insurance') v.uIns=(+v.uIns||0)+d; else if(cat==='fail') v.uFail=(+v.uFail||0)+d; else v.uNor=(+v.uNor||0)+d;
      implantLog(p.id,v.id,'out',cat,d,before,v.qty,memo); out+=d;
    } else {                                            // 지웠으면 되돌린다
      const n=-d; v.qty=v.qty+n;
      if(cat==='insurance') v.uIns=Math.max(0,(+v.uIns||0)-n); else if(cat==='fail') v.uFail=Math.max(0,(+v.uFail||0)-n); else v.uNor=Math.max(0,(+v.uNor||0)-n);
      implantLog(p.id,v.id,'in',null,n,before,v.qty,memo+' 되돌림'); back+=n;
    }
  });
  return {out,back,miss,missing:[...missing]};
}

/* ---- 보험 페일 → 시술중지 안내 -----------------------------------------
   보험 케이스에 페일이 새로 적히면 공단 시술중지 등록을 물어본다.
   근거는 docs/INSURANCE_RULES.md 3장. 재시술 급여가 인정되는 길은
   시술중지 등록 → 재등록 뿐이고, 3단계(보철) 비용을 청구한 뒤에는
   중지 등록 자체가 막힌다. 되돌릴 수 없는 시점이 있고, 앱은 페일을 아는
   유일한 곳이라 그 앞에 설 수 있다.

   앱은 판정하지 않는다. 수가도 개수도 연령도 보지 않고 순서가 있다는
   사실만 알린다. 그래야 규정이 해마다 바뀌어도 이 안내가 틀리지 않는다.
   기한 조건도 걸지 않는다 — 모르는 기준으로 띄우면 양치기가 된다.

   이미 알린 페일에는 다시 뜨지 않는다. 케이스를 고칠 때마다 뜨면
   그것도 양치기다. 그래서 '새로 생긴' 페일만 센다. */
function newFails(oldT, oldIns, newT, newIns){
  if(newIns!=='보험') return [];              // 일반은 공단 등록이라는 것이 없다
  // 일반이던 케이스를 보험으로 바꾸면 옛 페일도 처음 알리는 것이 된다
  const seen = oldIns==='보험'
    ? new Set((oldT||[]).filter(t=>t.fail).map(t=>String(t.fdi)))
    : new Set();
  return (newT||[]).filter(t=>t.fail && !seen.has(String(t.fdi)))
                   .map(t=>String(t.fdi));
}

// 문구는 판정이 아니라 물음이다. 대신 결정해 주지 않는다.
//
// 저장 요약(토스트)을 안내 안으로 들여온 이유 — 토스트는 화면 아래 84px 에
// 고정인데 이 안내도 아래에서 올라오는 창이라, 둘이 겹쳐 정작 중요한
// '3단계 뒤에는 안 된다' 를 덮었다. 브라우저로 열어보고서야 보였다.
function failNotice(fdis, chart, summary){

      <div class="tiny">3단계(보철) 비용을 청구한 뒤에는 <b>중지 등록이 안 됩니다.</b></div>
    </div>
    <div class="tiny muted" style="margin:0 2px 14px">
      재시술 급여는 시술중지 등록 → 재등록을 거쳐야 인정됩니다.
      앱은 청구를 대신 판단하지 않습니다 — 순서가 있다는 것만 알립니다.
    </div>
    ${summary? `<div class="tiny muted" style="margin:-6px 2px 14px;padding-top:10px;border-top:1px solid var(--line)">${esc(summary)}</div>`:''}
    <button class="btn block" onclick="closeModal()">확인했습니다</button>`);
